packages:
  - 'client'
  - 'server'
  - 'packages/*'

# 워크스페이스 전체가 공유하는 버전은 여기 한 곳에만 적는다. 각 package.json 은
# `catalog:` 로 참조한다.
catalog:
  '@hookform/resolvers': '^5.4.0'
  '@monaco-editor/react': '^4.7.0'
  '@suspensive/react': '^3.21.3'
  '@tailwindcss/postcss': '^4.3.3'
  '@tanstack/react-query': '^5.101.4'
  '@tanstack/react-virtual': '^3.14.8'
  '@types/node': '^22.20.1'
  '@types/react': '^19.2.17'
  '@types/react-dom': '^19.2.3'
  agentation: '^3.0.2'
  axios: '^1.18.1'
  chart.js: '^4.5.1'
  es-toolkit: '^1.50.0'
  eslint: '^9.39.5'
  lucide-react: '^1.27.0'
  next-themes: '^0.4.6'
  overlay-kit: '^1.9.0'
  prettier: '^3.9.6'
  radix-ui: '^1.6.7'
  react: '^19.2.8'
  react-chartjs-2: '^5.3.1'
  react-dom: '^19.2.8'
  react-hook-form: '^7.82.0'
  react-resizable-panels: '^3.0.6'
  sonner: '^2.0.7'
  tailwind-merge: '^3.6.0'
  tailwindcss: '^4.3.3'
  typescript: '~5.9.3'
  zod: '^4.4.3'
  zustand: '^5.0.14'

# 카탈로그가 닿지 않는 전이 의존성만 여기서 고정한다. typescript 는 @nestjs/cli 의
# fork-ts-checker-webpack-plugin 이 별도 사본을 끌어와서 필요하다.
# postcss 와 sharp 는 next 가 각각 8.4.31 정확히 / ^0.34 로 묶어두어
# 범위 안에서는 보안 권고를 벗어날 수 없다.
# js-yaml 5.x 는 @nestjs/swagger 가 끌어온다.
overrides:
  typescript: 'catalog:'
  postcss: '^8.5.23'
  sharp: '^0.35.3'
  'js-yaml@5': '^5.2.2'

packageExtensions:
  '@hookform/resolvers':
    peerDependencies:
      zod: '*'
  eslint-config-next:
    dependencies:
      next: '*'

allowBuilds:
  # @nestjs/cli 의 webpack 이 terser-webpack-plugin 을 통해 끌어온다.
  esbuild: true
  bcrypt: true
  sharp: true
  unrs-resolver: true
  '@nestjs/core': false
  '@scarf/scarf': false
