# 223 서버(내부망, HTTP) 배포용.
services:
  union-twin-fe:
    image: 172.16.28.217:12000/union-twin-fe:latest
    restart: always
    depends_on:
      - union-twin-be
    environment:
      - UNION_TWIN_BFF_URL=http://union-twin-be:4000
      # 223은 HTTP 운영이라 Secure 쿠키를 끈다 (HTTPS 배포에서는 설정하지 않음 → 기본 true)
      - COOKIE_SECURE=false
      - NDXPRO_API_URL=http://220.124.222.90:54002
      - VIEWER_URL=http://220.124.222.90:50038
      - NDXPRO_TOKEN=${NDXPRO_TOKEN}
      - DTMETA_API_URL=http://dtmeta.fedit.or.kr:16997
      # KETI 발급 PAT(meta_admin). 만료값이 없어 배포 .env로 주입한다.
      - DTMETA_TOKEN=${DTMETA_TOKEN}
      # KETI 동기화 엔진(연합 디지털 브레인). 인증 없음. 수집 토픽 조회용.
      - FDT_SYNC_API_URL=http://220.124.222.84:1221
    ports:
      - '50031:3000'
    networks:
      - ndxpro

  union-twin-be:
    image: 172.16.28.217:12000/union-twin-be:latest
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - TZ=UTC
      - DB_HOST=host.docker.internal
      - DB_PORT=55432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=union_twin
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD:-}
    ports:
      - '50032:4000'
    networks:
      - ndxpro

networks:
  ndxpro:
    external: true
