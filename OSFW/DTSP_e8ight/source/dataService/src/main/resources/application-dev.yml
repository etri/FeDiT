server:
  port: 8081
spring:
  application:
    name: DATASERVICE-SERVICE

  sleuth:
    sampler:
      probability: 1.0
  zipkin:
    base-url: http://localhost:9411

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

databroker:
  url: ${DATABROKER_URL}
  api-path: "/ndxpro/v1/broker/entities"

logging:
  logstash:
    url: localhost:50000

# API 목록을 알파벳순으로 정렬
springdoc:
  swagger-ui:
    tagsSorter: alpha

internal-api:
  token: ${INTERNAL_API_TOKEN:}

# JSON-LD context 서버 주소
ndxpro:
  context:
    server-url: ${CONTEXT_SERVER_URL:http://localhost:3005}
