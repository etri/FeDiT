server:
  port: 54004

eureka:
  client:
    enabled: false

spring:
  jpa:
    generate-ddl: 'true'
    database: h2
    hibernate:
      ddl-auto: create
    show-sql: true
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS NGSI_TRANSLATOR
    username: ndxpro
    password:
  sleuth:
    enabled: false
  zipkin:
    enabled: false
  h2:
    console:
      enabled: true

translator:
  dir: ./translatorJars
  kafka-url: ${KAFKA_URL}
  default:
    poll-duration: 300
    target-topic: ngsild_topic
  inspector:
    inspect-duration: 10000
    threshold: 60000

data-ingest:
  url: http://localhost:54003/ndxpro/v1/ingest
data-manager:
  url: ${GATEWAY_URL}/ndxpro/v1/manager
translator-builder:
  url: ${GATEWAY_URL}/ndxpro/v1/translator-builder
gateway:
  url: ${GATEWAY_URL}
auth:
  url: ${gateway.url}/ndxpro/v1/auth

logging:
  logstash:
    url: ${LOGSTASH_URL}