plugins {
    id 'java'
}

version 'unspecified'

repositories {
    mavenCentral()
}

configurations {
    // Flume 에이전트 실행 시 plugins.d/agent/libext 에 넣는 외부 라이브러리
    agentLib {
        transitive = false
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'

    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'org.apache.flume:flume-ng-core:1.10.1'
    implementation 'org.apache.flume.flume-ng-sinks:flume-ng-kafka-sink:1.10.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.18.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.18.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.6.1'
    implementation 'org.json:json:20250517'
    implementation 'com.squareup.okhttp3:okhttp:3.14.4'

    agentLib 'org.apache.commons:commons-lang3:3.12.0'
    agentLib 'org.json:json:20250517'
    agentLib 'org.apache.logging.log4j:log4j-layout-template-json:2.18.0'
    agentLib 'com.squareup.okhttp3:okhttp:3.14.1'
    agentLib 'com.squareup.okio:okio:1.17.2'
}

// 저장소에 jar를 두지 않고 빌드 시 받아서 build/agentLib 에 모은다 (Dockerfile 에서 libext 로 복사)
tasks.register('copyAgentLib', Copy) {
    from configurations.agentLib
    into "$buildDir/agentLib"
}

tasks.named('build') {
    dependsOn 'copyAgentLib'
}

test {
    useJUnitPlatform()
}