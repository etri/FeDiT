openapi: 3.0.3
info:
  title: NDXPRO Data Ingest - Agent Management API
  description: |
    Flume Agent 관리 API (`AgentController`).

    ## Agent 타입
    | type | source | 목적지 | 생존 신호 |
    |---|---|---|---|
    | `HTTP` / `HTTPS` | HttpSource (폴링 수집) | SignalableKafkaSink | 보냄 |
    | `KAFKA` | 외부 Kafka (KafkaSource) | KafkaChannel (sink 없음) | 안 보냄 |

    타입에 따라 필수 요청 필드가 다릅니다. 아래 `AgentRequestDto` 설명 참고.

    ## conf 파일
    Agent 생성/수정 시 flume `.conf` 파일이 요청 필드로부터 자동 생성됩니다.
    `PUT /agents/{agentId}/config` 로 이 파일을 직접 편집할 수 있으며,
    편집한 agent 는 `isCustomConfig=true` 가 되어 이후 `PUT /agents/{agentId}` 가
    `regenerateConfig=true` 없이는 거부됩니다.
  version: "1.1"

servers:
  - url: /ndxpro/v1/ingest
    description: agentManager

tags:
  - name: Agent Management Controller
    description: Flume Agent 관리 API 그룹입니다.

paths:
  /agents:
    post:
      tags: [Agent Management Controller]
      summary: 데이터 수집용 Flume 에이전트 생성
      description: |
        Agent 를 생성하고 flume conf 파일을 만듭니다. 생성 직후 상태는 `CREATED` 이며 기동되지 않습니다.
        기동하려면 `PATCH /agents/{agentId}` 를 호출하세요.
      operationId: createAgent
      parameters:
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRequestDto'
            examples:
              http:
                summary: HTTP 수집 agent
                value:
                  name: vehicleAgent
                  type: HTTP
                  models:
                    - modelType: Vehicle
                      context: http://172.16.28.220:3005/e8ight-context-v1.01.jsonld
                  urlAddress: http://1.233.183.202:51002
                  connTerm: "10"
                  method: GET
                  isCustomTopic: false
              kafka:
                summary: 외부 Kafka 수집 agent
                value:
                  name: FDO_F-KR-109941-0020
                  type: KAFKA
                  models:
                    - modelType: Vehicle
                      context: http://172.16.28.220:3005/e8ight-context-v1.01.jsonld
                  urlAddress: 220.124.222.84:9092
                  sourceTopic: FDO_F-KR-109941-0020
                  isCustomTopic: true
                  topic: fdt_topic
      responses:
        '201':
          description: 생성 성공
          headers:
            Location:
              description: 생성된 agent 의 경로
              schema:
                type: string
                example: /agents/28
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Agent Management Controller]
      summary: Flume 에이전트 리스트 조회
      operationId: getAgentList
      parameters:
        - name: status
          in: query
          required: false
          description: Agent 상태로 필터링
          schema:
            $ref: '#/components/schemas/AgentStatus'
        - name: name
          in: query
          required: false
          description: 이름 부분 일치 검색
          schema:
            type: string
            example: vehicle
        - name: curPage
          in: query
          required: false
          description: 조회할 페이지 번호
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          description: 페이지 크기
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'

  /agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/AgentId'

    patch:
      tags: [Agent Management Controller]
      summary: Flume 에이전트 동작 (실행, 중지, 재실행)
      description: |
        flume-ng 프로세스를 기동/중지합니다. conf 파일이 없으면 실패합니다.

        - `run` : 이미 `RUN` 또는 `HANG` 이면 거부
        - `stop` : 프로세스 종료
        - `rerun` : 중지 후 재기동

        `bodyInfo` 는 HTTP agent 의 POST body 파라미터를 `-D` 시스템 프로퍼티로 전달할 때만 사용합니다.
      operationId: operateAgent
      parameters:
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequestDto'
            examples:
              run:
                summary: 실행
                value:
                  operation: run
              runWithBody:
                summary: POST body 파라미터와 함께 실행
                value:
                  operation: run
                  bodyInfo:
                    fromDtm:
                      value: "20230502000000"
                      type: STRING
                      incremental: true
      responses:
        '200':
          description: 동작 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Agent Management Controller]
      summary: Flume 에이전트 수정
      description: |
        Agent 정보를 수정하고 conf 파일을 **재생성**합니다.

        - 실행 중(`RUN`/`HANG`)이면 거부됩니다. 먼저 중지하세요.
        - conf 를 직접 편집한 agent(`isCustomConfig=true`)는 편집 내용이 사라지므로 거부됩니다.
          버리고 재생성하려면 `regenerateConfig=true` 를 주세요. 성공 시 `isCustomConfig` 는 `false` 로 돌아갑니다.
        - 덮어쓰기 전 기존 conf 는 `{conf파일}.bak` 으로 백업됩니다.
      operationId: updateAgent
      parameters:
        - name: regenerateConfig
          in: query
          required: false
          description: 직접 편집된 config 를 버리고 재생성할지 여부
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRequestDto'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Agent Management Controller]
      summary: Flume 에이전트 제거
      description: |
        Agent 상태를 `DELETED` 로 바꾸고 연계된 translator 를 제거합니다.
        실행 중이면 거부됩니다. **conf 파일은 삭제되지 않습니다.**
      operationId: deleteAgent
      parameters:
        - $ref: '#/components/parameters/Authorization'
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponseDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /agents/{agentId}/config:
    put:
      tags: [Agent Management Controller]
      summary: Flume 에이전트 conf 파일 직접 수정
      description: |
        생성된 flume conf 파일을 사용자가 직접 편집한 내용으로 교체합니다.

        **제약**
        - 실행 중(`RUN`/`HANG`)이면 거부됩니다. flume 은 conf 를 다시 읽지 않으므로
          실행 중 편집해도 반영되지 않기 때문입니다.
        - `DELETED` 상태면 거부됩니다.
        - 덮어쓰기 전 `{conf파일}.bak` 으로 자동 백업됩니다.
        - 성공하면 `isCustomConfig` 가 `true` 가 되고, 편집 이력이 agent history 에 기록됩니다.

        **검증되는 필수 항목** (어기면 400)

        | 항목 | HTTP / HTTPS | KAFKA |
        |---|---|---|
        | agent 이름 prefix | 필수 | 필수 |
        | `{name}.sources`, `{name}.channels` | 필수 | 필수 |
        | `{name}.sinks` | 필수 | — |
        | `sources.src.AGENT_ID`, `sinks.sink_kafka.AGENT_ID` | agent id 와 일치 | — |
        | kafka topic | `sinks.sink_kafka.kafka.topic` 이 DB 값과 일치 | `channels.ch_kafka.kafka.topic` 이 DB 값과 일치 |

        그 외 값(`CONN_TERM`, consumer group, `auto.offset.reset`, 채널 용량 등)은 자유롭게 편집할 수 있습니다.

        prefix 와 `AGENT_ID` 를 검증하는 이유: prefix 가 어긋나면 flume-ng 이 설정을 찾지 못한 채
        **에러 없이 종료**하고, `AGENT_ID` 가 빠지면 생존 신호가 끊겨 정상 동작 중인 agent 가
        `HANG`/`DIED` 로 오판됩니다.
      operationId: updateAgentConfig
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigRequestDto'
            examples:
              kafka:
                summary: KAFKA agent conf
                value:
                  confFileContents: "# Define the agent name\nmyAgent.sources = source1\nmyAgent.channels = ch_kafka\n\n# Define source\nmyAgent.sources.source1.type = org.apache.flume.source.kafka.KafkaSource\nmyAgent.sources.source1.channels = ch_kafka\nmyAgent.sources.source1.kafka.bootstrap.servers = 220.124.222.84:9092\nmyAgent.sources.source1.kafka.topics = FDO_F-KR-109941-0020\n\nmyAgent.sources.source1.kafka.consumer.group.id = fdt-consumer-group\nmyAgent.sources.source1.kafka.consumer.auto.offset.reset = latest\n\n\n# Define channel\nmyAgent.channels.ch_kafka.type = org.apache.flume.channel.kafka.KafkaChannel\nmyAgent.channels.ch_kafka.kafka.bootstrap.servers = pipeline-kafka-1:19092\nmyAgent.channels.ch_kafka.kafka.topic = fdt_topic\nmyAgent.channels.ch_kafka.parseAsFlumeEvent = false\n"
      responses:
        '200':
          description: 수정 성공. `confFileContents` 에 저장된 내용이 그대로 반환됩니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /agent/{agentId}:
    get:
      tags: [Agent Management Controller]
      summary: Flume 에이전트 ID로 단건 조회
      description: conf 파일 내용을 읽어 `confFileContents` 에 담아 반환합니다.
      operationId: getAgent
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponseDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /agent:
    get:
      tags: [Agent Management Controller]
      summary: Flume 에이전트 이름으로 단건 조회
      operationId: getAgentByName
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
            example: VehicleAgent
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponseDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /agents/{agentId}/attribute-sources:
    parameters:
      - $ref: '#/components/parameters/AgentId'

    post:
      tags: [Agent Management Controller]
      summary: Agent attribute source 추가
      operationId: addAgentAttributeSources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeSourceAddRequestDto'
      responses:
        '200':
          description: 추가 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeSourceDto'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      tags: [Agent Management Controller]
      summary: Agent attribute source 조회
      operationId: getAgentAttributeSources
      parameters:
        - name: modelType
          in: query
          required: true
          schema:
            type: string
            example: Vehicle
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttributeSourceDto'
        '404':
          $ref: '#/components/responses/NotFound'

  /agents/{agentId}/attribute-sources/{attributeSourceId}:
    delete:
      tags: [Agent Management Controller]
      summary: Agent attribute source 삭제
      operationId: deleteAgentAttributeSources
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - name: attributeSourceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: 삭제 성공

components:
  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      description: Agent ID
      schema:
        type: integer
        format: int64
        example: 1

    Authorization:
      name: Authorization
      in: header
      required: true
      description: 인증 토큰
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        잘못된 요청. 필수 필드 누락, 타입별 필수 값 누락(KAFKA 의 `sourceTopic` 등),
        conf 파일 검증 실패, 실행 중 수정 시도 등.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 해당 ID 의 agent 가 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: conf 파일 읽기/쓰기/백업 실패 등 서버 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AgentType:
      type: string
      description: |
        Agent 타입.
        - `HTTP` / `HTTPS` : URL 폴링 수집. `connTerm`, `method` 필수
        - `KAFKA` : 외부 Kafka 수집. `sourceTopic` 필수
      enum: [HTTP, HTTPS, KAFKA]
      example: HTTP

    AgentStatus:
      type: string
      description: |
        - `CREATED` : 생성됨, 미기동
        - `RUN` : 실행 중
        - `STOP` : 중지됨
        - `HANG` : 프로세스는 살아있으나 생존 신호 끊김 (HTTP/HTTPS 만 해당)
        - `DIED` : 프로세스 종료됨
        - `DELETED` : 삭제됨
      enum: [CREATED, RUN, STOP, DELETED, HANG, DIED]
      example: RUN

    JsonType:
      type: string
      enum: [STRING, NUMBER, BOOLEAN]

    DataModelDto:
      type: object
      properties:
        modelType:
          type: string
          example: Vehicle
        context:
          type: string
          example: http://172.16.28.220:3005/e8ight-context-v1.01.jsonld

    JsonField:
      type: object
      description: HTTP agent 의 POST body 파라미터 하나
      properties:
        value:
          description: 값 (타입은 `type` 에 따름)
          example: "20230502000000"
        type:
          $ref: '#/components/schemas/JsonType'
        incremental:
          type: boolean
          description: 호출마다 증가시킬지 여부
          example: true

    AgentRequestDto:
      type: object
      required: [name, type, models, urlAddress, isCustomTopic]
      properties:
        name:
          type: string
          description: |
            Agent 이름. flume conf 의 prefix 이자 `flume-ng agent -n` 값으로 쓰이므로
            conf 를 직접 편집할 때도 이 값과 어긋나면 안 됩니다.
          example: demo
        type:
          $ref: '#/components/schemas/AgentType'
        models:
          type: array
          description: Agent 가 수집할 데이터의 모델 정보. 모든 타입에서 필수입니다.
          minItems: 1
          items:
            $ref: '#/components/schemas/DataModelDto'
        urlAddress:
          type: string
          description: |
            - `HTTP`/`HTTPS` : 데이터를 수집할 URL
            - `KAFKA` : 수집 대상 Kafka 의 bootstrap servers
          example: http://1.233.183.202:51002
        connTerm:
          type: string
          description: 수집 주기(초). **HTTP/HTTPS 필수**, KAFKA 는 사용하지 않음
          example: "10"
        method:
          type: string
          description: HTTP method. **HTTP/HTTPS 필수**, KAFKA 는 사용하지 않음
          example: GET
        body:
          type: string
          description: HTTP request body. 선택
        sourceTopic:
          type: string
          description: 수집 대상 Kafka topic. **KAFKA 필수**
          example: FDO_F-KR-109941-0020
        isCustomTopic:
          type: boolean
          description: |
            목적지 topic 을 직접 지정할지 여부.
            `false` 면 `ndxpro.ingest.agent_{id}` 가 자동 부여되고, `true` 면 `topic` 이 필수입니다.
          example: false
        topic:
          type: string
          description: 목적지 topic. `isCustomTopic=true` 일 때 필수
          example: dev.pintel.simul.org.vehicle.json

    AgentConfigRequestDto:
      type: object
      required: [confFileContents]
      properties:
        confFileContents:
          type: string
          description: |
            직접 편집한 flume conf 파일 **전체** 내용. 부분 수정이 아니라 통째로 교체합니다.
            JSON 문자열이므로 줄바꿈은 `\n` 으로 이스케이프해야 합니다.

    AgentResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 28
        name:
          type: string
          example: demo
        status:
          $ref: '#/components/schemas/AgentStatus'
        type:
          $ref: '#/components/schemas/AgentType'
        models:
          type: array
          items:
            $ref: '#/components/schemas/DataModelDto'
        pid:
          type: integer
          format: int64
          nullable: true
          description: 실행 중인 flume 프로세스의 pid
        lastSourceSignalReceivedAt:
          type: string
          format: date-time
          nullable: true
          description: 마지막 source 생존 신호 시각. KAFKA 는 신호를 보내지 않습니다.
        lastSinkSignalReceivedAt:
          type: string
          format: date-time
          nullable: true
          description: 마지막 sink 생존 신호 시각. KAFKA 는 신호를 보내지 않습니다.
        confFileContents:
          type: string
          nullable: true
          description: conf 파일 내용. 단건 조회/생성/수정 시에만 채워지고 리스트 조회에서는 `null` 입니다.
        isCustomTopic:
          type: boolean
        topic:
          type: string
          description: 목적지 kafka topic
        isCustomConfig:
          type: boolean
          description: |
            conf 파일을 사용자가 직접 편집했는지 여부.
            `true` 면 `PUT /agents/{agentId}` 가 `regenerateConfig=true` 없이는 거부됩니다.
        urlAddress:
          type: string
          description: 응답에서 값이 없으면 생략됩니다
        connTerm:
          type: string
          description: HTTP/HTTPS 만. 값이 없으면 생략됩니다
        method:
          type: string
          description: HTTP/HTTPS 만. 값이 없으면 생략됩니다
        body:
          type: string
          description: HTTP/HTTPS 만. 값이 없으면 생략됩니다
        sourceTopic:
          type: string
          description: KAFKA 만. 값이 없으면 생략됩니다

    AgentListResponseDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentResponseDto'
        totalData:
          type: integer
          format: int64
          description: 전체 건수
        totalPage:
          type: integer
          description: 전체 페이지 수

    OperationRequestDto:
      type: object
      required: [operation]
      properties:
        operation:
          type: string
          description: 대소문자 구분 없음
          enum: [run, stop, rerun]
          example: run
        bodyInfo:
          type: object
          nullable: true
