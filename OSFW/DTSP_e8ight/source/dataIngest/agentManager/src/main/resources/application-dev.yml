spring:
  jpa:
    generate-ddl: 'true'
    database: postgresql
    hibernate:
      ddl-auto: create
  datasource:
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: '20'
    username: ${POSTGRES_USER}
    url: ${DATASOURCE_URL}

agent-manager:
  kafka-url: ${KAFKA_URL}
  inspector:
    inspect-delay: 10000
    threshold: 60000

translator-manager:
  url: ${TRANSLATOR_MANAGER_URL}/ndxpro/v1/translator
data-manager:
  url: ${DATAMANAGER_URL}/ndxpro/v1/manager

internal-api:
  token: ${INTERNAL_API_TOKEN:}
