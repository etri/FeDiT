plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.2'
    id 'io.spring.dependency-management' version '1.1.2'
    id 'com.google.cloud.tools.jib' version '3.3.2'
}

group = 'kr.co.e8ight.ndxpro'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '20'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    maven {
        url 'http://172.16.28.217:9081/repository/maven-releases/'
        allowInsecureProtocol = true
        credentials {
            username = "admin"
            password = "ndxpro123!"
        }
    }
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    //ndxpro common
    implementation 'kr.co.e8ight.ndxpro:ndxpro_common:0.1.0'

    //QueryDsl
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    //apache tika
    implementation 'org.apache.tika:tika-core:2.9.0'

    //swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'

    //eureka
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client:4.0.3'
}

jib {
    from {
        image = "openjdk:21-jdk-slim"
    }
    to {
        image = "172.16.28.217:12000/ndxpro-file-service"
        tags = ["v1.2"]
        auth {
            username = "admin"
            password = "ndxpro123!"
        }
    }
    container {
        jvmFlags = List.of(
                "-Dcom.sun.management.jmxremote=true",
                "-Dcom.sun.management.jmxremote.port=8081",
                "-Dcom.sun.management.jmxremote.authenticate=false",
                "-Dcom.sun.management.jmxremote.ssl=false",
                "-Djava.rmi.server.hostname=172.16.28.223",
                "-Dcom.sun.management.jmxremote.rmi.port=8081",
                "-Dcom.sun.management.jmxremote.local.only=false"
        )
    }

    allowInsecureRegistries = true
}

tasks.named('test') {
    useJUnitPlatform()
}
