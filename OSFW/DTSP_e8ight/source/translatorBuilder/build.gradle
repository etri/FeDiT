plugins {
    id 'org.springframework.boot' version '2.7.3'
    id 'io.spring.dependency-management' version '1.0.13.RELEASE'
    id 'java'
    id 'com.google.cloud.tools.jib' version '3.2.1'
}

group = 'kr.co.e8ight.ndxpro'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'

repositories {
    maven {
        url = (project.findProperty('nexusUrl') ?: System.getenv('NEXUS_URL'))
        allowInsecureProtocol = true
        credentials {
            username = (project.findProperty('nexusUsername') ?: System.getenv('NEXUS_USERNAME') ?: '')
            password = (project.findProperty('nexusPassword') ?: System.getenv('NEXUS_PASSWORD') ?: '')
        }
    }
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client:3.1.4'
    implementation 'org.springdoc:springdoc-openapi-ui:1.5.13'

    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'kr.co.e8ight.ndxpro:ndxpro_common:0.0.4'

    //logstash encoder
    implementation group: 'net.logstash.logback', name: 'logstash-logback-encoder', version: '7.0.1'

    //sleuth & zipkin
    implementation 'org.springframework.cloud:spring-cloud-starter-sleuth:3.1.1'
    implementation 'org.springframework.cloud:spring-cloud-sleuth-zipkin:3.1.1'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 컨테이너 안에서 translatorSource를 오프라인 빌드할 때 쓰는 Gradle 의존성 캐시(modules-2).
// 저장소에 jar를 커밋하지 않고, 이미지 빌드 시점에 translatorSource 의존성을 받아 만든다.
def translatorGradleHome = file("$buildDir/translatorGradleHome")

tasks.register('prepareTranslatorLib', Exec) {
    workingDir 'translatorSource'
    commandLine './gradlew', 'build', '--no-build-cache', '--gradle-user-home', translatorGradleHome.absolutePath
}

['jibDockerBuild', 'jibBuildTar', 'jib'].each { name ->
    tasks.named(name) {
        dependsOn 'prepareTranslatorLib'
        doFirst {
            copy {
                from("translatorSource/") {
                    exclude 'build/**', '.gradle/**'
                }
                into("src/main/jib/translatorSource/")
            }
            copy {
                from("$translatorGradleHome/caches/modules-2/") {
                    exclude '*.lock', 'gc.properties'
                }
                into("src/main/jib/root/.gradle/caches/modules-2/")
            }
        }
        doLast {
            delete("src/main/jib/translatorSource/")
            delete("src/main/jib/root/.gradle/caches/modules-2/")
        }
    }
}

jib {
    from{
        image = "openjdk:11.0.14"
    }
    to {
        image = "${(project.findProperty('dockerRegistry') ?: System.getenv('DOCKER_REGISTRY'))}/ndxpro-translatorbuilder"
        tags = ["v1.1.1"]
        auth {
            username = (project.findProperty('nexusUsername') ?: System.getenv('NEXUS_USERNAME') ?: '')
            password = (project.findProperty('nexusPassword') ?: System.getenv('NEXUS_PASSWORD') ?: '')
        }
        container {
            mainClass ="kr.co.e8ight.ndxpro.translatorbuilder.TranslatorBuilderApplication"
            ports = ["9901"]
            environment = ["TZ" : "Asia/Seoul"]
        }
    }
    extraDirectories {
        permissions = ["/translatorSource/gradlew":"744"]
    }
    setAllowInsecureRegistries(true)
}