server:
  port: 8080
spring:
  application:
    name: DATABROKER-SERVICE

  data:
    mongodb:
      uri: ${MONGODB_URI}
      databaseName: "ndxpro"

  kafka:
    bootstrap-servers: ${KAFKA_URL}
    topic:
      entity: ngsild.topic
      observedAt: dongeun.observedat
    consumer:
      group: e8ight-group_record

  cache:
    type: caffeine
  redis:
    host: 127.0.0.1
    port: 6379
    password: ${REDIS_PASSWORD}

  sleuth:
    sampler:
      probability: 0.0
  zipkin:
    base-url: http://localhost:9411

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    enabled: false

datamanager:
  url: ${DATAMANAGER_URL}
  #  url: "http://localhost:8080"
  api-path:
    data-models: "/ndxpro/v1/manager/data-models"
    attributes: "/ndxpro/v1/manager/attributes"

logging:
  level:
    org:
      springframework:
        data:
          mongodb:
            core:
              MongoTemplate: DEBUG
        cache: TRACE
  logstash:
    url: localhost:50000