# 연합트윈 서비스 리버스 프록시.
# union-twin-fe 는 호스트 포트를 열지 않으므로, 이 nginx 가 같은 ndxpro 네트워크
# 안에서 컨테이너 이름(union-twin-fe)으로 접근한다.

upstream union_twin_fe { server union-twin-fe:50028; }
upstream fdt_viewer    { server fdt-service:8050; }

server {
    listen 80;
    server_name _;

    # HTTPS 를 쓰는 경우 아래 한 줄만 남기고 443 서버 블록을 사용한다.
    # return 301 https://$host$request_uri;

    client_max_body_size 2048m;      # 3D 모델/첨부 업로드 용량. 필요에 맞게 조정.
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://union_twin_fe;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;   # WebSocket
        proxy_set_header Connection        "upgrade";
    }

    location /viewer/ {
        proxy_pass http://fdt_viewer/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

