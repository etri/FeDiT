# -----------------------------------------------------------------------------
# (개발용) 로컬 PC(macOS / Apple Silicon 포함)에서 연합트윈 화면만 띄운다.
#   docker compose --env-file ../.env -f front/compose-local.yml up -d
#   →  http://localhost:50028
#
#  운영과의 차이
#   - Postgres 를 로컬 컨테이너로 분리한다(운영 union_twin 스키마 보호). 포트 55433.
#   - NDXPro 백엔드/뷰어는 서버(${HOST}) 것을 그대로 사용한다.
#   - watchtower 없음, fe 포트를 호스트에 직접 공개.
#   - ndxpro 외부 네트워크가 아니라 이 파일 전용 네트워크를 쓴다.
# -----------------------------------------------------------------------------
name: union-twin-local

services:
  postgres-local:
    container_name: union-twin-postgres-local
    image: ${IMG_POSTGRES}
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      APP_USER: ${POSTGRES_USER}
      APP_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB: ${POSTGRES_DB}
      UNION_TWIN_DB: ${UNION_TWIN_DB}
      TZ: ${TZ}
    volumes:
      - union-twin-pgdata:/var/lib/postgresql/data
      - ./init-postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "55433:5432"        # 운영 55432 와 헷갈리지 않도록 일부러 다른 포트
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  union-twin-be:
    container_name: union-twin-be-local
    image: ${IMAGE_REPO_URL}/union-twin-be:${TAG_UNION_TWIN_BE:-${IMAGE_TAG}}
    platform: linux/amd64   # Apple Silicon 에서 amd64 이미지 실행(Rosetta)
    restart: unless-stopped
    environment:
      DB_HOST: postgres-local
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${UNION_TWIN_DB}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost:${PORT_UNION_TWIN_FE}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${PORT_UNION_TWIN_BE}:4000"
    depends_on:
      postgres-local:
        condition: service_healthy

  union-twin-fe:
    container_name: union-twin-fe-local
    image: ${IMAGE_REPO_URL}/union-twin-fe:${TAG_UNION_TWIN_FE:-${IMAGE_TAG}}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      UNION_TWIN_BFF_URL: http://union-twin-be:4000
      PORT: ${PORT_UNION_TWIN_FE}
      NDXPRO_API_URL: http://${HOST}:${PORT_GATEWAY}
      NDXPRO_TOKEN: ${NDXPRO_TOKEN}
      VIEWER_URL: http://${HOST}:${PORT_FDT_SERVICE}
      DTMETA_API_URL: ${DTMETA_API_URL}
      DTMETA_TOKEN: ${DTMETA_TOKEN}
      FDT_SYNC_API_URL: ${FDT_SYNC_API_URL}
      TZ: ${TZ}
    ports:
      - "${PORT_UNION_TWIN_FE}:${PORT_UNION_TWIN_FE}"
    depends_on:
      - union-twin-be

volumes:
  union-twin-pgdata:
    name: union-twin-pgdata
