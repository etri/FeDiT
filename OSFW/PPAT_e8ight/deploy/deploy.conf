# ==================================================
# 배포 설정 파일 (deploy.conf)
# ==================================================

# 내부 배포 서버 정보
INTERNAL_DEPLOY_USER=e8ight
INTERNAL_DEPLOY_HOST=172.16.37.55
INTERNAL_DEPLOY_DIR=/home/e8ight/web-pre/preprocessor

# 내부 배포 서버 비밀번호
# 보안을 위해 스크립트 실행 시 수동으로 입력합니다.
# 자동화가 필요한 경우: INTERNAL_DEPLOY_PASSWORD=your_password 추가
INTERNAL_DEPLOY_PASSWORD=e8ight!


# 외부 배포 서버 정보
EXTERNAL_DEPLOY_USER=e8ight
EXTERNAL_DEPLOY_HOST=172.16.38.8
EXTERNAL_DEPLOY_DIR=/home/e8ight/web-pre/preprocessor

# 외부 배포 서버 비밀번호
# 보안을 위해 스크립트 실행 시 수동으로 입력합니다.
# 자동화가 필요한 경우: EXTERNAL_DEPLOY_PASSWORD=your_password 추가

# 외부2 배포 서버 정보
EXTERNAL2_DEPLOY_USER=e8ight
EXTERNAL2_DEPLOY_HOST=172.16.38.10
EXTERNAL2_DEPLOY_DIR=/home/e8ight/web-pre/preprocessor

# 외부2 배포 서버 비밀번호
# 보안을 위해 스크립트 실행 시 수동으로 입력합니다.
# 자동화가 필요한 경우: EXTERNAL2_DEPLOY_PASSWORD=your_password 추가

# 로컬 Docker 이미지 정보
IMAGE_NAME=iitp-pre-web
IMAGE_TAG=latest
# TAR_FILE_NAME은 자동 생성됨: {IMAGE_NAME}.tar

# Docker Desktop 실행 파일 경로 (Windows 기본 경로)
DOCKER_DESKTOP_PATH=C:\Program Files\Docker\Docker\Docker Desktop.exe

# 전송할 파일 목록 (쉼표로 구분)
# 참고: {IMAGE_NAME}은 자동으로 현재 IMAGE_NAME 값으로 치환됩니다
FILES_TO_TRANSFER=docker-compose.yml,.env,{IMAGE_NAME}.tar
