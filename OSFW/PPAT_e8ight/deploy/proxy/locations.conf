# 앞단의 길 나누기. default.conf 의 https(443)·안쪽 확인용(8080) 두 server 가 함께 읽는다.
# 환경 변수를 쓰지 않는 고정 파일이다. 안쪽 주소는 server 에서 정한 $renderer_upstream · $engine_upstream 을 쓴다.
# 페이지는 모두 상대 주소(engine/..., results/...)로 부르므로, 이 길 이름을 바꾸면 src/data/engineApi.ts 도 함께 바꾼다.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 페이지(정적 파일). 캐시·보안·iframe 허용 헤더는 renderer 가 붙인 것을 그대로 넘긴다
location / {
    proxy_pass $renderer_upstream;
}

# 해석엔진 API: POST engine/jobs(실행) · GET engine/jobs/<id>(상태) · GET engine/jobs/<id>/download · GET engine/health
location /engine/ {
    # 삭제(DELETE) 등 나머지는 막는다(403). GET 에는 HEAD 가 들어 있다
    limit_except GET POST { deny all; }
    # health · jobs · jobs/<id> · jobs/<id>/download 만 연다. 엔진의 설명 페이지(docs·redoc·openapi.json) 등 나머지 길은 404
    if ($uri !~ "^/engine/(health|jobs(/[A-Za-z0-9_-]{1,64}(/download)?)?)$") { return 404; }
    # 접근 키를 넣어 둔 서버에서 쿠키 없이 실행하면 401. rewrite(break) 뒤에는 이 줄이 돌지 않으므로 반드시 앞에 둔다
    if ($engine_block) { return 401; }

    # 입력(JSON·STL) 업로드는 1 GB 까지(엔진이 올라온 파일을 메모리에 통째로 읽는다). 결과 ZIP 내려받기는 크기와 무관하다.
    # 받는 대로 흘려보낸다(앞단에 쌓지 않음)
    client_max_body_size 1g;
    # 해석 실행(POST)은 접속 주소별 분당 10건(한꺼번에 5건까지 허용)·동시 2건. 넘으면 429. 조회(GET)는 세지 않는다
    limit_req zone=jobs_post burst=5 nodelay;
    limit_conn jobs_post_conn 2;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # engine/jobs → 엔진의 /jobs. 주소를 변수로 줄 때는 proxy_pass 뒤에 경로를 붙이지 못하므로 rewrite 로 앞부분을 뗀다
    rewrite ^/engine/(.*)$ /$1 break;
    proxy_pass $engine_upstream;
}

# 작업 폴더 전체 목록은 내주지 않는다. 다만 결과는 공개다: 지금 도는 작업 번호가 engine/health 의 running_job 으로 보이므로
# 번호를 아는 누구나 그 작업의 입력·결과를 읽는다(2026-10-21 공개로 결정, deploy/README.md 1.4절)
location = /results/ {
    return 404;
}

# 엔진 작업 폴더(읽기 전용으로 붙임): results/<job_id>/<입력 이름>/<이름>_<n>.vtm, .../bin/LEVEL_xx/*.vtu, run.log, engine_job.json
# 폴더 주소(/ 로 끝남)는 JSON 목록 [{"name","type","mtime","size"}], 파일은 바이트 범위(Range) 읽기가 된다.
# location 과 alias 둘 다 / 로 끝나야 한다(한쪽만 / 면 /results../ 같은 주소로 폴더 밖이 열린다). .. 는 nginx 가 먼저 정리한다
location /results/ {
    alias /srv/jobs/;
    limit_except GET { deny all; }
    autoindex on;
    autoindex_format json;
    # 목록과 진행 중 결과가 바뀌므로 매번 확인한다(파일은 안 바뀌었으면 304)
    expires epoch;

    # 올라온 파일을 이 주소의 웹페이지로 열지 못하게: json·log 만 글자로, 나머지는 모두 내려받기 형식으로 보낸다
    types {
        application/json json;
        text/plain       log txt;
    }
    default_type application/octet-stream;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;

    # 재시작 파일 폴더(<job_id>/<입력 이름>/continue/)와 점(.)으로 시작하는 이름은 열지 않는다
    # continue 는 대소문자를 가리지 않는다(~*) — Windows 폴더를 붙인 리허설에서는 CONTINUE/ 로도 같은 폴더가 열린다
    location ~* ^/results/[^/]+/[^/]+/continue(/|$) {
        return 404;
    }
    location ~ /\. {
        return 404;
    }
}
