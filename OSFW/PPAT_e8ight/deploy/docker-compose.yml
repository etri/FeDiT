# 페이지(renderer)와 https 앞단(proxy)을 띄우는 설정. 해석엔진(engine)은 이 PC 리허설에서만 함께 띄운다(profile engine).
# 준비: deploy/.env.example 을 deploy/.env 로 복사해 고치고, CERT_DIR 폴더에 fullchain.pem · privkey.pem 을 둔다(README 2절).
#   이 PC 리허설(엔진까지):   docker compose --profile engine build  →  docker compose --profile engine up -d
#   E8IGHT 서버(엔진은 1세부 compose 가 이미 띄움):
#     docker compose -f docker-compose.yml -f docker-compose.server.yml up -d renderer proxy   (README 5절)
# 확인:  bash smoke_test.sh <입력 JSON> [STL ...]   (README 3절)
name: union-twin-cfd

# 컨테이너 로그는 10 MB 짜리 3개까지만 둔다(서버 기본값은 자르지 않아 디스크를 채울 수 있다)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 1세부 해석엔진: Python 연동 API + 해석기 실행 파일 2개(NFLOW_LBM, NFLOW_LBM_DEM). 이 PC 리허설 전용(--profile engine).
  # E8IGHT 서버에서는 1세부가 자기 compose(프로젝트 integration, 서비스 이름 engine)로 띄우고, proxy 가 그 네트워크에 붙는다.
  # 1세부 패키지(FeDiT 저장소 OPFW/modeling_simulation_engines)의 Dockerfile 을 고치지 않고 그대로 빌드한다.
  # 아래 값은 그 패키지의 integration/docker-compose.yml 과 같다.
  engine:
    profiles: ["engine"]
    build:
      # 빌드할 때만 쓴다. 비우면 아래 이름의 없는 폴더를 가리켜 빌드가 멈춘다(엔진을 띄우지 않는 서버에서는 비워도 된다)
      context: ${ENGINE_DIR:-./ENGINE_DIR-is-not-set}
      dockerfile: integration/Dockerfile
    image: fedit-engine:local
    restart: unless-stopped
    # 지정하지 않으면 root 로 돌아 작업 폴더의 결과 파일 주인이 root 가 된다(Linux 서버에서만 뜻이 있음)
    # user: "1000:1000"
    environment:
      FEDIT_RESULT_URL: ${FEDIT_RESULT_URL:-}
      FEDIT_RESULT_TOKEN: ${FEDIT_RESULT_TOKEN:-}
    volumes:
      - ${JOBS_HOST_DIR:-./jobs}:/jobs
      - ${NVCACHE_HOST_DIR:-./nvcache}:/nvcache
    # 엔진 API 는 서버 밖으로 열지 않는다(업로드한 파일로 프로그램을 실행하는 API). 밖에서는 proxy 의 engine/ 으로만 닿는다
    ports:
      - "127.0.0.1:${ENGINE_PORT:-18080}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 시작·전처리·물리 시뮬레이션·후처리 페이지. 정적 파일만 내준다.
  # 해석 실행·결과 읽기는 페이지가 같은 주소의 engine/ · results/ 로 부르고, proxy 가 길을 나눈다
  renderer:
    build:
      context: ..
      dockerfile: Dockerfile
    image: union-twin-cfd-renderer:local
    restart: unless-stopped
    logging: *logging
    environment:
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-*}
    ports:
      - "${RENDERER_BIND:-127.0.0.1}:${RENDERER_PORT:-8088}:8080"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # https 앞단(nginx). / → renderer, /engine/ → engine API, /results/ → 작업 폴더(읽기 전용). 설정은 proxy/ 폴더
  proxy:
    build: ./proxy
    image: union-twin-cfd-proxy:local
    restart: unless-stopped
    logging: *logging
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-cfd.fedit.or.kr}
      # 비우면 해석 실행이 열려 있다. 넣으면 해석 실행(POST engine/jobs)만 쿠키 cfd_key 를 확인한다
      ACCESS_KEY: ${ACCESS_KEY:-}
    ports:
      # 밖에서 들어오는 길. 기본은 이 PC 안에서만(127.0.0.1). 서버는 .env 에 PROXY_BIND=0.0.0.0 으로 밖에 연다
      - "${PROXY_BIND:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${PROXY_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:443"
      # 안쪽 확인용 http. 늘 127.0.0.1 에만 연다
      - "127.0.0.1:${PROXY_LOCAL_PORT:-8090}:8080"
    volumes:
      # 인증서 폴더(fullchain.pem · privkey.pem). 저장소에 넣지 않는다
      - ${CERT_DIR:-./certs}:/etc/nginx/certs:ro
      # 엔진 작업 폴더. 엔진이 쓰는 폴더와 같은 곳을 읽기 전용으로 붙인다
      - ${JOBS_HOST_DIR:-./jobs}:/srv/jobs:ro
