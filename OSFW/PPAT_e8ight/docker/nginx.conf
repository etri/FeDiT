# Nginx configuration - for React SPA serving
# Generated by Environment Configuration Manager
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy to backend (with SSE support)
    location /api/ {
        proxy_pass http://172.16.37.31:13000;
        proxy_http_version 1.1;

        # SSE 필수 설정
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE를 위한 버퍼링 비활성화
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # 타임아웃 설정 (SSE 장시간 연결)
        proxy_read_timeout 3600s;
        proxy_connect_timeout 75s;
    }

    # Static assets - serve with proper MIME types and caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router support - fallback to index.html for navigation
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
