<script type="text/javascript">
    RED.nodes.registerType("dt-property", {
        // node definition
        category: "digital twin",
        color: "#E2D96E",
        inputs: 1,
        outputs: 1,
        defaults: {
            name: {value: ""},
            accessGroup: {value: ""},
            aContext: {value: ""},
            aId: {value: ""},
            aType: {value: ""},
        },
        icon: "hash.svg",
        label: function () {
            return this.name || "dt-property";
        },
    });
</script>

<script data-template-name="dt-property" type="text/html">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name"/>
    </div>
    <div class="form-row">
        <label for="node-input-accessGroup"></label>
        <i class="fa fa-tag"></i> Access Group </label
            >
        <input
                type="text"
                id="node-input-accessGroup"
                placeholder="Access Group"
        />
    </div>
    <div class="form-row">
        <label for="node-input-aContext"
        ><i class="fa fa-tag"></i> @context</label
        >
        <input type="text" id="node-input-aContext" placeholder="Context"/>
    </div>

    <div class="form-row">
        <label for="node-input-aId"><i class="fa fa-tag"></i> @id</label>
        <input type="text" id="node-input-aId" placeholder="@id"/>
    </div>

    <div class="form-row">
        <label for="node-input-aType"><i class="fa fa-tag"></i> @type</label>
        <input type="text" id="node-input-aType" placeholder="@type"/>
    </div>

    <br/>
    <div class="form-tips"><b>Tip:</b> 노드에 대한 설명 (TODO)</div>
</script>

<script data-help-name="dt-property" type="text/html">
    <p>노드의 정보 (TODO)</p>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload
            <span class="property-type">string | buffer</span>
        </dt>
        <dd>노드의 출력</dd>
    </dl>
</script>
