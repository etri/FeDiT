<script type="text/javascript">
    RED.nodes.registerType('dt-relation', {
        // node definition
        category: 'digital twin',
        color: '#F5F5F5',
        defaults: {
            name: {value: "", required: true},
            direction: {value: "-->", default: "-->"}
        },
        inputs: 1,
        outputs: 1,
        icon: 'hash.svg',
        label: function () {
            let name = this.name || 'dt-relation';
            return name + ' (' + this.direction + ')';
        }
    });
</script>
