<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>서비스 일시 중단</title>
    <style>
        body { background:#1e1e1e; color:#e0e0e0; font-family:"Malgun Gothic",Arial,sans-serif;
               display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
        .card { background:#2b2b2b; border-radius:10px; padding:32px 40px; max-width:640px;
                box-shadow:0 0 12px rgba(0,0,0,.4); border-left:5px solid #f44336; }
        h1 { font-size:20px; margin:0 0 14px; }
        ul { line-height:1.8; padding-left:20px; }
        code { background:#121212; padding:2px 6px; border-radius:4px; font-family:Consolas,monospace; }
    </style>
</head>
<body>
    <div class="card">
        <h1>백엔드 서비스에 연결할 수 없습니다</h1>
        <p>요청은 정상적으로 전달되었으나 대상 서비스가 응답하지 않았습니다. 다음을 확인하세요.</p>
        <ul>
            <li>모델 정보 조회 실패 → <code>node</code> / <code>mariadb</code> 컨테이너 상태</li>
            <li>시뮬레이션 연결 실패 → <code>fDTSimServer.exe</code> (8869 / 8082) 실행 여부</li>
            <li>모델 목록 연결 실패 → <code>atomic_model_manager.exe</code> (8870) 실행 여부</li>
        </ul>
        <p>점검 : <code>deploy\03_health_check.ps1</code></p>
    </div>
</body>
</html>
