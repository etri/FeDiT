# =============================================================================
#  HyMS_eins (fDTSim OSFW) Nginx 설정  -  서버 배포용
#
#  대상 서버 : simulation.fedit.or.kr
#  UI 라우트 : https://simulation.fedit.or.kr/simulation/
#  HTTPS     : 443 (TLS 종단), 80 은 UI 요청만 HTTPS 로 리다이렉트
#              단, /api/... /sim /model /get_* /set_* 는 80 에서도 그대로 동작
#              (ENV_DISCRETE_SIMULATOR_URL=https://simulation.fedit.or.kr 호환)
#
#  백엔드 위치
#    node_api  : node 컨테이너            172.28.0.3:8081
#    sim_ws    : fDTSimServer GUI WS      host:8869
#    model_ws  : AtomicModelManager GUI WS host:8870
#    sim_rest  : fDTSimServer REST API    host:8084  (GET /api/sim/run 전용)
#    poc_rest  : poc_manager REST API     host:8082  (그 외 /api/..., POC 경로)
#
#  2026-10-07 : 2026-10-02 빌드 바이너리 기준으로 포트 정렬
#    poc_manager.exe  -> sim_engine/poc_manager.json "port": 8082
#    fDTSimServer.exe -> masterAgent.h listen_port 기본값 8084
#    (이전 설정 sim_rest=8082 / poc_rest=8083 은 구 바이너리 기준)
# =============================================================================

upstream node_api {
    server 172.28.0.3:8081;
}
upstream sim_ws {
    server host.docker.internal:8869;
}
upstream model_ws {
    server host.docker.internal:8870;
}
upstream sim_rest {
    server host.docker.internal:8084;
}
upstream poc_rest {
    server host.docker.internal:8082;
}

# -----------------------------------------------------------------------------
#  HTTP (80)
# -----------------------------------------------------------------------------
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    access_log  /var/log/nginx/host.access.log  main;
    error_log   /var/log/nginx/host.error.log;

    client_max_body_size 50m;

    # 백엔드 API / WebSocket : 평문 HTTP 로도 그대로 허용 (외부 연동 호환)
    include /etc/nginx/api_locations.conf;

    # UI(정적 파일) 요청은 HTTPS 로 유도
    location = / {
        return 301 https://$host/simulation/;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
#  HTTPS (443)
# -----------------------------------------------------------------------------
server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    server_name  _;

    ssl_certificate      /etc/nginx/certs/server.crt;
    ssl_certificate_key  /etc/nginx/certs/server.key;

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    access_log  /var/log/nginx/host.access.log  main;
    error_log   /var/log/nginx/host.error.log;

    client_max_body_size 50m;

    # 백엔드 API / WebSocket (wss 포함)
    include /etc/nginx/api_locations.conf;

    # ----- UI : /simulation/ 라우트 -----
    location = /simulation {
        return 301 /simulation/;
    }
    location /simulation/ {
        alias  /usr/share/nginx/html/;
        index  index.html index.htm;
    }

    # 루트 접속은 배포 라우트로 이동
    location = / {
        return 302 /simulation/;
    }

    # 레거시 경로 호환 (예: /index.html 직접 접근)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
