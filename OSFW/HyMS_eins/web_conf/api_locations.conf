# =============================================================================
#  api_locations.conf
#  HyMS_eins 백엔드 프록시 규칙 (HTTP/HTTPS server 블록에서 공통 include)
#
#  경로 규칙 : 모든 엔드포인트는 루트(/xxx) 와 /simulation 프리픽스(/simulation/xxx)
#              두 형태를 모두 허용한다.
#              - /simulation/...  : 서버 배포 라우트 (220.124.222.89/simulation)
#              - /...             : 기존(레거시) 클라이언트 호환용
#
#  주의 : 정규식 location 안에서는 proxy_pass 에 URI 를 직접 쓸 수 없으므로
#         rewrite ... break 로 백엔드에 전달할 경로를 확정한 뒤 프록시한다.
# =============================================================================

# ----- Node.js REST API (모델 디자이너 DB) -----------------------------------
#  끝 슬래시(/get_model_info/)도 허용한다.
#  fDTSimServer/atomic_model_manager 는 cpprest http_client 로 이 API 를 호출하는데
#  web_client::make_request 가 요청 경로를 U("/") 로 넘겨 base URI 뒤에 슬래시가
#  붙을 수 있다. `$` 로만 끝나는 정규식이면 그 요청이 여기에 매칭되지 않아
#  정적 파일 라우트로 흘러가 404 가 된다(중첩 커플드 모델 로드 실패의 원인).
#  Express 는 기본적으로 strict routing 이 꺼져 있어 끝 슬래시를 그대로 받아준다.
#  get_all_model_list / delete_model_info : 웹 "모델관리" 창 (모델 목록 / DB 삭제)
#  rename_project / delete_project        : 웹 "모델관리" 창 (패키지 이름변경 / 삭제)
location ~ ^(?:/simulation)?/(get_model_info|get_model_list|get_project_list|get_coupled_info|set_coupled_info|get_atomic_info|set_atomic_info|get_atomic_list|get_all_model_list|delete_model_info|rename_project|delete_project)/?$ {
    rewrite ^(?:/simulation)?/(.*)$ /$1 break;

    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header Host               $http_host;
    proxy_set_header X-NginX-Proxy      true;

    proxy_pass      http://node_api;
    proxy_redirect  off;
}

# ----- fDTSimServer GUI WebSocket (8869) -------------------------------------
location ~ ^(?:/simulation)?/sim$ {
    rewrite ^ /sim break;

    proxy_pass      http://sim_ws;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host       $host;

    proxy_connect_timeout   3600s;
    proxy_send_timeout      3600s;
    proxy_read_timeout      3600s;
}

# ----- AtomicModelManager GUI WebSocket (8870) -------------------------------
location ~ ^(?:/simulation)?/model$ {
    rewrite ^ /model break;

    proxy_pass      http://model_ws;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host       $host;

    proxy_connect_timeout   3600s;
    proxy_send_timeout      3600s;
    proxy_read_timeout      3600s;
}

# ----- poc_manager REST API (8082) -------------------------------------------
#  포트 : poc_manager = 8082 (sim_engine/poc_manager.json)
#         fDTSimServer 보조 REST = 8084 (GET /api/sim/run 만 처리)
#  아래 블록은 반드시 일반 /api/ 블록보다 먼저 와야 한다(정규식은 선언 순서대로 평가).
#    GET  /api/tci/sim/weight?user_id=&W1=&W2=&W3=&W4=
#    GET  /GetWeight , GET /Reset , POST /SendComfortIndex
#    GET  /poc/<경로>  -> 8082 의 <경로> (네임스페이스 정리용 별칭)
location ~ ^(?:/simulation)?/api/tci/ {
    rewrite ^(?:/simulation)?(/api/.*)$ $1 break;

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    proxy_pass      http://poc_rest;
    proxy_redirect  off;

    proxy_connect_timeout   300s;
    proxy_send_timeout      300s;
    proxy_read_timeout      300s;
}

location ~ ^(?:/simulation)?/(Reset|GetWeight|SendComfortIndex)$ {
    rewrite ^(?:/simulation)?/(.*)$ /$1 break;

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    proxy_pass      http://poc_rest;
    proxy_redirect  off;

    proxy_connect_timeout   300s;
    proxy_send_timeout      300s;
    proxy_read_timeout      300s;
}

location ~ ^(?:/simulation)?/poc(/.*)$ {
    rewrite ^(?:/simulation)?/poc(/.*)$ $1 break;

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    proxy_pass      http://poc_rest;
    proxy_redirect  off;

    proxy_connect_timeout   300s;
    proxy_send_timeout      300s;
    proxy_read_timeout      300s;
}

# ----- fDTSimServer REST API (8084) ------------------------------------------
#  외부 연동 : GET /api/sim/run?id=<webid>&projectname=<proj>&end_t=<sec>
#  ENV_DISCRETE_SIMULATOR_URL=http://220.124.222.89 기준으로
#    http://220.124.222.89/api/sim/run...
#    http://220.124.222.89/simulation/api/sim/run...
#  둘 다 동작한다. (/simulation 프리픽스는 제거하고 /api/... 로 전달)
#  `/api/sim/` 은 끝 슬래시까지 매칭하므로 poc_manager 의 /api/simulations/... 와
#  겹치지 않는다. 일반 /api/ 블록보다 먼저 와야 한다.
location ~ ^(?:/simulation)?/api/sim/ {
    rewrite ^(?:/simulation)?(/api/.*)$ $1 break;

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    proxy_pass      http://sim_rest;
    proxy_redirect  off;

    proxy_connect_timeout   300s;
    proxy_send_timeout      300s;
    proxy_read_timeout      300s;
}

# ----- poc_manager REST API (8082) : 그 외 /api/... --------------------------
#  /api/health, /api/models, /api/simulations/... (웹 UI 외부연동 패널 포함)
location ~ ^(?:/simulation)?/api/ {
    rewrite ^(?:/simulation)?(/api/.*)$ $1 break;

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    proxy_pass      http://poc_rest;
    proxy_redirect  off;

    proxy_connect_timeout   300s;
    proxy_send_timeout      300s;
    proxy_read_timeout      300s;
}
