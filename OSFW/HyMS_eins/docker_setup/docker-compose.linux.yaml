# =============================================================================
#  docker-compose.linux.yaml  -  순수 Linux Docker 엔진용 오버라이드
#
#  Windows(Docker Desktop) 서버에서는 이 파일이 필요하지 않다. 쓰지 말 것.
#
#  Linux Docker 엔진은 host.docker.internal 을 기본 제공하지 않는다.
#  호스트에서 도는 시뮬레이션 엔진(fDTSimServer 8869/8082,
#  AtomicModelManager 8870, poc_manager 8083)으로 프록시하려면
#  이름을 직접 매핑해 줘야 한다. 매핑이 없으면 nginx 가 기동 시
#  upstream 이름을 해석하지 못해 아예 뜨지 못한다.
#
#  사용법 : docker_setup/.env 에서 아래 한 줄의 주석을 해제한다.
#      COMPOSE_PATH_SEPARATOR=:
#      COMPOSE_FILE=docker-compose.yaml:docker-compose.linux.yaml
#  (COMPOSE_PATH_SEPARATOR 를 빼먹으면 Windows 기본 구분자 ';' 때문에 무시된다)
#  그러면 docker-compose up -d 가 이 파일을 자동으로 함께 읽는다.
#
#  확인 : docker exec nginx getent hosts host.docker.internal
#         -> 호스트에 도달하는 주소가 나와야 한다.
# =============================================================================
services:

 web:
  extra_hosts:
   - "host.docker.internal:host-gateway"
