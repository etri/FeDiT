# =============================================================================
#  docker-compose.yaml  -  HyMS_eins 서버 배포용 (simulation.fedit.or.kr / HTTPS)
#  버전 : 2026-09-21  "up -d 단독 기동" 반영본
#
#  목표 : 설치 후  docker_setup 에서  docker-compose up -d  한 번으로 기동 완료.
#         (별도 사전 스크립트 실행 없이 인증서·DB 초기화까지 자동 처리)
#
#  ---------------------------------------------------------------------------
#  2026-09-21 변경점과 그 이유
#
#  1) db: mariadb:10.11 -> mariadb:11.4  +  MARIADB_AUTO_UPGRADE=1
#     운영 db/ 데이터는 MariaDB 11.1.3 으로 만들어졌다(db/mariadb_upgrade_info).
#     - 10.11 은 11.1 데이터보다 낮은 버전이다(다운그레이드). MariaDB 는 이를
#       지원하지 않으며 InnoDB 로그에 change buffer 오류가 남는다.
#     - 반대로 태그를 고정하지 않으면(mariadb / mariadb:latest) 서버가 최신
#       메이저(12.x·13.x)를 내려받아 시스템 테이블만 구버전으로 남고
#         "Column count of mysql.proc is wrong. Expected 22, found 21"
#       로 저장 프로시저 호출이 전부 실패한다(= 이번에 발생한 증상).
#     - mariadb:13.0 + MARIADB_AUTO_UPGRADE 로도 해결되지 않는다. 11.1 -> 13.0 은
#       메이저 2단계 점프여서 mariadb-upgrade 가 "FATAL ERROR: Upgrade failed"
#       로 끝나고 컨테이너가 죽는다(실측 확인).
#     -> 11.1 에서 한 단계 위인 11.4 LTS 로 고정한다. 11.1.3 -> 11.4 업그레이드가
#        정상 완료되는 것을 확인했다. LTS 이므로 태그 고정 상태로 장기 운용 가능.
#
#  2) db: /docker-entrypoint-initdb.d 에 initdb/ 마운트 추가
#     db/ 가 비어 있을 때(최초 설치)만 실행되어 테이블·저장 프로시저·기본
#     데이터를 만든다. 기존 데이터가 있으면 진입점이 건너뛰므로 운영 DB 를
#     덮어쓰지 않는다. 이 덕분에 db/ 폴더를 따로 옮겨오지 않아도 기동된다.
#
#  3) web: nginx:1.25-alpine -> nginx:1.27  + 인증서 자동 생성
#     HTTPS 인증서가 없으면 nginx 가 기동하지 못해 up -d 만으로는 동작하지
#     않았다. command 에서 server.crt/server.key 가 없을 때만 자체 서명
#     인증서를 만든다. alpine 이미지에는 openssl 이 없어서 Debian 계열
#     nginx:1.27 로 바꿨다(openssl 내장 -> 폐쇄망에서도 추가 설치 불필요).
#     공인 인증서를 쓸 경우 web_conf/certs 에 같은 이름으로 넣어두면
#     생성 단계를 건너뛴다.
#
#  4) app: build(Dockerfile) -> image: node:20-alpine + app_root 바인드 마운트
#     기존 Dockerfile 은 `npm ci` 를 하므로 npm 레지스트리에 닿지 못하는
#     환경에서는 up -d 가 빌드 단계에서 실패했다. app_root/node_modules 를
#     패키지에 함께 넣고 빌드 없이 바로 실행한다.
#     thumbnails/ 도 호스트에 그대로 남는다(이미지 재생성 시 유실 없음).
#
#  5) db 기동 완료를 기다리도록 healthcheck + depends_on(condition) 추가
#     최초 설치 때는 initdb 실행에 수십 초가 걸린다. node 가 먼저 떠서
#     DB 연결 실패 로그를 쏟아내지 않도록 순서를 보장한다.
#
#  ---------------------------------------------------------------------------
#  host.docker.internal 에 대해  (extra_hosts 를 쓰지 않는 이유)
#
#  시뮬레이션 엔진(fDTSimServer 8869/8082, AtomicModelManager 8870,
#  poc_manager 8083)은 컨테이너가 아니라 호스트에서 네이티브 실행된다.
#  Docker Desktop(Windows)은 host.docker.internal 을 자체 제공하며 윈도우
#  호스트에 도달하는 주소(예: 192.168.127.254)로 해석한다.
#  여기서 extra_hosts 로 host-gateway 를 선언하면 그 값이 Docker VM 내부
#  브리지(172.17.0.1)로 덮어써져 호스트 엔진에 도달하지 못하고
#  /sim, /model, /api/... 가 전부 502 가 된다(실측 확인).
#
#    docker exec nginx getent hosts host.docker.internal
#      정상  : 192.168.127.254   (윈도우 호스트)
#      비정상: 172.17.0.1        (VM 내부 브리지)
#
#  순수 Linux Docker 엔진에서 돌릴 때는 반대로 host.docker.internal 이 기본
#  제공되지 않으므로 수동 매핑이 필요하다. 그 경우에만
#  docker_setup/.env 에서 아래 한 줄의 주석을 해제한다.
#      COMPOSE_PATH_SEPARATOR=:
#      COMPOSE_FILE=docker-compose.yaml:docker-compose.linux.yaml
#  그러면 docker-compose up -d 가 자동으로 오버라이드를 함께 읽는다.
# =============================================================================
services:

 web:
  # Debian 계열(openssl 내장) - 인증서 자동 생성에 필요하다.
  image: nginx:1.27
  container_name: nginx
  networks:
   mynet:
    ipv4_address: 172.28.0.2
  ports:
   - "${HTTP_PORT:-80}:80"
   - "${HTTPS_PORT:-443}:443"
  environment:
   # 자체 서명 인증서의 CN / SAN 에 들어갈 서버 주소
   - CERT_CN=${SERVER_HOST:-simulation.fedit.or.kr}
  volumes:
   - ../web_conf/default.conf:/etc/nginx/conf.d/default.conf:ro
   - ../web_conf/api_locations.conf:/etc/nginx/api_locations.conf:ro
   # 인증서 자동 생성이 이 경로에 써야 하므로 :ro 를 붙이지 않는다.
   - ../web_conf/certs:/etc/nginx/certs
   - ../web_root:/usr/share/nginx/html
  # 인증서가 없을 때만 자체 서명 인증서를 만들고 nginx 를 띄운다.
  # 이미 web_conf/certs/server.crt(+key) 가 있으면 그것을 그대로 쓴다.
  command:
   - /bin/sh
   - -c
   - |
     set -e
     CRT=/etc/nginx/certs/server.crt
     KEY=/etc/nginx/certs/server.key
     if [ ! -s "$$CRT" ] || [ ! -s "$$KEY" ]; then
       CN="$${CERT_CN:-simulation.fedit.or.kr}"
       if echo "$$CN" | grep -qE '^[0-9]+(\.[0-9]+){3}$$'; then
         SAN="subjectAltName=IP:$$CN,DNS:localhost,IP:127.0.0.1"
       else
         SAN="subjectAltName=DNS:$$CN,DNS:localhost,IP:127.0.0.1"
       fi
       echo "[cert] 인증서가 없어 자체 서명 인증서를 생성합니다 (CN=$$CN)"
       mkdir -p /etc/nginx/certs
       openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
         -keyout "$$KEY" -out "$$CRT" \
         -subj "/C=KR/ST=Seoul/O=EINS/OU=fDTSim/CN=$$CN" \
         -addext "$$SAN"
       echo "[cert] 생성 완료 - 브라우저에서 최초 1회 예외 승인이 필요합니다"
     else
       echo "[cert] 기존 인증서 사용: $$CRT"
     fi
     exec /docker-entrypoint.sh nginx -g 'daemon off;'
  restart: unless-stopped
  depends_on:
   - app

 app:
  # 빌드 없이 기동한다. app_root/node_modules 가 패키지에 포함되어 있어야 한다.
  # (없으면 아래 command 가 npm install 을 한 번 시도하고, 실패하면 그대로 중단)
  image: node:20-alpine
  container_name: node
  working_dir: /app
  networks:
   mynet:
    ipv4_address: 172.28.0.3
  # Nginx 를 통해서만 접근하므로 호스트 루프백에만 노출한다.
  ports:
   - "127.0.0.1:${NODE_PORT:-8081}:8081"
  volumes:
   - ../app_root:/app
  command:
   - /bin/sh
   - -c
   - |
     if [ ! -d node_modules/express ]; then
       echo "[app] node_modules 가 없어 npm install 을 시도합니다"
       npm install --omit=dev --no-audit --no-fund
     fi
     exec node index.js
  environment:
   - NODE_ENV=production
   - DB_HOST=${DB_HOST:-172.28.0.4}
   - DB_PORT=${DB_PORT:-3306}
   - DB_NAME=${DB_NAME:-model_designer}
   - DB_USER=${DB_USER:-model_designer}
   - DB_PASSWORD=${DB_PASSWORD}
   - DB_CONNECTION_LIMIT=${DB_CONNECTION_LIMIT:-4}
   # 배포 서버 공개 주소 / 외부 연동 시뮬레이터 주소
   - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://simulation.fedit.or.kr/simulation}
   - ENV_DISCRETE_SIMULATOR_URL=${ENV_DISCRETE_SIMULATOR_URL:-https://simulation.fedit.or.kr}
  restart: unless-stopped
  depends_on:
   db:
    condition: service_healthy

 db:
  # 태그 고정 필수. 위 주석 1) 참고 - latest 로 두면 메이저가 올라가면서
  # 저장 프로시저 호출이 전부 깨진다.
  image: mariadb:11.4
  container_name: mariadb
  networks:
   mynet:
    ipv4_address: 172.28.0.4
  # DB 를 인터넷에 직접 노출하지 않는다 - 호스트 루프백에서만 접속
  # (외부에서 접속이 필요하면 SSH 터널을 사용)
  ports:
   - "127.0.0.1:${DB_EXT_PORT:-3307}:3306"
  volumes:
   - ../db:/var/lib/mysql
   # db/ 가 비어 있을 때만 실행된다(최초 설치 시 스키마·프로시저·기본데이터).
   - ./initdb:/docker-entrypoint-initdb.d:ro
  environment:
   # 옮겨온 db/ 데이터가 구버전(11.1.3)이면 기동 시 mariadb-upgrade 를 자동 실행.
   # 이 값이 없으면 "Column count of mysql.proc is wrong" 로 프로시저가 전부 실패한다.
   MARIADB_AUTO_UPGRADE: 1
   # 아래 4개는 db/ 가 비어 있을 때(최초 초기화)만 적용된다.
   MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
   MYSQL_DATABASE: ${MYSQL_DATABASE:-model_designer}
   MYSQL_USER: ${MYSQL_USER:-model_designer}
   MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  # 이미지에 들어 있는 healthcheck.sh 는 쓰지 않는다.
  # healthcheck.sh 는 자격증명을 /var/lib/mysql/.my-healthcheck.cnf 에서 읽는데,
  # Windows 바인드 마운트에서는 이 파일이 world-writable(0777) 로 보여
  # MariaDB 클라이언트가 "World-writable config file ... is ignored" 로 무시한다.
  # 그 결과 항상 Access denied -> unhealthy -> node 가 기동하지 못한다(실측 확인).
  #
  # 대신 앱이 실제로 쓰는 경로 그대로 검사한다: model_designer 계정으로
  # TCP(127.0.0.1) 접속이 되는지. 진입점이 임시 서버를 띄우는 동안
  # (초기화·mariadb-upgrade 구간)에는 --skip-networking 이라 TCP 가 닫혀 있으므로
  # "준비 완료" 를 앞질러 보고하지 않는다.
  # 비밀번호는 MYSQL_PWD 로 넘겨 프로세스 인자에 노출되지 않게 한다.
  healthcheck:
   test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mariadb -h 127.0.0.1 -u\"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
   interval: 10s
   timeout: 5s
   retries: 24
   start_period: 120s
  restart: unless-stopped

networks:
  mynet:
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
