services:
  flowcast3d-viewer:
    build:
      context: ../..
      dockerfile: services/flowcast3d-viewer/Dockerfile
    image: flowcast3d-viewer
    container_name: flowcast3d-viewer
    init: true
    environment:
      FLOWCAST_VIEWER_PORT: ${FLOWCAST_VIEWER_PORT:-8090}
      FLOWCAST_MANAGEMENT_PORT: ${FLOWCAST_MANAGEMENT_PORT:-8082}
    ports:
      - "${FLOWCAST_VIEWER_HOST_IP:-127.0.0.1}:${FLOWCAST_VIEWER_PORT:-8090}:${FLOWCAST_VIEWER_PORT:-8090}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${FLOWCAST_VIEWER_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [flowcast3d]
    restart: on-failure:5
    stop_grace_period: 30s

networks:
  flowcast3d:
    name: flowcast3d
