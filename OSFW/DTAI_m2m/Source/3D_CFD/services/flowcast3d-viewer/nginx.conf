server {
    listen ${FLOWCAST_VIEWER_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /health { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    location /app-assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location /app-api/ {
        proxy_pass http://flowcast3d-api:${FLOWCAST_MANAGEMENT_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }
    location ~ ^/(legacy|sessions|assets)(/|$) {
        client_max_body_size 200m;
        proxy_pass http://flowcast3d-api:${FLOWCAST_MANAGEMENT_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
