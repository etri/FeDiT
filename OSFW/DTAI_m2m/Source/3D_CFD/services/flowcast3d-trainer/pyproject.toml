[project]
name = "flowcast3d-trainer"
version = "0.1.0"
description = "OpenFOAM 기반 도시 3D 풍장 데이터 생성과 PyTorch 학습"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.1.3",
    "PyYAML==6.0.2",
    "torch==2.6.0",
    "pyvista==0.46.3",
    "vtk==9.5.1",
]

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.9.10"]
notebooks = [
    "matplotlib==3.11.2",
    "pandas==2.2.3",
    "nbformat==5.10.4",
    "nbclient==0.10.2",
    "nbconvert==7.17.1",
    "ipykernel==6.29.5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
