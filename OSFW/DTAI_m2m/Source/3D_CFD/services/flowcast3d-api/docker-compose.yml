services:
  flowcast3d-api:
    build:
      context: ../..
      dockerfile: services/flowcast3d-api/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: flowcast3d-api
    container_name: flowcast3d-api
    init: true
    working_dir: /opt/api
    command: ["python", "main.py"]
    expose: ["${FLOWCAST_MANAGEMENT_PORT:-8082}"]
    stop_grace_period: 35s
    environment:
      MONGO_USER: ${MONGO_USER:-flowcast3d}
      FLOWCAST_DB_PORT: ${FLOWCAST_DB_PORT:-27017}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD 설정 필요}
      FLOWCAST_MONGO_DATABASE: flowcast3d
      FLOWCAST_DATA: /workspace/data
      FLOWCAST_DATA_DIR: /data
      FLOWCAST_MODEL_VERSION_DIR: /workspace/model-version
      FLOWCAST_RESULT_STORAGE: mongodb
      FLOWCAST_API_PORT: ${FLOWCAST_API_PORT:-8080}
      FLOWCAST_MANAGEMENT_PORT: ${FLOWCAST_MANAGEMENT_PORT:-8082}
      FLOWCAST_RENDERER_PORT: ${FLOWCAST_RENDERER_PORT:-8081}
      FLOWCAST_MODEL_HTTP_PORT: ${FLOWCAST_MODEL_HTTP_PORT:-8000}
      FLOWCAST_MODEL_URL: http://flowcast3d-model:${FLOWCAST_MODEL_HTTP_PORT:-8000}
      FLOWCAST_MODEL_VERSION: /workspace/model-version
      FLOWCAST_MAX_CONCURRENT_JOBS: ${FLOWCAST_MAX_CONCURRENT_JOBS:-1}
      FLOWCAST_TILE_CONCURRENCY: ${FLOWCAST_TILE_CONCURRENCY:-1}
      FLOWCAST_RETRY_DELAY: ${FLOWCAST_RETRY_DELAY:-30.0}
      FLOWCAST_RENDERER_URL: http://127.0.0.1:${FLOWCAST_RENDERER_PORT:-8081}
      FLOWCAST_WORKSPACE_DIR: /var/lib/flowcast3d-api/workspace
      FLOWCAST_WORKSPACE_SOURCE_DIR: ${FLOWCAST_WORKSPACE_SOURCE_DIR:-/workspace/data}
      FLOWCAST_TRAINING_RESULTS: ${FLOWCAST_TRAINING_RESULTS:-/workspace/training-results}
      FLOWCAST_MAINTENANCE_INTERVAL_SECONDS: ${FLOWCAST_MAINTENANCE_INTERVAL_SECONDS:-300}
      FLOWCAST_RENDER_HEAP_MB: ${FLOWCAST_RENDER_HEAP_MB:-8192}
      FLOWCAST_REQUEST_TIMEOUT: ${FLOWCAST_REQUEST_TIMEOUT:-7200}
      FLOWCAST_RENDER_TASK_TIMEOUT: ${FLOWCAST_RENDER_TASK_TIMEOUT:-300}
      FLOWCAST_PROCESS_TASK_TIMEOUT: ${FLOWCAST_PROCESS_TASK_TIMEOUT:-7200}
      FLOWCAST_RENDER_STARTUP_TIMEOUT: ${FLOWCAST_RENDER_STARTUP_TIMEOUT:-60}
      FLOWCAST_RENDER_MAX_RESPONSE_BYTES: ${FLOWCAST_RENDER_MAX_RESPONSE_BYTES:-33554432}
      FLOWCAST_RENDER_MESH_CACHE: ${FLOWCAST_RENDER_MESH_CACHE:-/tmp/flowcast-render-mesh-cache}
      FLOWCAST_RENDER_MESH_CACHE_MB: ${FLOWCAST_RENDER_MESH_CACHE_MB:-4096}
      FLOWCAST_MAX_PREDICTION_BYTES: ${FLOWCAST_MAX_PREDICTION_BYTES:-134217728}
      FLOWCAST_MAX_UPLOAD_BYTES: ${FLOWCAST_MAX_UPLOAD_BYTES:-8589934592}
      FLOWCAST_MAX_JSON_BYTES: ${FLOWCAST_MAX_JSON_BYTES:-134217728}
      FLOWCAST_MAX_EXPANDED_NPZ_BYTES: ${FLOWCAST_MAX_EXPANDED_NPZ_BYTES:-34359738368}
      FLOWCAST_PUBLIC_TEMP_DIR: ${FLOWCAST_PUBLIC_TEMP_DIR:-/tmp/flowcast-public}
      FLOWCAST_VIEWER_CACHE_MB: ${FLOWCAST_VIEWER_CACHE_MB:-1024}
      FLOWCAST_VIEWER_MAX_CELLS: ${FLOWCAST_VIEWER_MAX_CELLS:-2000000}
      FLOWCAST_VIEWER_MESH_MB: ${FLOWCAST_VIEWER_MESH_MB:-8192}
      FLOWCAST_VIEWER_FFMPEG: ${FLOWCAST_VIEWER_FFMPEG:-}
      FLOWCAST_API_BIND_HOST: 0.0.0.0
      FLOWCAST_MANAGEMENT_BIND_HOST: 0.0.0.0
      FLOWCAST_3D_API_HOST: ${FLOWCAST_3D_API_HOST:-127.0.0.1}
      FLOWCAST_API_KEY: ${FLOWCAST_API_KEY:?FLOWCAST_API_KEY 설정 필요}
      FLOWCAST_API_REQUESTS_PER_MINUTE: ${FLOWCAST_API_REQUESTS_PER_MINUTE:-30}
      FLOWCAST_API_MAX_CONCURRENT_REQUESTS: ${FLOWCAST_API_MAX_CONCURRENT_REQUESTS:-1}
    ports:
      - target: ${FLOWCAST_API_PORT:-8080}
        published: "${FLOWCAST_3D_API_PORT:-3001}"
        host_ip: ${FLOWCAST_3D_API_HOST:-127.0.0.1}
    volumes:
      - flowcast3d-workspace:/var/lib/flowcast3d-api
      - flowcast3d-viewer-assets:/tmp/flowcast-viewer-assets
      - ../flowcast3d-trainer/data:/workspace/data:ro
      - ../flowcast3d-trainer/results:/workspace/training-results:ro
      - ../flowcast3d-model/model_repository/flowcast3d/1:/workspace/model-version:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,socket,urllib.request; socket.create_connection(('127.0.0.1',int(os.environ['FLOWCAST_API_PORT'])),timeout=3).close(); urllib.request.urlopen('http://127.0.0.1:'+os.environ['FLOWCAST_MANAGEMENT_PORT']+'/health',timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - flowcast3d

networks:
  flowcast3d:
    name: flowcast3d

volumes:
  flowcast3d-workspace:
    name: flowcast3d-workspace
  flowcast3d-viewer-assets:
    name: flowcast3d-viewer-assets
