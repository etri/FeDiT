[project]
name = "flowcast3d-model"
version = "0.1.0"
description = "Triton 기반 학습 체크포인트의 도시 3D 풍장 추론"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy==1.26.4", "PyYAML==6.0.2", "torch==2.6.0",
    "pydantic==2.14.1",
]

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# Triton은 한 요청의 예외를 오류 응답으로 격리해야 함
"modules/serving/triton.py" = ["BLE001"]
# 학습 검증과 동일한 ValueError 계약 유지
"modules/pipeline/inputs.py" = ["TRY004"]
"modules/pipeline/transforms.py" = ["TRY004"]
"modules/runtime/model.py" = ["TRY004"]
