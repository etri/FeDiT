# DataBase
spring:
  config:
    activate:
      on-profile:
      - local
  datasource:
    url: jdbc:postgresql://{server ip}:5432/dtmeta
    username: meta_manager
    password: rhksflwk1!
    driver-class-name: org.postgresql.Driver    
  kafka:
    bootstrap-servers: {server ip}:9092
    client-id : DT_PRODUCER
    auth:
      user-id: 
      user-pw: 
    thread-sleep : 100  
    
# Spring Doc Open Api    
springdoc.swagger-ui.enabled: true
# swagger-ui custom path
#springdoc.swagger-ui.path: /swagger-ui.html

# File
#file:
#  upload-path: /opt/dtmeata
      
  
# Security
security:
  secret-key: mk8sO0z3ORun6W/7aILNQrX+OUSp4PPX9ZxAn3JNgGY=

oauth:
  public-key: http://{server ip}:33000/security/publickey
  access-token: http://{server ip}:33000/oauth2.0/token
authorization: 
  data : true
  default-auth:
    use-flag: true  
    list: AUT_META_DEFAULT
  
platform.common.api.url: http://{server ip}:6998

# Virtuoso 
virtuoso:
  datasource:
    url: jdbc:virtuoso://{server ip}:1111/charset=UTF-8
    username: meta_manager
    password: rhksflwk1!
  graph:
    dev: DEV_GRAPH_NM
    use: USE_GRAPH_NM
  conductor-url: http://{server ip}:8890/conductor

# Metadata RDF URL (Namespace) 
dtmeta:
  # TODO : 임시 정의, 추후 수정 필요
  resource:
    base-url: http://{server ip}:8084/meta/resource/page/
    data-url: http://{server ip}:8084/meta/api/v1/resource/data/
  # TODO : 임시 정의, 추후 수정 필요
  rdf-schema:
    base-url: http://{server ip}:8084/meta/ns/digitaltwin#
    skos-url: http://{server ip}:8084/meta/skos/digitaltwin#
  # 디지털트윈 연합 식별체계 적용
  id-scheme:
    digital-twin: DigitalTwin
    digital-twin-object: DigitalObject
    
# NEO4J
neo4j:
  authentication:
    username: neo4j
    password: rhksflwk1!
  uri: bolt://{server ip}:7687
  browser-url: http://{server ip}:7474/browser
  
# Elastic Search
elastic:
  authentication:
    username: elastic
    password: rhksflwk1!
  protocol: http
    # TODO : 임시 정의, 추후 수정 필요
  server-ip: {server ip}
  server-port: 9200
  kibana-port: 5601
  fingerprint: {fingerprint}
  index-name: dtmeta
  kibana-url: http://{server ip}:5601
  
