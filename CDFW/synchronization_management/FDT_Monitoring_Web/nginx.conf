user  jejutp;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WebSocket/Upgrade 대응 (grafana, vite 등)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    log_format  api_debug
                      '$remote_addr [$time_local] host="$host" request="$request" '
                      'uri="$request_uri" status=$status upstream_addr="$upstream_addr" '
                      'upstream_status="$upstream_status" upstream_response_time="$upstream_response_time" '
                      'request_time="$request_time" ref="$http_referer" ua="$http_user_agent"';

    sendfile        on;
    keepalive_timeout  65;

    # -------------------------
    # upstreams
    # -------------------------
    upstream digital-brain {
        server 220.124.222.84:1213;
    }
    upstream digital-connector {
        server 220.124.222.84:1219;
    }
    upstream digital-base {
        server 220.124.222.84:5432;
    }

    upstream kafka-cluster {
        server 220.124.222.84:9092;
    }
    upstream kafka-connector {
        server 220.124.222.84:8083;
    }

    upstream flink-cluster {
        server 220.124.222.84:8087;
    }
    upstream flink-dashboard {
        server 220.124.222.84:8081;
    }

    # =========================================================
    # 443 HTTPS: 외부 진입점 (프론트 + grafana + API 게이트웨이)
    # =========================================================
    server {
        listen 443 ssl;
        server_name keti.fedit.or.kr;

        ssl_certificate_key /home/jejutp/cert/NginX/privateKey.pem;
        ssl_certificate     /home/jejutp/cert/NginX/star_fedit_or_kr_NginX.pem;
        ssl_protocols TLSv1.2;

        # -------------------------
        # 1) API: /fedit/* 는 내부 1221로 (우선순위 고정)
        # -------------------------
        location ^~ /fedit/ {
            proxy_pass http://127.0.0.1:1221;   # URI 그대로 유지
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -------------------------
        # 2) Grafana: /grafana -> /grafana/ 정규화
        # -------------------------
        location = /grafana {
            return 301 /grafana/;

        location /grafana/ {
            proxy_pass http://127.0.0.1:3000;  # subpath용: 끝에 / 중요
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # -------------------------
        # 3) 프론트 (Vite/Vue)
        # -------------------------
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # =========================================================
    # 1221: 내부 API 라우터 (외부 노출 금지)
    # =========================================================
    server {
        listen 1221;
        absolute_redirect off;
        # -------------------------
        # Digital Connector (v1)
        # -------------------------
        location ^~ /fedit/v1/digital-twins/ {
            proxy_pass http://digital-connector;
            proxy_set_header Host $host;
        }
        location = /fedit/v1/digital-twins {
            # /digital-twins 로 끝나는 경우 trailing slash 맞추기(선택)
            return 301 /fedit/v1/digital-twins/;
        }

        location ^~ /fedit/v1/outliers/ {
            proxy_pass http://digital-connector;
            proxy_set_header Host $host;
        }
        location ^~ /fedit/v1/validations/ {
            proxy_pass http://digital-connector;
            proxy_set_header Host $host;
        }
        location ^~ /fedit/v1/errors/ {
            proxy_pass http://digital-connector;
            proxy_set_header Host $host;
        }

        # (끝 슬래시 없는 호출도 받을 수 있게 보강)
        location = /fedit/v1/outliers      { proxy_pass http://digital-connector; }
        location = /fedit/v1/validations  { proxy_pass http://digital-connector; }
        location = /fedit/v1/errors       { proxy_pass http://digital-connector; }

        # -------------------------
        # Digital Connector (light)
        # -------------------------
        location ^~ /fedit/light/digital-twins/ {
            proxy_pass http://digital-connector;
            proxy_set_header Host $host;
        }
        location = /fedit/light/digital-twins {
            return 301 /fedit/light/digital-twins/;
        }

        # -------------------------
        # Digital Brain (v1)
        # -------------------------
        location ^~ /fedit/v1/federated-twins/ {
            proxy_pass http://digital-brain;
            proxy_set_header Host $host;
            client_max_body_size 100M;  # brain쪽에서 큰 바디가 있을 수 있다면 여기로
        }

        # -------------------------
        # Flink / Kafka (현재 1221에서만 노출 중)
        # 필요하면 443에서도 동일 방식으로 프록시하면 됨
        # -------------------------
        location ^~ /flink-dashboard/ {
            proxy_pass http://flink-dashboard/;  # rewrite 없이 서브패스 제거
            proxy_set_header Host $host;
        }
        location = /flink-dashboard {
            return 301 /flink-dashboard/;
        }

        location ^~ /flink/ {
            proxy_pass http://flink-cluster;
            proxy_set_header Host $host;
        }

        location ^~ /connectors/ {
            proxy_pass http://kafka-connector;
            proxy_set_header Host $host;
        }
        location ^~ /connector-plugins/ {
            proxy_pass http://kafka-connector;
            proxy_set_header Host $host;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
