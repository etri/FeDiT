user  jejutp;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    log_format  api_debug
                      '$remote_addr [$time_local] host="$host" request="$request" '
                      'uri="$request_uri" status=$status upstream_addr="$upstream_addr" '
                      'upstream_status="$upstream_status" upstream_response_time="$upstream_response_time" '
                      'request_time="$request_time" ref="$http_referer" ua="$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile on;
    keepalive_timeout 65;

    upstream digital-brain { server 220.124.222.84:1213; }
    upstream digital-connector { server 220.124.222.84:1219; }
    upstream kafka-connector { server 220.124.222.84:8083; }
    upstream flink-cluster { server 220.124.222.84:8087; }
    upstream flink-dashboard { server 220.124.222.84:8081; }

    # =========================================================
    # 443 HTTPS: 외부 진입점
    # =========================================================
    server {
        listen 443 ssl;
        server_name keti.fedit.or.kr;

        ssl_certificate_key /home/jejutp/cert/NginX/privateKey.pem;
        ssl_certificate     /home/jejutp/cert/NginX/star_fedit_or_kr_NginX.pem;
        ssl_protocols TLSv1.2;

        # API → 내부 1221
        location ^~ /fedit/ {
            access_log /var/log/nginx/api_access.log api_debug;

            proxy_pass http://127.0.0.1:1221;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Grafana
        location = /grafana { return 301 /grafana/; }
        location /grafana/ {
            proxy_pass http://127.0.0.1:3000/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Frontend
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # =========================================================
    # 1221: 내부 API 라우터 (localhost only)
    # =========================================================
    server {
        listen 127.0.0.1:1221;
        access_log /var/log/nginx/api_internal_access.log api_debug;

        # 443에서 받은 forwarded 정보를 업스트림에 전달
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_http_version 1.1;

        # -------------------------
        # Digital Connector (v1)
        # -------------------------

        # ✅ 핵심: /digital-twins (슬래시 없음) 요청을 "내부적으로" /digital-twins/ 로 바꿔서 프록시
        # (301 리다이렉트가 아니라 내부 rewrite라 브라우저 주소는 그대로)
        location = /fedit/v1/digital-twins {
            rewrite ^ /fedit/v1/digital-twins/ break;
            proxy_pass http://digital-connector;
        }

        # /digital-twins/ 및 하위 경로
        location ^~ /fedit/v1/digital-twins/ {
            proxy_pass http://digital-connector;
        }

        # (선택) 만약 업스트림이 /digital-twins/ 도 404면, 아래처럼 "단독 API"로 매핑하는 방식(B안)
        # location = /fedit/v1/digital-twins/ {
        #     proxy_pass http://digital-connector/fedit/v1/digital-twins/data_count_all;
        # }

        location = /fedit/v1/outliers      { rewrite ^ /fedit/v1/outliers/ break;      proxy_pass http://digital-connector; }
        location ^~ /fedit/v1/outliers/    { proxy_pass http://digital-connector; }

        location = /fedit/v1/validations   { rewrite ^ /fedit/v1/validations/ break;   proxy_pass http://digital-connector; }
        location ^~ /fedit/v1/validations/ { proxy_pass http://digital-connector; }

        location = /fedit/v1/errors        { rewrite ^ /fedit/v1/errors/ break;        proxy_pass http://digital-connector; }
        location ^~ /fedit/v1/errors/      { proxy_pass http://digital-connector; }

        # -------------------------
        # Digital Brain (v1)
        # -------------------------
        location = /fedit/v1/federated-twins {
            rewrite ^ /fedit/v1/federated-twins/ break;
            client_max_body_size 100M;
            proxy_pass http://digital-brain;
        }

        location ^~ /fedit/v1/federated-twins/ {
            client_max_body_size 100M;
            proxy_pass http://digital-brain;
        }

        # (선택) federated-twins/도 루트가 404면 B안으로 특정 엔드포인트에 매핑
        # location = /fedit/v1/federated-twins/ {
        #     proxy_pass http://digital-brain/fedit/v1/federated-twins/<단독API경로>;
        # }

        # -------------------------
        # Flink / Kafka
        # -------------------------
        location ^~ /flink-dashboard/ { proxy_pass http://flink-dashboard/; }
        location ^~ /flink/           { proxy_pass http://flink-cluster; }

        location ^~ /connectors/        { proxy_pass http://kafka-connector; }
        location ^~ /connector-plugins/ { proxy_pass http://kafka-connector; }
    }

    include /etc/nginx/conf.d/*.conf;
}