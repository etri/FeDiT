plugins {
    id 'java'
}

group 'org.kafka.connect'
version '1.0'

repositories {
    mavenCentral()
}

ext {
    set('slf4jSimple', '1.7.30')
    set('connectApi', '2.5.0')
    set('jsonSimple', '1.1.1')
    set('mqttV3', '1.2.5')
    set('jackson', '2.16.2')
}

dependencies {
    implementation "org.slf4j:slf4j-simple:${slf4jSimple}"
    implementation "org.apache.kafka:connect-api:${connectApi}"
//    implementation 'org.slf4j:slf4j-simple:1.7.30'
    implementation "com.googlecode.json-simple:json-simple:${jsonSimple}"
    // org.json:json removed — JSON License ("Good, not Evil") is incompatible with Apache-2.0.
    // Replaced by Jackson-backed bridge in org.kafka.connect.util (JSONObject / XML / JSONException).
    // Eclipse Paho MQTT v3 client is dual-licensed under EPL-1.0 OR EDL-1.0.
    // This project uses it under EDL-1.0 (BSD-3-Clause compatible) — see NOTICE.
    implementation "org.eclipse.paho:org.eclipse.paho.client.mqttv3:${mqttV3}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jackson}"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-xml:${jackson}"
    implementation 'com.jayway.jsonpath:json-path:2.9.0'
    // SLF4J API + simple binding (MIT). logback-classic removed for license cleanliness (EPL/LGPL).
    implementation 'org.slf4j:slf4j-api:1.7.32'
    // https://mvnrepository.com/artifact/org.postgresql/postgresql
    implementation group: 'org.postgresql', name: 'postgresql', version: '42.7.3' // 추가
    runtimeOnly 'org.postgresql:postgresql' // 추가
}


jar {
    from(configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }) {
        exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}