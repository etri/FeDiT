buildscript {

    repositories {
        mavenCentral()
    }

    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:2.1.13.RELEASE")
        classpath("io.spring.gradle:dependency-management-plugin:1.0.10.RELEASE")
    }
}


allprojects {
    group 'com.stoneitgt.dt.data.platform'
    version '1.0'
}

subprojects {

    apply plugin: 'java'
    apply plugin: 'eclipse'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    sourceCompatibility = 1.8

    ext['log4j2.version'] = '2.17.0'
    ext['logback.version'] = '1.2.9'

    configurations {
        developmentOnly
        runtimeClasspath {
            extendsFrom developmentOnly
        }
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    repositories {
        mavenCentral()
    }

    task initSourceFolders {
        sourceSets*.java.srcDirs*.each {
            if( !it.exists() ) {
                it.mkdirs()
            }
        }
        sourceSets*.resources.srcDirs*.each {
            if( !it.exists() ) {
                it.mkdirs()
            }
        }
    }

    dependencies {
        //implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'
        implementation group: 'org.hibernate', name: 'hibernate-validator', version: '7.0.1.Final'
        developmentOnly 'org.springframework.boot:spring-boot-devtools'
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testImplementation('org.springframework.boot:spring-boot-starter-test') {
            exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
        }
        testImplementation 'org.springframework.security:spring-security-test'
        testImplementation 'junit:junit:4.12'
        testCompile group: 'org.assertj', name: 'assertj-core', version: '3.15.0'
        compile group: 'org.mybatis.spring.boot', name: 'mybatis-spring-boot-starter', version: '2.1.4'
        compile group: 'org.bgee.log4jdbc-log4j2', name: 'log4jdbc-log4j2-jdbc4.1', version: '1.16'
        implementation 'com.opencsv:opencsv:5.5'
    }
}

project(':dt_data_platform_core') {
    bootJar.enabled = false
    jar.enabled = true
    dependencies {
        compileOnly group: 'javax.servlet', name: 'javax.servlet-api', version: '3.1.0'
        compile group: 'javax.validation', name: 'validation-api', version: '2.0.1.Final'
        compile group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.11.3'
        compile group: 'org.apache.commons', name: 'commons-lang3', version: '3.11'
        compile group: 'org.apache.poi', name: 'poi', version: '4.1.2'
        compile group: 'org.apache.poi', name: 'poi-ooxml', version: '4.1.2'
        compile group: 'com.github.ulisesbocchio', name: 'jasypt-spring-boot-starter', version: '3.0.3'
        compile group: 'org.apache.commons', name: 'commons-text', version: '1.8'
        compile group: 'org.simplejavamail', name: 'simple-java-mail', version: '6.4.4'
        compile group: 'org.simplejavamail', name: 'batch-module', version: '6.4.4'
        compile group: 'org.simplejavamail', name: 'spring-module', version: '6.4.4'
        compile group: 'commons-io', name: 'commons-io', version: '2.8.0'
        compile group: 'eu.bitwalker', name: 'UserAgentUtils', version: '1.21'
        compile group: 'org.json', name: 'json', version: '20200518'
        compile group: 'com.google.code.gson', name: 'gson', version: '2.8.6'
        compile group: 'com.konghq', name: 'unirest-java', version: '3.11.03'
        compile group: 'org.apache.tika', name: 'tika-core', version: '1.24.1'
        compile group: 'org.apache.tika', name: 'tika-parsers', version: '1.24.1'
        compile group: 'org.passay', name: 'passay', version: '1.6.0'
        compile group: 'org.jsoup', name: 'jsoup', version: '1.13.1'
        compile group: 'com.github.ua-parser', name: 'uap-java', version: '1.5.0'
        compile group: 'com.atlassian.commonmark', name: 'commonmark', version: '0.15.2'
        compile group: 'com.github.dfabulich', name: 'sitemapgen4j', version: '1.1.2'

        runtimeOnly 'org.postgresql:postgresql'

        // resin일 경우 이건 별도로 추가하여 war 배포 전에 넣어준다
        //compile group: 'javax.el', name: 'javax.el-api', version: '3.0.0'
        // https://mvnrepository.com/artifact/javax.el/javax.el-api
        //implementation group: 'javax.el', name: 'javax.el-api', version: '3.0.0'


        compile fileTree(dir:'libs', include:['*.jar'])
    }
}

project(':dt_data_platform_admin') {
    apply plugin: 'war'

    bootWar.enabled = false
    war.enabled = true

    dependencies {
        compile project(':dt_data_platform_core')
        implementation 'org.springframework.boot:spring-boot-starter-web'
        providedCompile 'org.springframework.boot:spring-boot-starter-tomcat'
        implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
        implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity5'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        compile group: 'nz.net.ultraq.thymeleaf', name: 'thymeleaf-layout-dialect', version: '2.5.2'
        compile group: 'org.mariadb.jdbc', name: 'mariadb-java-client', version: '2.5.4'
        compile group: 'com.mashape.unirest', name: 'unirest-java', version: '1.4.9'
        implementation group: 'net.coobird', name: 'thumbnailator', version: '0.4.14'

        // https://mvnrepository.com/artifact/com.twelvemonkeys.imageio/imageio-jpeg
        implementation group: 'com.twelvemonkeys.imageio', name: 'imageio-jpeg', version: '3.4.1'
        implementation group: 'com.twelvemonkeys.imageio', name: 'imageio-core', version: '3.4.1'
        implementation group: 'com.twelvemonkeys.imageio', name: 'imageio-bmp', version: '3.4.1'

        // 디렉토리
        compile fileTree(dir:'libs', include:['*.jar'])
    }
}

