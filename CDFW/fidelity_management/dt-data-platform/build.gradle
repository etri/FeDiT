buildscript {

    repositories {
        mavenCentral()
    }

    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:2.1.13.RELEASE")
        classpath("io.spring.gradle:dependency-management-plugin:1.0.10.RELEASE")
    }
}

allprojects {
    group 'com.stoneitgt.dt.data.platform'
    version '1.0'
}

subprojects {

    apply plugin: 'java'
    apply plugin: 'eclipse'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    sourceCompatibility = 1.8
    targetCompatibility = 1.8

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:2.1.13.RELEASE"
        }
    }

    configurations.all {
        exclude group: 'jakarta.annotation', module: 'jakarta.annotation-api'
        exclude group: 'org.javassist', module: 'javassist'
        exclude group: 'javassist',     module: 'javassist'
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.springframework.boot') {
                details.useVersion '2.1.13.RELEASE'
            }
        }
    }

    ext['log4j2.version'] = '2.17.0'
    ext['logback.version'] = '1.2.9'

    configurations {
        developmentOnly
        runtimeClasspath {
            extendsFrom developmentOnly
        }
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    repositories {
        mavenCentral()
    }

    task initSourceFolders {
        sourceSets*.java.srcDirs*.each {
            if (!it.exists()) {
                it.mkdirs()
            }
        }
        sourceSets*.resources.srcDirs*.each {
            if (!it.exists()) {
                it.mkdirs()
            }
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'
        developmentOnly 'org.springframework.boot:spring-boot-devtools'
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        compile group: 'org.mybatis.spring.boot', name: 'mybatis-spring-boot-starter', version: '2.1.4'
        compile group: 'org.bgee.log4jdbc-log4j2', name: 'log4jdbc-log4j2-jdbc4.1', version: '1.16'
        implementation 'com.opencsv:opencsv:5.5'
    }
}

project(':dt_data_platform_core') {
    bootJar.enabled = false
    jar.enabled = true
    dependencies {
        compileOnly group: 'javax.servlet', name: 'javax.servlet-api', version: '3.1.0'
        compile group: 'javax.validation', name: 'validation-api', version: '2.0.1.Final'
        compile group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.11.3'
        compile group: 'org.apache.commons', name: 'commons-lang3', version: '3.11'
        compile group: 'com.github.ulisesbocchio', name: 'jasypt-spring-boot-starter', version: '3.0.3'
        compile group: 'org.apache.commons', name: 'commons-text', version: '1.8'
        compile group: 'commons-io', name: 'commons-io', version: '2.8.0'
        compile group: 'commons-codec', name: 'commons-codec', version: '1.11'
        compile group: 'com.google.code.gson', name: 'gson', version: '2.8.6'
        compile group: 'org.jsoup', name: 'jsoup', version: '1.13.1'
        compile group: 'com.github.ua-parser', name: 'uap-java', version: '1.5.0'
        compile group: 'com.github.dfabulich', name: 'sitemapgen4j', version: '1.1.2'

        compile fileTree(dir: 'libs', include: ['*.jar'])
    }
}

project(':dt_data_platform_admin') {
    apply plugin: 'war'

    bootWar.enabled = false
    war.enabled = true

    dependencies {
        compile project(':dt_data_platform_core')
        compile group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.5.11'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        providedCompile 'org.springframework.boot:spring-boot-starter-tomcat'
        implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
        implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity5'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        compile group: 'nz.net.ultraq.thymeleaf', name: 'thymeleaf-layout-dialect', version: '2.5.2'
        compile group: 'org.mariadb.jdbc', name: 'mariadb-java-client', version: '2.5.4'
        implementation group: 'net.coobird', name: 'thumbnailator', version: '0.4.14'

        // 디렉토리
        compile fileTree(dir: 'libs', include: ['*.jar'])
    }
}