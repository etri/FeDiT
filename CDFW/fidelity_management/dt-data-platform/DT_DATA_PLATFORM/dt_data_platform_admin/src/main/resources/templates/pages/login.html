<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>DT_DATA_PLATFORM :: 로그인</title>
    <link rel="shortcut icon" th:href="@{/assets/images/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/assets/vendors/core/core.css}">
    <th:block th:with="ver=${@environment.getProperty('system.version')}">
        <link rel="stylesheet" th:href="@{/assets/css/demo_1/style.css(ver=${ver})}">
        <link rel="stylesheet" th:href="@{/assets/css/common.css(ver=${ver})}">
    </th:block>
</head>

<body>
    <div class="main-wrapper cont_login">
        <div class="page-wrapper full-page">
            <div class="page-content d-flex align-items-center justify-content-center">
                <div class="row w-100 mx-0 auth-page">
                    <div class="col-md-8 col-xl-6 mx-auto">
                        <div class="card">
                            <div class="row">
                                <div class="col-md-4 pr-md-0">
                                    <div class="auth-left-wrapper" th:style="|background-image: url(@{/assets/images/logo.png});background-position: center;background-repeat: no-repeat;background-size: auto;|">
                                    </div>
                                </div>
                                <div class="col-md-8 pl-md-0">
                                    <div class="auth-form-wrapper px-4 py-5">
                                        <a href="#" class="noble-ui-logo d-block mb-2">DT_DATA_PLATFORM</a>
                                        <!-- <h5 class="text-muted font-weight-normal mb-4">DT_DATA_PLATFORM 관리시스템</h5> -->
                                        <form class="forms-sample" th:action="@{/login}" method="post" th:object="${loginForm}">
                                            <div class="form-group">
                                                <label for="id">아이디</label>
                                                <input type="text" class="form-control" th:field="*{id}" placeholder="아이디를 입력하세요" required="required" autofocus="autofocus" maxlength="15">
                                            </div>
                                            <div class="form-group">
                                                <label for="password">비밀번호</label>
                                                <input type="password" class="form-control" th:field="*{password}" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required="required" maxlength="20">
                                            </div>
                                            <!--/*
                                            <div class="form-check form-check-flat form-check-primary">
                                                <label class="form-check-label">
                                                    <input type="checkbox" class="form-check-input" name="remember-me">
                                                    자동로그인
                                                </label>
                                            </div>
                                            */-->
                                            <div class="box_desc" th:if="${not #strings.isEmpty(error)}">
                                                <p class="desc_error" th:text="${error}">아이디 혹은 비밀번호가 일치하지 않습니다. 입력한 내용을 다시 확인해 주세요.</p>
                                            </div>
                                            <div class="mt-4">
                                                <button type="submit" class="btn btn-primary btn-lg p-3">로그인</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
