<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<th:block th:fragment="save_model">
        
        
        
        
            <!-- <div class="card-body " id="tab_savemodel_range"> -->
            <div  id="tab_savemodel_range">
			    
			    <th:block th:if="${formType == 'U'}">
				    <th:block th:unless="${#lists.isEmpty(predictionFileList)}">
				    
					    <div class="row">
					        <div class="col-12 col-xl-12 grid-margin stretch-card">
					            <div class="card">
					                <div class="card-body">
					                    <div class="form-group row">
					                    	<label class="col-sm-12 col-form-label">
						                    	Data learning model validation Result
						                    </label>
					                    	<div class="col-md-6">
					                    		<label class="col-md-2 col-form-label">
							                    	Real Data Table
							                    </label>
							                    <div class="col-md-12" id="data_test"></div>
					                    	</div>
					                    	<div class="col-md-6">
					                    		<label class="col-md-2 col-form-label">
							                    	Prediction Data Table
							                    </label>
							                    <div class="col-md-12" id="data_pred"></div>
					                    	</div>                    	
					                    </div>
					                    <div class="col-md-12">
						                    <div class="form-group row">
						                    	<label class="col-md-1 col-form-label">
							                    	Data Chart
							                    </label>
							                    <div class="col-sd-2">
													<select class="select" id="select_data">
						                                <option value="10">10</option>
						                                <option value="50">50</option>
						                                <option value="100" selected>100</option>
						                                <option value="300">300</option>
						                                <option value="500">500</option>
						                                <option value="1000">1000</option>	                                
						                            </select>
												</div>
						                    </div>
					                    	<div id="view2" style="width:100%; height:500px; border-style:solid;border-width:1px;border-color:#eee;"></div>
					                    </div>
					                </div>
					            </div>
					        </div>
					    </div>
					    <div class="row">
					        <div class="col-12 col-xl-12 grid-margin stretch-card">
					            <div class="card">
					                <div class="card-body">
					                	<div class="form-group row">
					                		<label class="col-sm-12 col-form-label">
						                    	Model Validation Result Visualization
						                    </label>
					                		<div class="col-md-6">
							                	<div class="table-responsive">
									                <label class="col-sm-12 col-form-label">
								                    	Accuracy & Loss
								                    </label>
							                        <table class="table table-hover scrolltable">
							                            <colgroup>
							                                <col style="width: 10%;">
							                                <col style="width: 25%;">
							                                <col style="width: 25%;">
							                                <col style="width: 25%;">
							                                <col style="width: 25%;">
							                            </colgroup>
							                            <thead>
							                                <tr>
							                                    <th>epochs</th>
							                                    <th>loss</th>
							                                    <th>val loss</th>
							                                    <th>metrics</th>
							                                    <th>val metrics</th>
							                                </tr>
							                            </thead>
							                            <tbody>
							                                <th:block th:include="fragments/table_empty:: table_empty(3)" th:if="${#lists.isEmpty(list_loss)}"></th:block>
							                                <tr th:each="item : ${list_loss}" th:unless="${#lists.isEmpty(list_loss)}">
							                                    <td th:text="${item.epochs}"></td>
							                                    <td th:text="${#numbers.formatDecimal(item.loss,1,6)}"></td>
							                                    <td th:text="${#numbers.formatDecimal(item.vrfc_loss,1,6)}"></td>
							                                    <td th:text="${#numbers.formatDecimal(item.metrics,1,6)}"></td>
							                                    <td th:text="${#numbers.formatDecimal(item.vrfc_metrics,1,6)}"></td>		                                    
							                                </tr>
							                            </tbody>
							                        </table>
							                    </div>
						                	</div>
							                <div class="col-md-6">
							                	<label class="col-sm-12 col-form-label">
							                    	Validation Loss Chart
							                    </label>
							                	<div id="view0" style="width:100%; height:400px; border-style:solid;border-width:1px;border-color:#eee;"></div>
							                </div>
					                	</div>
					                	<div class="form-group row">
					                		<label class="col-sm-12 col-form-label">
												FID Score 
											</label>
						                 	<div class="col-md-4">
							                	<label class="col-sm-12 col-form-label">
													시계열 데이터 Visualization 
												</label>
												<div class="form-group row">
													<div class="col-md-6">
														<label class="col-sm-12 col-form-label">
															Real Data 
														</label>
														<div class="col-sm-12">
															<img th:src="|/files${list_fid[0].real_file_nm}|" id="real_img" width="100%">
														</div>
													</div>
													<div class="col-md-6">
														<label class="col-sm-12 col-form-label">
															Prediction Data 
														</label>
														<div class="col-sm-12">
															<img th:src="|/files${list_fid[0].fake_file_nm}|" id="fake_img" width="100%">
														</div>
													</div>
												</div>
												<div class="form-group row">
													<label class="col-sm-6 col-form-label">Epoch</label>								
													<div class="col-md-6">
														<select class="select" id="select_epoch">
							                                <option th:each="item : ${list_fid}" th:value="|/files${item.real_file_nm}|" th:text="${item.epochs}"></option>
							                            </select>
													</div>
												</div>
						                	</div>
						                	<div class="col-md-2">
						                	<div class="table-responsive">
							                	<label class="col-sm-12 col-form-label">
													FID Score Table 
								                </label>
							                	<table class="table table-hover scrolltable">
							                            <colgroup>
							                                <col style="width: 30%;">
							                                <col style="width: 70%;">		                                
							                            </colgroup>
							                            <thead>
							                                <tr>
							                                    <th>epochs</th>
							                                    <th>FID Score</th>		                                    
							                                </tr>
							                            </thead>
							                            <tbody>
							                                <th:block th:include="fragments/table_empty:: table_empty(3)" th:if="${#lists.isEmpty(list_fid)}"></th:block>
							                                <tr th:each="item : ${list_fid}" th:unless="${#lists.isEmpty(list_fid)}">
							                                    <td th:text="${item.epochs}"></td>
							                                    <td th:text="${#numbers.formatDecimal(item.fid_score,1,6)}"></td>
							                                </tr>
							                            </tbody>
							                        </table>
											</div>
						                	</div>
							                <div class="col-md-6">
								                <label class="col-sm-12 col-form-label">
														FID Score Chart 
								                </label>
							                	<div id="view1" style="width:100%; height:400px; border-style:solid;border-width:1px;border-color:#eee;"></div>
							                </div>	
						                </div>                
					                </div>
					            </div>
					        </div>
					    </div>      
				    </th:block>
			    </th:block>
			          
			</div>        
        
        
        <!--
        <div id="next_button_savemodel_range">
			<div class="col-sm-12">
               	<button type="button" class="btn btn-primary mr-2 btn-icon-text next-preproc-step float-right">
					다음<i data-feather="arrow-right"></i>
				</button>
               	<button type="button" class="btn btn-primary mr-2 btn-icon-text prev-preproc-step float-right">
					<i data-feather="arrow-left"></i>이전
				</button>
      		</div>
        </div>
        -->
</th:block>

</html>
