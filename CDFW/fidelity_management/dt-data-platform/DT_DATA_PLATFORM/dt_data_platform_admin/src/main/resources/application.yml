spring:
  profiles:
    active: local

  main:
    allow-bean-definition-overriding: true
    
  jackson:
    serialization:
      fail-on-empty-beans: false
    
  http:
    encoding:
      force: true
      force-request: true
      force-response: true
      
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB
      
  thymeleaf:
    cache: false

server:
  servlet:
    session:
      timeout: 120m
      persistent: true
      cookie:
        name: DT_DATA_TWIN_JSESSIONID
        http-only: true
  tomcat:
    uri-encoding: UTF-8
  error:
    whitelabel:
      enabled: false
    include-stacktrace: on-trace-param
    
---
    
spring:
  profiles: local
  output:
    ansi:
      enabled: detect
  http:
    log-request-details: true
  servlet:
    multipart:
      location: /home/files
  
  primary:
    datasource:
      driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
      jdbc-url: jdbc:log4jdbc:mariadb://url
      username: username
      password: password
  second:
    datasource:
      driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
      jdbc-url: jdbc:log4jdbc:mariadb://url
      username: username
      password: password
      
      
server:
  port: 9102

system:
  upload-file-path: /home/files
  upload-file-url: /resource
  #upload-file-url: https://arko.or.kr/artntech
  limit-csv-row-count: 1000
  dt-file-path: /home/files/storage
  dt-api-url: http://localhost:8000

  limit-make-model-cnt: 1

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
    file: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
#    file: "%d %-5level [%thread] %logger : %msg%n" 
  level:
    root: info
    jdbc: off
    jdbc.sqlonly: debug
    jdbc.sqltiming: off
    jdbc.resultset: off
    jdbc.resultsettable: off
    jdbc.connection: off
    log4jdbc: off
    log4jdbc.sql: off
 
