<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/layout}">

<head>
    <title th:text="${breadcrumb.menu_nm}">사용자관리</title>
</head>
<div layout:fragment="content">
    <nav th:replace="fragments/page_breadcrumb"></nav>
    <form name="editForm" th:action="@{/setting/user/form}" th:object="${user}" method="post">
        <input type="hidden" th:field="*{userSeq}">
        <!-- <input type="hidden" th:field="*{userType}"> -->
        <input type="hidden" name="menuCd" th:value="${menuCd}">
        <input type="hidden" name="pageParams" th:value="${pageParams}">
        <div class="row">
            <div class="col-md-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-sm-6">
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label required">아이디</label>
                                    <div class="col-sm-7">
                                        <th:block th:if="*{userSeq == 0}">
                                            <input type="text" th:field="*{id}" class="form-control alphabet_number_only" maxlength="20" required="required">
                                            <th:block th:include="fragments/form_invalid:: form_invalid('id')"></th:block>
                                        </th:block>
                                        <th:block th:unless="*{userSeq == 0}">
                                            <input type="hidden" th:field="*{id}">
                                            <span th:text="*{id}">아이디</span>
                                        </th:block>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <th:block th:if="*{userSeq == 0}">
                        <div class="row">
                        	<div class="col-sm-6">
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label required">비밀번호</label>
                                    <div class="col-sm-7">
                                        <input type="password" maxlength="20" th:field="*{password}" class="form-control" required="required">
                                        <th:block th:include="fragments/form_invalid:: form_invalid('password')"></th:block>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label required">비밀번호확인</label>
                                    <div class="col-sm-7">
                                        <input type="password" maxlength="20" th:field="*{passwordConfirm}" class="form-control" required="required">
                                        <th:block th:include="fragments/form_invalid:: form_invalid('passwordConfirm')"></th:block>
                                    </div>
                                </div>
                            </div>
                        </div>
                        </th:block>
                        <div class="row">
                            <div class="col-sm-6">
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label required">이름</label>
                                    <div class="col-sm-7">
                                        <input type="text" maxlength="20" th:field="*{username}" class="form-control" required="required">
                                        <th:block th:include="fragments/form_invalid:: form_invalid('username')"></th:block>
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label required">이메일</label>
                                    <div class="col-sm-7">
                                        <input type="text" maxlength="50" th:field="*{userEml}" class="form-control">
                                        <th:block th:include="fragments/form_invalid:: form_invalid('userEml')"></th:block>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-6">
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label required">휴대폰번호</label>
                                    <div class="col-sm-7">
                                        <input type="text" maxlength="3" th:field="*{userHp1}" class="form-control number_only" required="required" style="width: 30%; display: inline;">
                                        <input type="text" maxlength="4" th:field="*{userHp2}" class="form-control number_only" required="required" style="width: 30%; display: inline;">
                                        <input type="text" maxlength="4" th:field="*{userHp3}" class="form-control number_only" required="required" style="width: 30%; display: inline;">
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">전화번호</label>
                                    <div class="col-sm-7">
                                        <input type="text" maxlength="3" th:field="*{userCont1}" class="form-control number_only" required="required" style="width: 30%; display: inline;">
                                        <input type="text" maxlength="4" th:field="*{userCont2}" class="form-control number_only" required="required" style="width: 30%; display: inline;">
                                        <input type="text" maxlength="4" th:field="*{userCont3}" class="form-control number_only" required="required" style="width: 30%; display: inline;">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!--
                        <div class="row">
                            <div class="col-sm-6">
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">부서</label>
                                    <div class="col-sm-7">
                                        <input type="text" maxlength="10" th:field="*{dept}" class="form-control">
                                    </div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label">직책</label>
                                    <div class="col-sm-7">
                                        <input type="text" maxlength="10" th:field="*{position}" class="form-control">
                                    </div>
                                </div>
                            </div>
                        </div>
                        -->
                        <div class="row">
                            <div class="col-sm-6">
                                <div class="form-group row">
                                    <label class="col-sm-3 col-form-label required">메뉴 접근 권한</label>
                                    <div class="col-sm-6">
                                        <select class="select" th:field="*{userAuthCd}" required="required">
                                            <option th:each="item : ${authList}" th:value="${item.dtl_cd}" th:text="${item.dtl_cd_nm}"></option>
                                        </select>
                                        <th:block th:include="fragments/form_invalid:: form_invalid('userAuthCd')"></th:block>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <th:block th:unless="*{userSeq == 0}">
							<div class="form-group row">
								<div class="col-md-4">
			                            <label for="password">비밀번호 재설정: </label>
			                            <input type="password" class="form-control" name="tempPassword" id="tempPassword"  placeholder="재설정란에 비밀번호 입력시 비밀번호가 변경됩니다."/>
			                            <th:block th:include="fragments/form_invalid:: form_invalid('tempPassword')"></th:block>
								</div>
								<div class="col-md-4">
			                            <label for="password">비밀번호 재설정 확인: </label>
			                            <input type="password" class="form-control" name="tempPasswordConfirm" id="tempPasswordConfirm" placeholder="한번더 입력하세요"/>
			                            <th:block th:include="fragments/form_invalid:: form_invalid('tempPasswordConfirm')"></th:block>
								</div>
							</div>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-12">
                <button type="button" class="btn btn-primary mr-2 btn-icon-text btn-insert-user" th:if="*{userSeq == 0}">
                    <i class="btn-icon-prepend" data-feather="edit"></i>등록
                </button>
                <button type="button" class="btn btn-secondary mr-2 btn-icon-text btn-update-user" th:unless="*{userSeq == 0}">
                    <i class="btn-icon-prepend" data-feather="edit"></i>수정
                </button>
                <a class="btn btn-outline-primary btn-icon-text" th:href=@{|/setting/user?${pageParams}|}> <i class="btn-icon-prepend" data-feather="list"></i>목록
                </a>
            </div>
        </div>
    </form>
    
    <form name="deleteForm" th:action="@{|/admin/management/user/delete/*{userSeq}|}" th:object="${user}" method="post">
		<input type="hidden" name="userSeq" th:value="*{userSeq}" />
    </form>
    
    
</div>
<th:block layout:fragment="custom_css">
</th:block>
<th:block layout:fragment="custom_js">
    <script th:src="@{/assets/js/pages/setting/user_view.js}"></script>
</th:block>

</html>
