<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<th:block th:fragment="column_info">
    <div class="row">
        <div class="col-12">
            <ul class="my-3">
                <li>
                    <div class="bg-box">
                        <p class="dot-desc">Statistic는 컬럼별 각 데이터 개수 및 평균, 분산, 최소값에서 최댓값을 보여줍니다.</p>
                    </div>
                </li>
                <li>
                    <div class="bg-box">
                        <p class="dot-desc">Histogram은 각 컬럼별 값의 분포와 개수를 보여줍니다.</p>
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <!-- Statistics 테이블-->
    <!-- Histogram 테이블-->
    <!-- chart-->
    <div class="row" style="padding-top: 0;">
        <div class="col-md-4 pt-3">
            <div id="dataSetStatisticsRange"></div>
        </div>
        <div class="col-md-4 pt-3">
            <div id="dataSetHistogramRange"></div>
        </div>
        <div class="col-md-4 pt-3">
            <div id="view3"
                 style="width: 100%; height: 400px; border-style: solid; border-width: 1px; border-color: #eee; display: none; margin-top: 84px;"></div>
        </div>
    </div>

    <div class="row">
        <div class="col-12 pt-3" id="dataSetInfoRange"></div>
    </div>

    <!-- 정보 테이블-->
    <div class="row">
        <div class="col-12 pt-3" id="dataSetColumnSelectRange" style="display: none;"></div>
    </div>

    <!-- 정보 테이블 버튼-->
    <div class="row">
        <div id="dataSetColumnSelectRangeBtn" style="display: none;"></div>
    </div>

    <!-- 업로드 테이블-->
    <div class="row">
        <div class="col-12 pt-3" id="csvUpRange3">
            <div class="table-scroll-parent"></div>
        </div>
    </div>

    <div class="row" id="next_button_column_info_range" style="display: none;">
        <div class="col-sm-12 pt-3" style="text-align: end;">
            <button id="column_info_prev" type="button" class="ui-button primary sm prev-input-info-step">이전</button>
            <button id="column_info_next" type="button" class="ui-button primary sm next-preproc-validate-step">다음(유효성)</button>
        </div>
    </div>
</th:block>
</html>
