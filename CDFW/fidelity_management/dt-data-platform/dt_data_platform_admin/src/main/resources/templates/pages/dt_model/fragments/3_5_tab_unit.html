<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<th:block th:fragment="tab_unit">

    <!-- 데이터 전처리  하단 Unit Conversion-->
    <div class="col-md-12 grid-margin  stretch-card bottom-tab" id="tab_unit_range" style="height: 60%">
        <div class="card" style="height: 60%">
            <div class="card-body">
                <div class="form-group row">
                    <div class="col-md-10">
                        <h6 class="card-title">지정한 컬럼의 단위를 변환할 수 있습니다. 원본 단위를 정확하게 선택하세요.</h6>
                        <div class="form-group">
                            <div style="display: inline-block;margin-right: 30px;" id="preProcUnitTargetCol">
                            </div>
                            <div style="display: inline-block;margin-right: 30px;">
                                <label>변환유형</label>
                                <select class="w-100 unit-select-box" id="select_unit_tp">
                                    <option value="0">처리안함</option>
                                    <option th:each="item : ${unit_type_list}" th:value="${item.dtl_cd}"
                                            th:text="${item.dtl_cd_nm}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <div id="unit_select_box_range"></div>
                            <input type="hidden" id='select_unit_seq'>
                        </div>
                        <div class="form-group">
                            <div style="display: inline-block;margin-left: 83px;">
                                <input class="btn btn-success btn-make-unit" type="button" value="변환"
                                       style="margin-left: 10px;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 업로드 테이블-->
    <th:block th:if="${formType == 'I'}">
        <div id="preprocTableRangeUnit" style="width: 100%; display: none;"></div>
    </th:block>

    <div id="next_button_unit_range" style="display: none;">
        <div class="col-sm-12">
            <button type="button" class="btn btn-primary mr-2 btn-icon-text next-model-step float-right">
                다음(save or model)<i data-feather="arrow-right"></i>
            </button>
            <button type="button" class="btn btn-primary mr-2 btn-icon-text prev-preproc-resample-step float-right">
                <i data-feather="arrow-left"></i>이전
            </button>
        </div>
    </div>
</th:block>
</html>
