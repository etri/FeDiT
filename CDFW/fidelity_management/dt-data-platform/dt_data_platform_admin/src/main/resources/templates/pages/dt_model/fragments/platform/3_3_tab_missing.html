<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<th:block th:fragment="tab_missing">
    <!-- 데이터 전처리 Missing Value Tab Contents-->
    <div id="tab_missing_range" class="col-12 pt-3">
        <div class="row">
            <div class="col-8">
                <!--Column And Missing Count-->
                <div id="tab_missing_table_range_interpolate" class="table-responsive"></div>
            </div>
            <div class="col-4" id="tab_missing_select_range">
                <div class="row">
                    <div class="col-12">
                        <label for="select_interpolate" class="col-form-label">보간 옵션</label>
                    </div>
                    <div class="col-12">
                        <div class="dropdown-wrapper">
                            <div class="dropdown-box">
                                <button type="button" class="form-control sm dropdown-toggle"
                                        id="select_interpolate" data-value="0">선택 없음
                                </button>
                                <div class="dropdown-layer" id="select_interpolate_selection"
                                     aria-expanded="false">
                                    <ul class="option-list">
                                        <li>
                                            <input type="radio"
                                                   id="input_select_interpolate_0"
                                                   name="select_interpolate_input"
                                                   value="0">
                                            <label for="input_select_interpolate_0">선택 없음</label>
                                        </li>
                                        <li th:each="item : ${interp_type_list}">
                                            <input type="radio"
                                                   th:id="${'input_' + 'select_interpolate' + '_' + item.dtl_cd}"
                                                   name="select_interpolate_input"
                                                   th:value="${item.dtl_cd}">
                                            <label th:for="${'input_' + 'select_interpolate' + '_' + item.dtl_cd}"
                                                   th:text="${item.dtl_cd_nm}">선택</label>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <div id="rfcomment" class="pt-3" style="font-size: 13px; color: red; display: none;">
                        </div>
                        <div id="britscomment" class="pt-3" style="font-size: 13px; color: red; display: none;">
                        </div>
                        <div id="naomicomment" class="pt-3" style="font-size: 13px; color: red; display: none;">
                        </div>
                    </div>
                    <div class="col-12 pt-3" style="text-align: end;">
                        <button type="button" class="ui-button primary sm btn-make-interpolate">변환</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 업로드 테이블-->
    <th:block th:if="${formType == 'I'}">
        <div class="col-12">
            <div id="preprocTableExcludeRangeMissing" class="pt-3" style="display: none;"></div>
            <div id="preprocTableRangeMissing" class="pt-3" style="display: none;"></div>
        </div>
    </th:block>
    <div id="next_button_interpolate_range" class="col-12 pt-3" style="display: none; text-align: end;">
        <button type="button" class="ui-button primary sm prev-preproc-outlier-step">
            이전
        </button>
        <button type="button" class="ui-button primary sm next-preproc-resample-step">
            다음(resample)
        </button>
    </div>
</th:block>
</html>
