<!-- MODAL POPUP -->
<!-- 그룹 코드 등록, 수정 모달 -->
<div class="modal-popup-wrap" id="modal-menu"> <!-- is-open -->
    <div class="modal-popup">
        <div class="modal-popup-header">
            <p class="title">메뉴</p>
            <button type="button" class="btn-popup-close right" data-popup-id="modal-menu">
                <svg aria-label="닫기" role="img" viewBox="0 0 12 12" preserveAspectRatio="xMidYMid meet"
                     xmlns="http://www.w3.org/2000/svg" fill="none">
                    <g clip-path="url(#a)">
                        <path fill="#C7C7C7"
                              d="m7.409 6 4.295-4.287a1.003 1.003 0 0 0-1.418-1.42L6 4.59 1.714.294A1.003 1.003 0 1 0 .296 1.713L4.59 5.999.296 10.286a1 1 0 0 0 0 1.418 1 1 0 0 0 1.418 0L6 7.408l4.286 4.296a.998.998 0 0 0 1.418 0 1 1 0 0 0 0-1.418L7.41 5.999Z"/>
                    </g>
                    <defs>
                        <clipPath id="a">
                            <path fill="#fff" d="M0 0h12v12H0z"/>
                        </clipPath>
                    </defs>
                </svg>
            </button>
        </div>
        <div class="modal-popup-body">
            <!-- contents -->
            <div class="form-control-wrap">
                <label id="parent_menu_code_label" class="form-label" for="parent_menu_code">상위 메뉴 <span
                        class="badge required">필수</span></label>
                <div class="dropdown-wrapper"></div>
            </div>
            <div class="form-control-wrap">
                <label id="menu_code_label" class="form-label" for="menu_code">메뉴 코드 <span
                        class="badge required">필수</span></label>
                <input type="text" id="menu_code" class="form-control sm" placeholder="메뉴코드를 입력해주세요."
                       aria-labelledby="menu_code_label" maxlength="10" required="required">
            </div>
            <div class="form-control-wrap">
                <label id="menu_name_label" class="form-label" for="menu_name">메뉴명 <span
                        class="badge required">필수</span></label>
                <input type="text" id="menu_name" class="form-control sm" placeholder="메뉴명을 입력해주세요."
                       aria-labelledby="menu_name_label" maxlength="50" required="required">
            </div>
            <div class="form-control-wrap">
                <label id="menu_link_label" class="form-label" for="menu_link">경로</label>
                <input type="text" id="menu_link" class="form-control sm" placeholder="경로를 입력해주세요."
                       aria-labelledby="menu_link_label" maxlength="50">
            </div>
            <div class="form-control-wrap">
                <label id="menu_icon_label" class="form-label" for="menu_icon">아이콘</label>
                <input type="text" id="menu_icon" class="form-control sm" placeholder="아이콘을 입력해주세요."
                       aria-labelledby="menu_icon_label" maxlength="20">
            </div>
            <div class="form-control-wrap">
                <label id="ordby_label" class="form-label" for="ordby">정렬 순서 <span
                        class="badge required">필수</span></label>
                <input type="number" id="ordby" class="form-control sm" placeholder="정렬 순서를 입력해주세요. (0~999)"
                       aria-labelledby="ordby_label" min="0" max="999" required="required">
            </div>
            <!-- contents end -->
        </div>
        <div class="modal-popup-footer buttons">
            <button type="button" class="ui-button sm outline-primary btn-cancel btn-popup-close"
                    data-popup-id="modal-menu">취소
            </button>
            <button type="button" class="ui-button sm primary btn-popup-save btn-register"
                    data-popup-id="modal-menu">저장
            </button>
        </div>
    </div>
    <div class="modal-popup-mask"></div>
</div>
<!-- MODAL POPUP end // -->
