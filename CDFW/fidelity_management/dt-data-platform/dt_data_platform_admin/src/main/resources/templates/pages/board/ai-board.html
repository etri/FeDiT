<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/layout}">

<head>
    <title th:text="${breadcrumb.menu_nm}">게시판</title>
    <!--임시css-->
    <!-- <link rel="stylesheet" href="../../../assets/css/temp.css"> -->

    <style>
        .table-responsive-meta {
            max-height: 400px;
            /* overflow-y: auto; */
        }

        #dynamic-card-body {
            height: auto; /* 고정된 높이를 제거합니다. */
            min-height: 100px; /* 필요한 경우 최소 높이를 설정합니다. */
        }

        .table-responsive {
            max-height: fit-content !important;
        }
    </style>
</head>
<div layout:fragment="content">
    <form name="searchForm" th:action="@{/dt/board/ai/list(menuCd=${params.menuCd})}" th:object="${params}"
          method="GET">
        <div id="loading" style="margin-left: 0px;display: none;">
            <img th:src="@{/assets/images/ajax-loading.gif}">
        </div>
        <nav th:replace="fragments/page_breadcrumb"></nav>
        <div class="row">
            <div class="col-12" style="margin-bottom: 0.3rem;">
                <div class="card stretch-card">
                    <div class="card-body">
                        <input type="hidden" th:field="*{menuCd}">
                        <input type="hidden" id="pagingPage" name="page" th:value="${paging.page}">
                        <input type="hidden" id="pagingSize" name="size" th:value="${paging.size}">
                        <div class="row">
                            <div class="col-sm-12">
                                <p class="d-block mb-3">Lorem ipsum dolor sit amet, consectetur adipisicing elit.
                                    Consequuntur
                                    eaque
                                    nesciunt sapiente
                                    vero. Alias aut deleniti distinctio, dolore, enim nulla officia porro quod,
                                    recusandae
                                    repellat
                                    repellendus sequi vel voluptate voluptatem!</p>
                            </div>
                            <div class="col-sm-12">
                                <div class="form-group row">
                                    <div class="col-auto my-auto">
                                        <select th:field="*{field}" class="form-control">
                                            <option value="title">제목</option>
                                            <option value="description">내용</option>
                                            <option value="author">작성자</option>
                                        </select>
                                    </div>
                                    <div class="col my-auto">
                                        <input type="text" th:field="*{keyword}" class="form-control"
                                               placeholder="검색어를 입력하세요">
                                    </div>
                                    <div class="col-auto my-auto">
                                        <button type="submit" class="btn btn-primary mr-2 btn-icon-text btn-search">
                                            <i class="btn-icon-prepend" data-feather="search"></i>조회
                                        </button>
                                        <a th:href="@{|/dt/board/ai/form?menuCd=${menuCd}|}"
                                           class="btn btn-secondary btn-icon-text">
                                            <i class="btn-icon-prepend" data-feather="edit"></i>등록
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="card stretch-card">
                    <div class="card-body">
                        <p class="card-description" id="main_range">
                            <th:block th:include="fragments/paging_result_single:: paging_result('')"></th:block>
                        </p>
                        <table class="table table-hover table-responsive table-text-nowrap">
                            <colgroup>
                                <col style="width: auto;">
                                <col style="width: 30%;">
                                <col style="width: 100%;">
                                <col style="width: auto;">
                                <col style="width: auto;">
                                <col style="width: auto;">
                            </colgroup>
                            <thead>
                            <tr>
                                <th>순번</th>
                                <th>제목</th>
                                <th>내용</th>
                                <th>작성자</th>
                                <th>등록일</th>
                                <th>기능</th>
                            </tr>
                            </thead>
                            <tbody class="table-text-nowrap">
                            <th:block th:include="fragments/table_empty:: table_empty(6)"
                                      th:if="${#lists.isEmpty(boards)}"></th:block>
                            <tr th:each="item : ${boards}" th:unless="${#lists.isEmpty(boards)}">
                                <td th:text="${paging.total - item.rnum + 1}"></td>
                                <td>
                                    <a th:href="@{|/dt/board/ai/${item.board_seq}?menuCd=${menuCd}|}"
                                       th:text="${item.board_nm}">제목</a>
                                </td>
                                <td th:text="${item.board_smp_derpn}"></td>
                                <td th:text="${item.user_id}"></td>
                                <td th:text="${item.reg_dt}"></td>
                                <td>
                                    <th:block th:if="${item.is_delete == true}">
                                        <button type="button" class="btn btn-sm btn-danger btn-icon-text text-nowrap"
                                                data-action="delete" th:data-number="${item.board_seq}"
                                                data-type="AI_MODEL">
                                            삭제
                                        </button>
                                    </th:block>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <th:block th:include="fragments/paging"></th:block>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<th:block layout:fragment="custom_css">
    <link rel="stylesheet" th:href="@{/assets/css/codemirror.css}"/>
    <link rel="stylesheet" th:href="@{/assets/vendors/datatables.net-bs4/dataTables.bootstrap4.css}">
    <link rel="stylesheet" th:href="@{/assets/css/custom.css}">
</th:block>
<th:block layout:fragment="custom_js">
    <script th:src="@{/assets/js/file-upload.js}"></script>
    <script th:src="@{/assets/js/pages/dt_etc_model/common/progress.js}"></script>
    <script th:src="@{/assets/js/browser_event.js}"></script>
    <script th:src="@{/assets/js/pages/board/board.js}"></script>
</th:block>
</html>
