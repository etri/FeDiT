<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<!-- MODAL POPUP -->
<div class="modal-popup-wrap" id="modalApiView"> <!-- is-open -->
	<div class="modal-popup">
		<div class="modal-popup-header">
			<p class="title">메타 정보</p>
			<button type="button" class="btn-popup-close right" data-popup-id="modalApiView">
				<svg aria-label="닫기" role="img" viewBox="0 0 12 12" preserveAspectRatio="xMidYMid meet"
					 xmlns="http://www.w3.org/2000/svg" fill="none">
					<g clip-path="url(#a)">
						<path fill="#C7C7C7"
							  d="m7.409 6 4.295-4.287a1.003 1.003 0 0 0-1.418-1.42L6 4.59 1.714.294A1.003 1.003 0 1 0 .296 1.713L4.59 5.999.296 10.286a1 1 0 0 0 0 1.418 1 1 0 0 0 1.418 0L6 7.408l4.286 4.296a.998.998 0 0 0 1.418 0 1 1 0 0 0 0-1.418L7.41 5.999Z"/>
					</g>
					<defs>
						<clipPath id="a">
							<path fill="#fff" d="M0 0h12v12H0z"/>
						</clipPath>
					</defs>
				</svg>
			</button>
		</div>
		<div class="modal-popup-body">
			<!-- contents -->
			<div class="form-control-wrap">
				<label id="digitalTwinId_label" class="form-label" for="digitalTwinId">트윈 아이디</label>
				<input type="text" id="digitalTwinId" readonly="readonly" class="form-control sm"
					   placeholder="트윈 아이디를 입력해주세요" aria-labelledby="digitalTwinId_label">
			</div>
			<div class="form-control-wrap">
				<label id="digitalObjectId_label" class="form-label" for="digitalObjectId">오브젝트 아이디</label>
				<input type="text" id="digitalObjectId" readonly="readonly" class="form-control sm"
					   placeholder="오브젝트 아이디를 입력해주세요" aria-labelledby="digitalObjectId_label">
			</div>
			<div class="form-control-wrap">
				<label id="digitalObjectName_label" class="form-label" for="digitalObjectName">디지털 객체명</label>
				<input type="text" id="digitalObjectName" readonly="readonly" class="form-control sm"
					   placeholder="디지털 객체명을 입력해주세요" aria-labelledby="digitalObjectName_label">
			</div>
			<div class="form-control-wrap">
				<label id="digitalObjectDataSourceUrl_label" class="form-label" for="digitalObjectDataSourceUrl">디지털 객체
					데이터 URL</label>
				<input type="text" id="digitalObjectDataSourceUrl" readonly="readonly" class="form-control sm"
					   placeholder="디지털 객체 데이터 URL을 입력해주세요" aria-labelledby="digitalObjectDataSourceUrl_label">
			</div>
			<div class="form-control-wrap">
				<label id="description_label" class="form-label" for="description">디지털 객체 설명</label>
				<textarea id="description" readonly="readonly" rows="5" class="form-control sm"
						  placeholder="디지털 객체 설명을 입력해주세요."></textarea>
			</div>
			<div class="form-control-wrap">
				<label id="digitalObjectDataModel_label" class="form-label" for="digitalObjectDataModel">디지털 오브젝트 데이터
					모델</label>
				<textarea id="digitalObjectDataModel" readonly="readonly" rows="5" class="form-control sm"
						  placeholder="디지털 오브젝트 데이터 모델을 입력해주세요."></textarea>
			</div>
			<div class="form-control-wrap">
				<label id="digitalObjectDataSample_label" class="form-label" for="digitalObjectDataSample">디지털 오브젝트 데이터
					샘플</label>
				<textarea id="digitalObjectDataSample" readonly="readonly" rows="5" class="form-control sm"
						  placeholder="디지털 오브젝트 데이터 샘플을 입력해주세요."></textarea>
			</div>
			<!-- contents end -->
		</div>
		<div class="modal-popup-footer buttons">
			<button type="button" class="ui-button sm outline-primary btn-cancel btn-popup-close"
					data-popup-id="modalApiView">닫기
			</button>
			<button type="button" class="ui-button sm primary btn-popup-save btn-popup-close btn-get-meta-all-info"
					data-popup-id="modalApiView">가져오기
			</button>
		</div>
	</div>
	<div class="modal-popup-mask"></div>
</div>
<!-- MODAL POPUP end // -->
</body>
</html>
