<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<th:block th:fragment="tab_unit">
    <!-- 데이터 전처리 Unit Conversion Tab Contents-->
    <div id="tab_unit_range" class="col-12 pt-3">
        <div class="row">
            <div class="col-12">
                <label class="col-form-label">컬럼의 단위 변환</label>
                <span style="display: inline-block; width: 100%; font-size: 13px; color: red;">
                    원본 단위를 정확하게 선택하세요.
                </span>
            </div>
            <div class="col-12 pt-3">
                <div class="row">
                    <div class="col-6">
                        <div class="row">
                            <div class="col-12">
                                <label class="col-form-label">컬럼 선택</label>
                            </div>
                            <div class="col-12" id="preProcUnitTargetCol">
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="row">
                            <div class="col-12">
                                <label class="col-form-label">변환 유형 선택</label>
                            </div>
                            <div class="col-12">
                                <div class="dropdown-wrapper">
                                    <div class="dropdown-box">
                                        <button type="button" class="form-control sm dropdown-toggle"
                                                id="select_unit_tp" data-value="O">현재간격유지
                                        </button>
                                        <div class="dropdown-layer" id="select_unit_tp_selection"
                                             aria-expanded="false">
                                            <ul class="option-list">
                                                <li>
                                                    <input type="radio"
                                                           id="input_select_unit_tp_0"
                                                           name="select_unit_tp_input"
                                                           value="0">
                                                    <label for="input_select_unit_tp_0">선택 없음</label>
                                                </li>
                                                <li th:each="item : ${unit_type_list}">
                                                    <input type="radio"
                                                           th:id="${'input_' + 'select_unit_tp' + '_' + item.dtl_cd}"
                                                           name="select_unit_tp_input"
                                                           th:value="${item.dtl_cd}">
                                                    <label th:for="${'input_' + 'select_unit_tp' + '_' + item.dtl_cd}"
                                                           th:text="${item.dtl_cd_nm}">선택</label>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 pt-3">
                <div id="unit_select_box_range" class="row"></div>
                <input type="hidden" id="select_unit_seq">
            </div>
            <div class="col-12 pt-3">
                <button type="button" class="ui-button primary sm btn-make-unit">변환</button>
            </div>
        </div>
    </div>

    <!-- 업로드 테이블-->
    <th:block th:if="${formType == 'I'}">
        <div class="col-12">
            <div id="preprocTableRangeUnit" class="pt-3" style="display: none;"></div>
        </div>
    </th:block>

    <div id="next_button_unit_range" class="col-12 pt-3" style="display: none; text-align: end;">
        <button type="button" class="ui-button primary sm prev-preproc-resample-step">
            이전
        </button>
        <button type="button" class="ui-button primary sm next-model-step">
            다음(save or model)
        </button>
    </div>
</th:block>
</html>
