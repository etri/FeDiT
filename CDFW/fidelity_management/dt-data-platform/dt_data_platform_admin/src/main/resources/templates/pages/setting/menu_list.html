<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/platform_layout}">

<head>
    <title th:text="${breadcrumb.menu_nm}">메뉴관리</title>
</head>

<div layout:fragment="content">
    <div class="page-title">
        <div class="contain">
            <h1 th:text="${breadcrumb.menu_nm}">사용자관리</h1>
        </div>
    </div>
    <div class="list-top">
        <div class="contain">
            <form name="searchForm" th:action="@{/setting/menu(menuCd=${params.menuCd})}"
                  th:object="${params}"
                  method="GET" style="display: none;">
                <input type="hidden" th:field="*{menuCd}">
                <input type="hidden" id="pagingPage" name="page" th:value="${paging.page}">
                <input type="hidden" id="pagingSize" name="size" th:value="${paging.size}">
                <input type="hidden" th:field="*{sortName}">
                <input type="hidden" th:field="*{sortType}">
                <input type="hidden" th:field="*{field}"/>
                <input type="hidden" th:field="*{keyword}"/>
                <button type="submit" class="ui-button primary btn-search">조회</button>
            </form>
            <div class="filter-wrap">
                <!-- 유형 -->
                <div class="filter-layer-box"><!-- 옵션 선택시 :: is-selected 클래스 추가 -->
                    <button type="button" class="filter-toggle">유형<span class="filter-value"
                                                                        th:data-initialize="${params.field}">메뉴명</span>
                    </button>
                    <div class="filter-layer" aria-expanded="false" style="position: absolute; top: calc(100% + 2px);">
                        <ul class="option-list">
                            <li>
                                <input type="radio" id="searchType1" name="searchType" value="menu_nm"
                                       th:checked="${params.field == 'menu_nm' or params.field == null}">
                                <label for="searchType1">메뉴명</label>
                            </li>
                        </ul>
                    </div>
                </div>
                <!-- 검색어 -->
                <div class="filter-layer-box">
                    <button type="button" class="filter-toggle">검색어<span class="filter-value"
                                                                         th:if="${params.keyword != null && params.keyword != ''}"
                                                                         th:text="${params.keyword}"></span></button>
                    <div class="filter-layer exclude-layer form-control-wrap"
                         style="position: absolute; top: calc(100% + 2px);"
                         aria-expanded="false">
                        <div class="input-group">
                            <input type="text" id="filterKeyword" class="form-control md" placeholder="검색어를 입력해주세요">
                            <button type="button" class="form-right-action" id="filterKeywordAction">입력</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="buttons-group">
                <button type="button"
                        class="ui-button xs primary ico btn-add-menu">
                    <img src="/assets/images/platform/ico_add_wh.svg" alt="">등록
                </button>
            </div>
        </div>
    </div>
    <section class="data-section">
        <div class="contain">
            <div class="row">
                <div class="col-12">
                    <div class="table-box">
                        <table class="data-table">
                            <colgroup>
                                <col style="width: 5%;">
                                <col style="width: 15%;">
                                <col style="width: 20%;">
                                <col style="width: 10%;">
                                <col style="width: 20%;">
                                <col style="width: 10%;">
                                <col style="width: 15%;">
                            </colgroup>
                            <thead>
                            <tr>
                                <th>번호</th>
                                <th>메뉴코드</th>
                                <th>메뉴명</th>
                                <th>상위 메뉴</th>
                                <th>메뉴 경로</th>
                                <th>등록일</th>
                                <th class="ta-r">기능</th>
                            </tr>
                            </thead>
                            <tbody>
                            <th:block th:include="fragments/table_empty:: table_empty(7)"
                                      th:if="${#lists.isEmpty(list)}"></th:block>
                            <tr th:each="item, rows : ${list}" th:unless="${#lists.isEmpty(list)}">
                                <td th:text="${paging.total - rows.index}">1</td>
                                <td th:switch="${item.level}">
                                    <th:block th:case="1" th:utext="'&nbsp;' + ${item.menu_cd}"></th:block>
                                    <th:block th:case="2"
                                              th:utext="'&nbsp;&nbsp;&nbsp;&nbsp;' + ${item.menu_cd}"></th:block>
                                    <th:block th:case="3"
                                              th:utext="'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;' + ${item.menu_cd}"></th:block>
                                    <th:block th:case="*" th:utext="${item.menu_cd}"></th:block>
                                </td>
                                <td th:switch="${item.level}">
                                    <th:block th:case="1" th:utext="'&nbsp;' + ${item.menu_nm}"></th:block>
                                    <th:block th:case="2"
                                              th:utext="'&nbsp;&nbsp;&nbsp;&nbsp;ㄴ&nbsp;' + ${item.menu_nm}"></th:block>
                                    <th:block th:case="3"
                                              th:utext="'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ㄴ&nbsp;' + ${item.menu_nm}"></th:block>
                                    <th:block th:case="*" th:utext="${item.menu_cd}"></th:block>
                                </td>
                                <td th:text="${item.up_menu_cd}">parent_menu_code</td>
                                <td th:text="${item.menu_url}">parent_menu_code</td>
                                <td th:text="${item.reg_dt}">등록일</td>
                                <td class="ta-r">
                                    <button type="button" class="ui-button primary sm btn-modify"
                                            th:data-menu-code="${item.menu_cd}">수정
                                    </button>
                                    <button type="button" class="ui-button danger sm btn-delete"
                                            th:data-menu-code="${item.menu_cd}"
                                            th:data-parent-menu-code="${item.up_menu_cd}">삭제
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <th:block th:include="fragments/modal/admin-modal-menu"></th:block>
        </div>
    </section>
</div>

<th:block layout:fragment="custom_css">
</th:block>
<th:block layout:fragment="custom_js">
    <script th:src="@{/assets/js/pages/setting/menu_list.js}"></script>
</th:block>
</html>
