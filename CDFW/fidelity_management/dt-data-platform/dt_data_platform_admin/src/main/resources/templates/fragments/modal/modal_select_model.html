<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <div class="modal fade bd-example-modal-lg" id="modalModelList" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">모델 목록</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table id="datatableModelList" class="table table-hover">
                            <colgroup>
                            	<col style="width: 20%;">
                            	<col style="width: 20%;">
                            	<col style="width: 10%;">
                            	<col style="width: 10%;">
                            	<col style="width: 10%;">
                                <col style="width: 20%;">
                                <col style="width: 10%;">
                            </colgroup>
                            <thead>
                                <tr>
                                    <th>모델명</th>
                                    <th>모델설명</th>
                                    <!-- <th>결측보간여부</th> -->
                                    <!-- <th>리샘플여부</th> -->
                                    <th>시계열컬럼단위</th>
                                    <th>시계열컬럼간격</th>
                                    <th>전처리최종레벨</th>
                                    <th>등록일</th>
                                    <th>선택</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${modal_model_list}">
                                    <td th:text="${item.model_nm}"></td>
                                    <td th:text="${item.model_derpn}"></td>
                                    <td th:text="${item.resmpl_intvl_tp_nm}"></td>
                                    <td th:text="${item.resmpl_intvl_value}"></td>
                                    <!--
                                    <td> 
                                    	<th:block th:if="${item.interpl_tp !=  null}"><th:block th:text="${item.interpl_tp}"></th:block></th:block>
                                    	<th:block th:unless="${item.interpl_tp !=  null}">-</th:block>
                                    </td>
                                    <td> 
                                    	<th:block th:if="${item.resmpl_intvl_tp !=  null}"><th:block th:text="${item.resmpl_intvl_tp}"></th:block></th:block>
                                    	<th:block th:unless="${item.resmpl_intvl_tp !=  null}">-</th:block>
                                    </td>
                                    -->
                                    <td th:text="${item.prcs_level}"></td>
                                    <td th:text="${item.reg_dt}"></td>
                                    <td>
                                    	<button type="button" class="btn btn-secondary btn-select-modal-model" th:data-model-seq="${item.model_seq}"  th:data-model-nm="${item.model_nm}" th:data-model-algrm-seq="${item.model_algrm_seq}"  th:data-resmpl-intvl-tp="${item.resmpl_intvl_tp}"  th:data-resmpl-intvl-value="${item.resmpl_intvl_value}">선택</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>

</html>
