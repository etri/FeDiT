<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<th:block th:fragment="paging_sub">
    <nav th:if="${subPaging.total > 0}" class="pagination md" role="navigation" aria-label="목록 페이지네이션">
        <button type="button" class="page-link direction first"
                th:attr="disabled=${subPaging.page == 1} ? 'disabled' : null"
                th:data-page="${paging.page}" th:data-sub-page="${subPaging.first}" th:data-page-range="sub_range"
                aria-label="첫 페이지로"><span>첫 페이지</span></button>
        <button type="button" class="page-link direction prev"
                th:attr="disabled=${subPaging.page == 1} ? 'disabled' : null"
                th:data-page="${paging.page}" th:data-sub-page="${subPaging.prev}" th:data-page-range="sub_range"
                aria-label="이전 페이지로"><span>이전 페이지</span></button>
        <!---->
        <th:block th:each="subPage : ${#numbers.sequence(subPaging.begin, subPaging.end)}">
            <button type="button" class="page-link pagemove" th:classappend="${subPage == subPaging.page} ? 'on' : null"
                    th:title="${subPage}" th:text="${subPage}" th:data-page="${paging.page}"
                    th:data-sub-page="${subPage}"
                    th:data-page-range="sub_range"
                    aria-label="1페이지로 이동"
                    th:attr="aria-current=${subPage == subPaging.page} ? 'true' : null">1
            </button>
        </th:block>
        <!---->
        <button type="button" class="page-link direction next"
                th:attr="disabled=${subPaging.page == subPaging.last} ? 'disabled' : null" th:data-page="${paging.page}"
                th:data-sub-page="${subPaging.next}" th:data-page-range="sub_range"
                aria-label="다음 페이지로"><span>다음 페이지</span></button>
        <button type="button" class="page-link direction last"
                th:attr="disabled=${subPaging.page == subPaging.last} ? 'disabled' : null" th:data-page="${paging.last}"
                th:data-sub-page="${subPaging.subPage}" th:data-page-range="sub_range"
                aria-label="마지막 페이지로"><span>마지막 페이지</span></button>
    </nav>
</th:block>
</html>
