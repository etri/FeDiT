<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/layout}">

<head>
    <title th:text="${breadcrumb.menu_nm}">게시판관리</title>
    <!--임시css-->
    <!-- <link rel="stylesheet" href="../../../assets/css/temp.css"> -->

    <style>
        .table-responsive-meta {
            max-height: 400px;
            /* overflow-y: auto; */
        }

        #dynamic-card-body {
            height: auto; /* 고정된 높이를 제거합니다. */
            min-height: 100px; /* 필요한 경우 최소 높이를 설정합니다. */
        }

    </style>
</head>
<div layout:fragment="content">
    <div id="loading" style="margin-left: 0px;display: none;">
        <img th:src="@{/assets/images/ajax-loading.gif}">
    </div>
    <nav th:replace="fragments/page_breadcrumb"></nav>
    <form name="editForm" id="editForm" th:action="@{|/dt/model/form|}" th:object="${dtModel}" method="post">
        <input type="hidden" name="menuCd" id="menuCd" th:value="${menuCd}">
        <input type="hidden" name="formType" id="formType" th:value="${formType}">
        <input type="hidden" id="dataList">
        <input type="hidden" id="headerList">
        <textarea class="form-control preprocProPerty" rows="20"></textarea>
        <input type="hidden" id="base_file_nm_set_range_row_check">
        <input type="hidden" id="input_info_check">
        <input type="hidden" id="resampel_first_check" value="N">
        <input type="hidden" id="preprocCurrent">
        <input type="hidden" name="algorithm_meta_set" id="algorithm_meta_set">
        <input type="hidden" name="algorithm_param_template_set" id="algorithm_param_template_set">
        <input type="hidden" id="model_status" th:value="${dtModel.modelStatus}">
        <!--실패시 실패 내용에 관련된 input-->
        <th:block th:if="${dtModel.modelStatus == 'FAIL' and errorLog != null}">
            <div id="error_frame">
                <div id="err_type" th:attr="data-value=${errorLog.errTp}"></div>
                <div id="errCd" th:attr="data-value=${errorLog.errCd}"></div>
                <div id="errNm" th:attr="data-value=${errorLog.errNm}"></div>
                <div id="errLct" th:attr="data-value=${errorLog.errLct}"></div>
                <div id="errCn" th:attr="data-value=${errorLog.errCn}"></div>
                <div id="errRegDt" th:attr="data-value=${errorLog.regDt}"></div>
            </div>
        </th:block>

        <th:block th:if="${formType == 'I'}">
            <input type="hidden" name="preprocProPerty" id="preprocProPerty">
            <input type="hidden" name="lastFilePath" id="lastFilePath">
            <input type="hidden" id="modelSeq">
        </th:block>
        <th:block th:unless="${formType == 'I'}">
            <input type="hidden" name="preprocProPerty" id="preprocProPerty"
                   th:value="${dtModelMetaUserItem.userPprcsFullStngValue}">
            <input type="hidden" name="lastFilePath" id="lastFilePath" th:value="${lastFilePath}">
            <input type="hidden" id="modelSeq" th:value="${dtModel.modelSeq}">


            <th:block th:if="${dtModel.modelStatus == 'DONE'}">
                <input type="hidden" name="predictionFileListCount" id="predictionFileListCount"
                       th:value="${predictionFileListCount}">
            </th:block>
        </th:block>

        <!-- <div class="row"> -->
        <!-- <div class="col-md-8 border-right"> -->

        <div class="card-header">
            <th:block th:if="${formType == 'I'}">
                <ul class="nav nav-tabs card-header-tabs">
                    <li class="nav-item"><span class="nav-link active" id="tab_getdata">데이터선택</span></li>
                    <li class="nav-item"><span class="nav-link " id="tab_info">정보입력</span></li>
                    <li class="nav-item"><span class="nav-link " id="tab_column_info">데이터현황</span></li>
                    <li class="nav-item"><span class="nav-link" id="tab_preproc">전처리 설정</span></li>
                    <li class="nav-item"><span class="nav-link" id="tab_getalgo">모델 설정</span></li>
                    <!-- <li class="nav-item"><a class="nav-link" id="tab_excmodel" th:href="@{|#|}">모델 실행</a></li> -->
                    <li class="nav-item"><span class="nav-link" id="tab_savemodel">결과</span></li>
                </ul>
            </th:block>
            <th:block th:unless="${formType == 'I'}">
                <ul class="nav nav-tabs card-header-tabs">
                    <!-- <li class="nav-item"><a class="nav-link active" id="tab_getdata">데이터선택</a></li> -->
                    <li class="nav-item"><a class="nav-link " id="tab_info">정보입력</a></li>
                    <li class="nav-item"><a class="nav-link " id="tab_column_info">데이터현황</a></li>
                    <li class="nav-item"><a class="nav-link" id="tab_preproc">전처리 설정</a></li>
                    <li class="nav-item"><a class="nav-link" id="tab_getalgo">모델 설정</a></li>
                    <li class="nav-item"><a class="nav-link" id="tab_savemodel">결과</a></li>
                </ul>
            </th:block>
        </div>

        <!--데이터 미리보기 -->
        <!--데이터선택  -->
        <div id="tab_getdata_range">
            <th:block th:include="pages/dt_model/fragments/1_select_data:: select_data"></th:block>
            <div id="search_meta_api_list_table"></div>
            <div id="search_meta_api_list_table_obj"></div>
        </div>

        <!--정보입력  -->
        <div id="tab_info_range" style="display: none;">
            <th:block th:include="pages/dt_model/fragments/2_input_info:: input_info"></th:block>
        </div>

        <!--데이터현황  -->
        <div id="tab_column_info_range">
            <th:block th:include="pages/dt_model/fragments/2_1_column_info:: column_info"></th:block>
        </div>

        <!--전처리설정  -->
        <div id="tab_preproc_range" style="display: none;">
            <th:block th:include="pages/dt_model/fragments/3_preprocess:: preprocess"></th:block>
        </div>

        <!--알고리즘 선택  -->
        <div id="tab_getalgo_range" style="display: none;">
            <th:block th:include="pages/dt_model/fragments/4_select_algorithm:: select_algorithm"></th:block>
        </div>

        <!--모델 저장  -->
        <div id="tab_savemodel_range" style="display: none;">
            <th:block th:include="pages/dt_model/fragments/5_save_model:: save_model"></th:block>
        </div>

        <div id="tab_preview_range" style="display: none;">
            <th:block th:include="pages/dt_model/fragments/0_preview_data:: preview_data"></th:block>
        </div>
    </form>

    <!-- api view 모달 -->
    <th:block th:include="pages/dt_model/modal/modal_api_view_pop"></th:block>

    <!--Error 모달-->
    <th:block th:include="fragments/modal/modal_error_info"></th:block>
</div>
<th:block layout:fragment="custom_css">
    <link rel="stylesheet" th:href="@{/assets/css/codemirror.css}"/>
    <link rel="stylesheet" th:href="@{/assets/vendors/datatables.net-bs4/dataTables.bootstrap4.css}">
    <link rel="stylesheet" th:href="@{/assets/css/custom.css}">
</th:block>
<th:block layout:fragment="custom_js">
    <script th:src="@{/echarts532/dist/echarts.min.js}"></script>
    <script th:src="@{/assets/js/echart/echarts.js}"></script>
    <script th:src="@{/assets/js/echart/echarts_view.js}"></script>
    <script th:src="@{/assets/vendors/datatables.net/jquery.dataTables.js}"></script>
    <script th:src="@{/assets/vendors/datatables.net-bs4/dataTables.bootstrap4.js}"></script>
    <script th:src="@{/assets/js/file-upload.js}"></script>
    <script th:src="@{/assets/js/pages/dt_model/common/progress.js}"></script>
    <script th:src="@{/assets/js/pages/dt_model/1_select_data.js}"></script>
    <script th:src="@{/assets/js/pages/dt_model/2_input_info.js}"></script>
    <script th:src="@{/assets/js/pages/dt_model/3_preprocess.js}"></script>
    <script th:src="@{/assets/js/pages/dt_model/4_select_algorithm.js}"></script>
    <script th:src="@{/assets/js/pages/dt_model/5_save_model.js}"></script>
    <script th:src="@{/assets/js/pages/dt_model/preprocess_interpolate.js}"></script>
    <script th:src="@{/assets/js/browser_event.js}"></script>
    <script th:src="@{/assets/js/pages/dt_model/datepicker.kr.js}"></script>
    <th:block th:unless="${formType == 'I'}">
        <script th:src="@{/assets/js/pages/dt_model/common/common-dt-tab-control-view.js}"></script>
    </th:block>
</th:block>

</html>
