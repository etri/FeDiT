<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/platform_layout}">
<head>
    <title th:text="${breadcrumb.menu_nm}">사용자관리</title>
</head>
<div layout:fragment="content">
    <div class="page-title">
        <div class="contain">
            <h1 th:text="${breadcrumb.menu_nm}">사용자관리</h1>
        </div>
    </div>
    <div class="list-top">
        <div class="contain">
            <form name="searchForm" th:action="@{/setting/user(menuCd=${params.menuCd})}"
                  th:object="${params}"
                  method="GET" style="display: none;">
                <input type="hidden" th:field="*{menuCd}">
                <input type="hidden" id="pagingPage" name="page" th:value="${paging.page}">
                <input type="hidden" id="pagingSize" name="size" th:value="${paging.size}">
                <input type="hidden" th:field="*{sortName}">
                <input type="hidden" th:field="*{sortType}">
                <input type="hidden" th:field="*{field}"/>
                <input type="hidden" th:field="*{keyword}"/>
                <button type="submit" class="ui-button primary btn-search">조회</button>
            </form>
            <div class="filter-wrap">
                <!-- 유형 -->
                <div class="filter-layer-box"><!-- 옵션 선택시 :: is-selected 클래스 추가 -->
                    <button type="button" class="filter-toggle">유형<span class="filter-value"
                                                                        th:data-initialize="${params.field}">아이디</span>
                    </button>
                    <div class="filter-layer" aria-expanded="false" style="position: absolute; top: calc(100% + 2px);">
                        <ul class="option-list">
                            <li>
                                <input type="radio" id="searchType1" name="searchType" value="user_id"
                                       th:checked="${params.field == 'user_id' or params.field == null}">
                                <label for="searchType1">아이디</label>
                            </li>
                            <li>
                                <input type="radio" id="searchType2" name="searchType" value="user_nm"
                                       th:checked="*{params.field == 'user_nm'}">
                                <label for="searchType2">이름</label>
                            </li>
                        </ul>
                    </div>
                </div>
                <!-- 검색어 -->
                <div class="filter-layer-box">
                    <button type="button" class="filter-toggle">검색어<span class="filter-value"
                                                                         th:if="${params.keyword != null && params.keyword != ''}"
                                                                         th:text="${params.keyword}"></span></button>
                    <div class="filter-layer exclude-layer form-control-wrap"
                         style="position: absolute; top: calc(100% + 2px);"
                         aria-expanded="false">
                        <div class="input-group">
                            <input type="text" id="filterKeyword" class="form-control md" placeholder="검색어를 입력해주세요">
                            <button type="button" class="form-right-action" id="filterKeywordAction">입력</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="buttons-group">
                <button type="button" th:data-href="@{|/setting/user/form?${pageParams}|}"
                        class="ui-button xs primary ico">
                    <img src="/assets/images/platform/ico_add_wh.svg" alt="">등록
                </button>
            </div>
        </div>
    </div>
    <section class="data-section">
        <div class="contain">
            <div class="row">
                <div class="col-12">
                    <div class="table-box">
                        <table class="data-table">
                            <colgroup>
                                <col style="width: 5%;">
                                <col style="width: 10%;">
                                <col style="width: 10%;">
                                <col style="width: 10%;">
                                <col style="width: 15%;">
                                <col style="width: 10%;">
                                <col style="width: 10%;">
                                <col style="width: 12%;">
                            </colgroup>
                            <thead>
                            <tr>
                                <th>번호</th>
                                <th>아이디</th>
                                <th>이름</th>
                                <th>권한</th>
                                <th>이메일</th>
                                <th>전화번호</th>
                                <th>등록일</th>
                                <th>최근 로그인 일시</th>
                            </tr>
                            </thead>
                            <tbody class="table-text-nowrap">
                            <th:block th:include="fragments/table_empty:: table_empty(8)"
                                      th:if="${#lists.isEmpty(list)}"></th:block>
                            <tr th:each="item : ${list}" th:unless="${#lists.isEmpty(list)}">
                                <td th:text="${paging.total - item.rnum + 1}">1</td>
                                <td>
                                    <a th:href="@{|/setting/user/${item.user_seq}?${pageParams}|}"
                                       th:text="${item.id}">아이디</a>
                                </td>
                                <td>
                                    <a th:href="@{|/setting/user/${item.user_seq}?${pageParams}|}"
                                       th:text="${item.user_nm}">이름</a>
                                </td>
                                <td th:text="${item.auth_nm}">권한</td>
                                <td th:text="${item.user_eml}">이메일</td>
                                <td th:text="|${item.user_hp_1}${item.user_hp_2}${item.user_hp_3}|">전화번호</td>
                                <td th:text="${item.reg_dt}">등록일</td>
                                <td th:text="${item.last_lgn_dt}">등록일</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <th:block th:include="fragments/platform_paging"></th:block>
                </div>
            </div>
        </div>
    </section>
</div>

<th:block layout:fragment="custom_css">
</th:block>
<th:block layout:fragment="custom_js">
    <script th:src="@{/assets/js/pages/setting/user_list.js}"></script>
</th:block>
</html>
