<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<th:block th:fragment="select_data">
    <div class="row" data-action-container="select_data">
        <th:block th:if="${formType == 'I'}">
            <div class="col-12 pt-3">
                <ul>
                    <li>
                        <div class="bg-box">
                            <p class="dot-desc">데이터 유형 선택은 데이터를 직접 업로드 하는 파일 업로드 방식과 데이터를 디지털 트윈 오브젝트 메타 연계를 이용하여 가져오는 메타 연계 방식이 있습니다.</p>
                        </div>
                    </li>
                    <li>
                        <div class="bg-box">
                            <p class="dot-desc">파일 업로드와 메타 연계 동일한 기능을 수행합니다.</p>
                        </div>
                    </li>
                    <li>
                        <div class="bg-box">
                            <p class="dot-desc">메타 연계 선택 시 디지털 트윈과 오브젝트를 선택하여 가져올 데이터를 지정합니다.</p>
                        </div>
                    </li>
                </ul>
            </div>
            <div class="col-12 pt-3">
                <div class="row">
                    <div class="col-lg-3">
                        <label class="col-form-label">데이터유형선택</label>
                    </div>
                    <div class="col-lg-9">
                        <ul class="form-checkbox-list">
                            <li class="form-checkbox">
                                <input type="radio" name="dataUseTp" id="dataUseTpY" class="ui-check" value="F"
                                       data-label="공개"
                                       aria-labelledby="dataUseTpY_label"
                                       th:checked="*{dataUseTp == 'Y' or dataUseTp == null}">
                                <label class="form-label" for="dataUseTpY" id="dataUseTpY_label">파일업로드</label>
                            </li>
                            <li class="form-checkbox">
                                <input type="radio" name="dataUseTp" id="dataUseTpN" class="ui-check" value="M"
                                       data-label="비공개"
                                       aria-labelledby="dataUseTpN_label" th:checked="*{dataUseTp == 'N'}">
                                <label class="form-label" for="dataUseTpN" id="dataUseTpN_label">메타연계</label>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </th:block>
        <div class="col-12 pt-3 file-upload-data">
            <div class="row">
                <div class="col-lg-3">
                    <label class="col-form-label">데이터 파일 업로드</label>
                </div>
                <div class="col-lg-9">
                    <div class="form-group attach-file-group"
                         style="padding-top: 0; padding-bottom: 0; margin-bottom: 0;">
                        <div class="attach-file pt-0" style="display: flex;">
                            <input type="file" name="attachFilesCsv" class="file-upload-default" id="attachFilesCsv"
                                   style="display: none;">
                            <div class="input-group">
                                <input type="text" id="attachFilesCsv_input" disabled="disabled"
                                       class="form-control sm file-upload-title" style="margin-top: 0;"
                                       placeholder="파일을 선택해주세요">
                                <button type="button" class="form-right-action sm file-upload-browse"
                                        style="z-index: 999 !important;">파일선택
                                </button>
                            </div>
                            <button type="button" name="clearButton" id="clearButton" class="ui-button primary"
                                    style="margin-left: 8px;">초기화
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 pt-3 meta-data">
            <div class="row">
                <div class="col-lg-3">
                    <label class="col-form-label">디지털트윈 목록 조회</label>
                </div>
                <div class="col-lg-9 d-flex">
                    <input type="text" id="meta_model_name" class="form-control sm"
                           placeholder="검색어를 입력하세요">
                    <button type="button" style="margin-left: 8px;" class="ui-button primary btn-meta-search">조회
                    </button>
                </div>
            </div>
            <div class="row api-list" style="display: none;">
                <div class="col-12 pt-3" id="search_meta_api_list_table" style="display: none;">
                    <div class="col-form-label">트윈 목록</div>
                </div>
                <div class="col-12 pt-3" id="search_meta_api_list_table_obj" style="display: none;">
                    <div class="col-form-label">오브젝트 목록</div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</html>
