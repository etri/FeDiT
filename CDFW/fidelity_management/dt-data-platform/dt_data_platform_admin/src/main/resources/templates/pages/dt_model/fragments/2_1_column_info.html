<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<th:block th:fragment="column_info">
    <!-- Statistics 테이블-->
    <!-- Histogram 테이블-->
    <!-- chart-->
    <div class="form-group row" style="margin-bottom: -30px;">
        <div class="col-md-4">
            <div class="form-group">
                <div id="dataSetStatisticsRange" style="width: 100%;"></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="form-group">
                <div id="dataSetHistogramRange" style="width: 100%;"></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="form-group">
                <!-- <div id="dataSetChartRange" style="width: 100%;"></div> -->
                <div id="view3"
                     style="width:100%; height:400px; border-style:solid;border-width:1px;border-color:#eee;display: none;"></div>
            </div>
        </div>
    </div>

    <div class="row">
        <div id="dataSetInfoRange" style="width: 100%;"></div>
    </div>

    <!-- 정보 테이블-->
    <div class="row">
        <div id="dataSetColumnSelectRange" style="width: 100%; display: none;"></div>
    </div>

    <!-- 정보 테이블 버튼-->
    <div class="row">
        <div id="dataSetColumnSelectRangeBtn" style="width: 100%; display: none;"></div>
    </div>

    <!-- 업로드 테이블-->
    <div class="row">
        <div id="csvUpRange3" style="width: 100%;"></div>
    </div>

    <div id="next_button_column_info_range" style="display: none;">
        <div class="col-sm-12">
            <button type="button" id="column_info_next"
                    class="btn btn-primary mr-2 btn-icon-text next-preproc-validate-step float-right"
                    style="display: none;">
                다음(유효성)<i data-feather="arrow-right"></i>
            </button>
            <button type="button" id="column_info_prev"
                    class="btn btn-primary mr-2 btn-icon-text prev-input-info-step float-right">
                <i data-feather="arrow-left"></i>이전
            </button>
        </div>
    </div>
</th:block>
</html>
