<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/platform_layout}">

<head>
    <title th:text="${breadcrumb.menu_nm}">코드관리</title>
</head>

<div layout:fragment="content">
    <div class="page-title">
        <div class="contain">
            <h1 th:text="${breadcrumb.menu_nm}">코드 관리</h1>
        </div>
    </div>

    <section class="data-section">
        <div class="contain">
            <div class="row">
                <div class="col-6">
                    <div class="row">
                        <div class="col-12 pt-3">
                            <div style="display: flex; justify-content: space-between;">
                                <label class="col-form-label">그룹 코드</label>
                                <button type="button" class="ui-button primary sm btn-add-master">
                                    등록
                                </button>
                            </div>
                        </div>
                        <div class="col-12 pt-3">
                            <div class="table-box" style="max-height: 590px; height: 100%; overflow-y: auto;">
                                <table class="data-table">
                                    <colgroup>
                                        <col style="width: 30%;">
                                        <col>
                                        <col style="width: 35%;">
                                    </colgroup>
                                    <thead>
                                    <tr>
                                        <th>그룹 코드</th>
                                        <th>그룹 코드명</th>
                                        <th class="ta-r">기능</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="item : ${masterList}"
                                        th:class="${item.grp_cd} == ${grpCd} ? 'table-info' : ''"
                                        th:data-group-code="${item.grp_cd}">
                                        <td th:text="${item.grp_cd}">code</td>
                                        <td>
                                            <a th:href="@{/setting/code(grpCd=${item.grp_cd},menuCd=${params.menuCd})}"
                                               th:text="${item.grp_cd_nm}">grp_cd_nm</a>
                                        </td>
                                        <td class="ta-r">
                                            <button type="button"
                                                    class="ui-button primary sm btn-modify-master"
                                                    th:data-group-code="${item.grp_cd}">수정
                                            </button>
                                            <button type="button" class="ui-button danger sm btn-delete-master"
                                                    th:data-group-code="${item.grp_cd}">삭제
                                            </button>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="row">
                        <div class="col-12 pt-3">
                            <div style="display: flex; justify-content: space-between;">
                                <label class="col-form-label">상세 코드</label>
                                <button type="button" class="ui-button primary sm btn-add-detail">등록
                                </button>
                            </div>
                        </div>
                        <div class="col-12 pt-3">
                            <div class="table-box" style="max-height: 590px; height: 100%; overflow-y: auto;">
                                <table class="data-table">
                                    <colgroup>
                                        <col style="width: 5%;">
                                        <col>
                                        <col style="width: 15%;">
                                        <col style="width: 10%;">
                                        <col style="width: 20%;">
                                        <col>
                                    </colgroup>
                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>코드</th>
                                        <th>코드명</th>
                                        <th>사용여부</th>
                                        <th>등록일</th>
                                        <th class="ta-r">기능</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <th:block th:include="fragments/table_empty:: table_empty(6)"
                                              th:if="${#lists.isEmpty(detailList)}"></th:block>
                                    <tr th:each="item, row : ${detailList}"
                                        th:unless="${#lists.isEmpty(detailList)}">
                                        <td th:text="${row.index + 1}"></td>
                                        <td th:text="${item.dtl_cd}">code</td>
                                        <td th:text="${item.dtl_cd_nm}">dtl_cd_nm</td>
                                        <td th:text="${item.use_yn == 'Y'} ? '사용' : '미사용'">use_yn</td>
                                        <td th:text="${item.reg_dt}">reg_dt</td>
                                        <td class="ta-r">
                                            <button type="button"
                                                    class="ui-button primary sm btn-modify-detail"
                                                    th:data-group-code="${item.grp_cd}"
                                                    th:data-code="${item.dtl_cd}">수정
                                            </button>
                                            <button type="button"
                                                    class="ui-button danger sm btn-delete-detail"
                                                    th:data-group-code="${item.grp_cd}"
                                                    th:data-code="${item.dtl_cd}">삭제
                                            </button>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <th:block th:include="fragments/modal/admin-modal-group"></th:block>
        </div>
    </section>
</div>

<th:block layout:fragment="custom_css">
</th:block>
<th:block layout:fragment="custom_js">
    <script th:src="@{/assets/js/pages/setting/code_list.js}"></script>
</th:block>

</html>
