<!-- 그룹(master) 모달 제거: 검증 화면 미사용(저장 엔드포인트·대응 버튼 없음) -->
<!-- MODAL POPUP -->
<!-- 데이터 검증 항목 등록, 수정 모달 -->
<div class="modal-popup-wrap" id="modal-detail"> <!-- is-open -->
    <div class="modal-popup">
        <div class="modal-popup-header">
            <p class="title">데이터 검증 항목</p>
            <button type="button" class="btn-popup-close right" data-popup-id="modal-detail">
                <svg aria-label="닫기" role="img" viewBox="0 0 12 12" preserveAspectRatio="xMidYMid meet"
                     xmlns="http://www.w3.org/2000/svg" fill="none">
                    <g clip-path="url(#a)">
                        <path fill="#C7C7C7"
                              d="m7.409 6 4.295-4.287a1.003 1.003 0 0 0-1.418-1.42L6 4.59 1.714.294A1.003 1.003 0 1 0 .296 1.713L4.59 5.999.296 10.286a1 1 0 0 0 0 1.418 1 1 0 0 0 1.418 0L6 7.408l4.286 4.296a.998.998 0 0 0 1.418 0 1 1 0 0 0 0-1.418L7.41 5.999Z"/>
                    </g>
                    <defs>
                        <clipPath id="a">
                            <path fill="#fff" d="M0 0h12v12H0z"/>
                        </clipPath>
                    </defs>
                </svg>
            </button>
        </div>
        <div class="modal-popup-body">
            <input type="hidden" id="vrfc_seq">
            <input type="hidden" id="vrfc_tp">
            <!-- contents -->
            <div class="form-control-wrap">
                <label id="vrfc_nm_label" class="form-label" for="vrfc_nm">검증명 <span
                        class="badge required">필수</span></label>
                <input type="text" id="vrfc_nm" class="form-control sm" placeholder="검증명을 입력해주세요."
                       aria-labelledby="vrfc_nm_label" maxlength="50">
            </div>
            <div class="form-control-wrap">
                <label id="rule_value_1_label" class="form-label" for="rule_value_1">기준값 1<span
                        class="badge required">필수</span></label>
                <input type="text" id="rule_value_1" class="form-control sm" placeholder="기준값1을 입력해주세요."
                       aria-labelledby="rule_value_1_label" maxlength="50">
            </div>
            <div class="form-control-wrap">
                <label id="rule_value_2_label" class="form-label" for="rule_value_2">기준값 2</label>
                <input type="text" id="rule_value_2" class="form-control sm" placeholder="기준값2을 입력해주세요."
                       aria-labelledby="rule_value_2_label" maxlength="50">
            </div>
            <div class="form-control-wrap">
                <label id="rule_value_3_label" class="form-label" for="rule_value_3">기준값 3</label>
                <input type="text" id="rule_value_3" class="form-control sm" placeholder="기준값3을 입력해주세요."
                       aria-labelledby="rule_value_3_label" maxlength="50">
            </div>
            <div class="form-control-wrap">
                <label id="rule_value_4_label" class="form-label" for="rule_value_4">기준값 4</label>
                <input type="text" id="rule_value_4" class="form-control sm" placeholder="기준값4을 입력해주세요."
                       aria-labelledby="rule_value_4_label" maxlength="50">
            </div>
            <div class="form-control-wrap">
                <label id="ordby_label" class="form-label" for="ordby">정렬 순서 <span
                        class="badge required">필수</span></label>
                <input type="number" id="ordby" class="form-control sm" placeholder="정렬 순서를 입력해주세요. (0~999)"
                       aria-labelledby="ordby_label" min="0" max="999" required="required">
            </div>
            <div class="form-control-wrap">
                <span class="form-label">사용 여부 <span class="badge required">필수</span></span>
                <ul class="form-checkbox-list">
                    <li class="form-checkbox">
                        <input type="radio" name="whetherToUse" id="useY" class="ui-check" aria-labelledby="useY_label"
                               checked="checked">
                        <label class="form-label" for="useY" id="useY_label">사용</label>
                    </li>
                    <li class="form-checkbox">
                        <input type="radio" name="whetherToUse" id="useN" class="ui-check" aria-labelledby="useN_label">
                        <label class="form-label" for="useN" id="useN_label">미사용</label>
                    </li>
                </ul>
            </div>
            <!-- contents end -->
        </div>
        <div class="modal-popup-footer buttons">
            <button type="button" class="ui-button sm outline-primary btn-cancel btn-popup-close"
                    data-popup-id="modal-detail">취소
            </button>
            <button type="button" class="ui-button sm primary btn-popup-save btn-register-detail"
                    data-popup-id="modal-detail">저장
            </button>
        </div>
    </div>
    <div class="modal-popup-mask"></div>
</div>
<!-- MODAL POPUP end // -->
