<!DOCTYPE html>

<!-- Modal -->

<div class="modal" id="dataTwinModelListModal" tabindex="-1" aria-labelledby="dataTwinModelListModalLabel"

            <div class="modal-body">
                <div class="row">
                    <div class="col-sm-12">
                        <div id="search_simulation_list_table"></div>

        </div>
    </div>
