<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${breadcrumb.menu_nm}">게시판관리</title>
</head>
<div layout:fragment="content">
    <div id="loading" style="margin-left: 0px;display: none;">
        <img th:src="@{/assets/images/ajax-loading.gif}">
    </div>
    <nav th:replace="fragments/page_breadcrumb"></nav>
    <form name="editForm" id="editForm" th:action="@{|/dt/simulation/form|}" th:object="${dTAugment}" method="post">
        <input type="hidden" name="menuCd" id="menuCd" th:value="${menuCd}">
        <input type="hidden" name="formType" id="formType" th:value="${formType}">
        <input type="hidden" name="preprocProPerty" id="preprocProPerty">
        <!-- <textarea class="form-control preprocProPerty" rows="20"></textarea> -->

        <div class="row">
            <div class="col-md-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">

                        <div class="row">
                            <div class="col-sm-12">
                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label">시뮬레이션 명</label>
                                    <div class="col-sm-9">
                                        <input type="text" class="form-control" th:field="*{title}" required="required">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-sm-12">
                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label">시뮬레이션 설명</label>
                                    <div class="col-sm-9">
                                        <textarea class="form-control model_derpn" th:field="*{derpn}"
                                                  rows="12"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-sm-12">
                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label">시뮬레이션 유형</label>
                                    <div class="col-sm-9">
                                        <select class="select" th:field="*{simTp}" required="required">
                                            <option th:each="item : ${sim_type_list}" th:value="${item.dtl_cd}"
                                                    th:text="${item.dtl_cd_nm}"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-sm-12">
                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label">증강 유형</label>
                                    <div class="col-sm-9">
                                        <select class="select" th:field="*{augmentTp}" required="required">
                                            <option th:each="item : ${augment_type_list}" th:value="${item.dtl_cd}"
                                                    th:text="${item.dtl_cd_nm}"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-sm-12">
                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label">모델 선택</label>
                                    <div class="col-sm-10">
                                        <div class="form-group row">
                                            <div class="col-sm-7">
                                                <input type="text" id="simulation_model_nm" class="form-control"
                                                       placeholder="검색어를 입력하세요">
                                                <input type="hidden" id="set_model_name">
                                            </div>
                                            <div class="col-sm-3">
                                                <button type="button"
                                                        class="btn btn-primary mr-2 btn-icon-text btn-search-model-list">
                                                    <i class="btn-icon-prepend" data-feather="search"></i>조회
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div id="onetime_tp_range" style="display: none;">
                            <div class="form-group row" style="padding-bottom: 1px;">
                                <div class="col-sm-2">
                                    <label class="col-form-label">추론기간지정</label>
                                </div>
                                <div class="col-sm-3">
                                    <select id="data_crt_intvl_tp" name="dataCrtIntvlTp" class="select form-control">
                                        <option value="">자료 생성 간격 범위</option>
                                        <option value="S">초</option>
                                        <option value="T">분</option>
                                        <option value="H">시간</option>
                                        <option value="D">일</option>
                                    </select>
                                </div>
                                <div class="col-sm-2">
                                    <th:block th:if="${formType == 'I'}">
                                        <input type="number" class="form-control number_only" name="dataCrtIntvlValue"
                                               id="data_crt_intvl_value" th:value="1" min="1" max="50"/>
                                    </th:block>
                                </div>
                                <div class="col-sm-2">
                                    <th:block th:if="${formType == 'I'}">
                                        <button type="button" class="btn btn-success mr-2 btn-icon-text reset-cal-term">
                                            갱신
                                        </button>
                                    </th:block>
                                </div>
                            </div>

                            <div class="form-group row" style="padding-top: 1px;">
                                <div class="col-sm-2">
                                    <label class="col-form-label"></label>
                                </div>
                                <div class="col-sm-3">
                                    시작 : <input type="text" class="form-control" name="cycleBgngDsgnYmd"
                                                id="target_start_date" th:value="${dTAugment.cycleBgngDsgnYmd}"
                                                readonly="readonly"/>
                                </div>
                                <div class="col-sm-3">
                                    마지막 : <input type="text" class="form-control" name="cycleEndDsgnYmd"
                                                 id="target_last_date" th:value="${dTAugment.cycleEndDsgnYmd}"
                                                 readonly="readonly"/>
                                </div>
                            </div>
                        </div>
                        <div id="cycle_tp_range" style="display: none;">
                            <div class="row">
                                <div class="col-sm-12">
                                    <div class="form-group row">
                                        <label class="col-sm-2 col-form-label">주기 유형</label>
                                        <div class="col-sm-9">
                                            <div class="form-check form-check-inline">
                                                <label class="form-check-label">
                                                    <input type="radio" class="form-check-input" name="cycleTp"
                                                           value="H" data-label="미사용"
                                                           th:checked="*{cycleTp == 'H'  or cycleTp == null}">시간
                                                    <i class="input-frame"></i>
                                                </label>
                                            </div>
                                            <div class="form-check form-check-inline">
                                                <label class="form-check-label">
                                                    <input type="radio" class="form-check-input" name="cycleTp"
                                                           value="D" data-label="사용" th:checked="*{cycleTp == 'D'}">일
                                                    <i class="input-frame"></i>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div id="processRange" class="row">
                                <div class="col-sm-12">
                                    <div class="form-group row">
                                        <label class="col-sm-2 col-form-label" style="text-wrap:wrap;">진행기간<br/><span
                                                style="font-size: 12px; color: red;">&nbsp;(시작일미등록시 현재날짜 기준)</span></label>
                                        <div class="col-sm-10">
                                            <div class="form-group row" style="padding-left:12px;">
                                                <div class="col-sm-4 input-group date datepicker" style="float: left;">
                                                    <input type="text" class="form-control"
                                                           th:field="*{cycleBgngDsgnYmd}" readonly="readonly">
                                                    <span class="input-group-addon">
			                                               <i data-feather="calendar"></i>
			                                           </span>
                                                </div>
                                                <div class="m-2" style="float: left;">~</div>
                                                <div class="col-sm-4 input-group date datepicker" style="float: left;">
                                                    <input type="text" class="form-control"
                                                           th:field="*{cycleEndDsgnYmd}" readonly="readonly">
                                                    <span class="input-group-addon">
			                                               <i data-feather="calendar"></i>
			                                           </span>
                                                </div>
                                                <div class="col-sm-2">
                                                    <button type="button" data-action="clear"
                                                            class="btn btn-primary btn-icon-text">
                                                        초기화
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div id="dataRange" class="row">
                                <div class="col-sm-12">
                                    <div class="form-group row">
                                        <label class="col-sm-2 col-form-label" style="text-wrap:wrap;">데이터 시작 날짜
                                            시간<br/><span
                                                    style="font-size: 12px; color: red;">&nbsp;(미등록시 현재날짜 기준)</span></label>
                                        <div class="col-sm-10">
                                            <div class="form-group row" style="padding-left:12px;">
                                                <div class="col-sm-4 input-group date datepicker" style="float: left;">
                                                    <input type="text" class="form-control"
                                                           th:field="*{dataCrtLastHr}" readonly="readonly">
                                                    <span class="input-group-addon">
			                                               <i data-feather="calendar"></i>
			                                           </span>
                                                </div>
                                                <div class="col-sm-2">
                                                    <button type="button" data-action="clear"
                                                            class="btn btn-primary btn-icon-text">
                                                        초기화
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div id="preprocessNeedRange" class="row">
                                <div class="col-sm-12">
                                    <div class="form-group row">
                                        <label class="col-sm-2 col-form-label" style="text-wrap: wrap;">전처리에 필요한 데이터 개수
                                            지정</label>
                                        <div class="col-sm-6">
                                            <input type="number" name="dataMaxLimitCnt" id="dataMaxLimitCnt"
                                                   class="form-control number_only" th:placeholder="${limit}"
                                                   th:value="200" th:data-max="${limit}">
                                            <span class="d-block"
                                                  style="margin-top: 10px; color: blue; font-size: 13px;">전처리에서 필요한 최소 데이터의 개수를 의미합니다. 데이터의 양이 너무 적을 시 이전 데이터를 활용합니다.</span>
                                            <span class="d-block" style="color: blue; font-size: 13px;">데이터가 부족할 시 증강을 사용할 수 없습니다.</span>
                                            <span class="d-block" style="color: red; font-size: 13px;"
                                                  th:text="'전처리에 필요한 데이터의 최대 개수는 ' + ${limit} + '개입니다.'">전처리에 필요한 데이터의 최대 개수는 0개입니다.</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div id="AugmentNeedRange" class="row">
                                <div class="col-sm-12">
                                    <div class="form-group row">
                                        <label class="col-sm-2 col-form-label" style="text-wrap: wrap;">증강에 필요한 데이터 최소 개수 (Window Size)</label>
                                        <div class="col-sm-6">
                                            <input type="number" name="windowSize" id="windowSize"
                                                   readonly="readonly" class="form-control number_only" placeholder="증강에 필요한 데이터 최소 개수"
                                                   value="0">
                                            <span class="d-block"
                                                  style="margin-top: 10px; color: blue; font-size: 13px;">증강에 필요한 데이터 최소 개수입니다.</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-12">
                                <div class="form-group row" id="file_upload_range" style="display: none;">
                                    <div class="col-sm-2">
                                        <label class="col-form-label">파일 업로드</label><br>
                                    </div>
                                    <div class="col-sm-9">
                                        <div class="attach-file-group">
                                            <div class="pt-2 attach-file">
                                                <input type="file" name="attachFiles" class="file-upload-default"
                                                       id="attach_files">
                                                <div class="input-group">
                                                    <input type="text" class="form-control file-upload-title"
                                                           disabled="disabled" placeholder="" id="attach_files_input">
                                                    <span class="input-group-append">
                                                        <button type="button"
                                                                class="file-upload-browse btn btn-primary">파일선택</button>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-sm-12">
                                        <div class="form-group row">
                                            <label class="col-sm-2 col-form-label">사용여부</label>
                                            <div class="col-sm-9">
                                                <div class="form-check form-check-inline">
                                                    <label class="form-check-label">
                                                        <input type="radio" class="form-check-input" name="useYn"
                                                               value="Y" data-label="사용"
                                                               th:checked="*{useYn == 'Y'  or useYn == null}">사용
                                                        <i class="input-frame"></i>
                                                    </label>
                                                </div>
                                                <div class="form-check form-check-inline">
                                                    <label class="form-check-label">
                                                        <input type="radio" class="form-check-input" name="useYn"
                                                               value="N" data-label="미사용" th:checked="*{useYn == 'N'}">미사용
                                                        <i class="input-frame"></i>
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>


                                <div class="row" id="row_limit_yn" style="display: none;">
                                    <div class="col-sm-12">
                                        <div class="form-group row">
                                            <label class="col-sm-2 col-form-label">진행 여부</label>
                                            <div class="col-sm-9">
                                                <div class="form-check form-check-inline">
                                                    <label class="form-check-label">
                                                        <input type="radio" class="form-check-input"
                                                               name="augmentStatus" value="T" data-label="진행"
                                                               th:checked="*{augmentStatus == 'T'  or useYn == null}">진행
                                                        <i class="input-frame"></i>
                                                    </label>
                                                </div>
                                                <div class="form-check form-check-inline">
                                                    <label class="form-check-label">
                                                        <input type="radio" class="form-check-input"
                                                               name="augmentStatus" value="S" data-label="일시중지"
                                                               th:checked="*{augmentStatus == 'S'}">일시중지
                                                        <i class="input-frame"></i>
                                                    </label>
                                                </div>
                                                <span style="margin-top: 10px;color: red;font-size: 13px;">주기성에 적용되며 미사용시 더 이상 처리 하지 않습니다.</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-sm-12">
                                        <div class="form-group row">
                                            <label class="col-sm-2 col-form-label">모델 설정 정보<br/>(전처리/증강)</label>
                                            <div class="col-sm-8" id="go_model_btn_range" style="display: none;">
                                                <a class="btn btn-primary btn-icon-text" id="go_model_page"
                                                   target="_blank">모델 상세 정보 보러가기</a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-12">
                <a class="btn btn-primary btn-icon-text" th:href=@{|${prevUrl}?${pageParams}|}>목록</a>
                <button type="button" class="btn btn-primary btn-icon-text save-simulation" style="display: none;">등록
                </button>
                <button type="button" class="btn btn-primary btn-icon-text save-onetime" style="display: none;">등록
                </button>
                <button type="button" class="btn btn-primary btn-icon-text save-predict" style="display: none;">등록
                </button>
            </div>
        </div>
    </form>
    <th:block th:include="fragments/modal/dtm_list_modal"></th:block>
</div>
<th:block layout:fragment="custom_css">
    <link rel="stylesheet" th:href="@{/assets/css/codemirror.css}"/>
    <link rel="stylesheet" th:href="@{/assets/vendors/datatables.net-bs4/dataTables.bootstrap4.css}">
    <link rel="stylesheet" th:href="@{/assets/css/custom.css}">
</th:block>
<th:block layout:fragment="custom_js">
    <script th:src="@{/echarts532/dist/echarts.min.js}"></script>
    <script th:src="@{/assets/js/echart/echarts.js}"></script>
    <script th:src="@{/assets/js/echart/echarts_view.js}"></script>
    <script th:src="@{/assets/vendors/datatables.net/jquery.dataTables.js}"></script>
    <script th:src="@{/assets/vendors/datatables.net-bs4/dataTables.bootstrap4.js}"></script>

    <script th:src="@{/assets/js/file-upload.js}"></script>
    <script th:src="@{/assets/js/pages/dt_simulation/common/progress.js}"></script>
    <script th:src="@{/assets/js/pages/dt_simulation/form.js}"></script>
    <script th:src="@{/assets/js/pages/dt_simulation/dtm_list.js}"></script>
</th:block>
</html>
