<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<th:block th:fragment="tab_validate">
    <!-- 데이터 전처리 Validate Tab Contents-->
    <div id="tab_validate_range" class="col-12 pt-3">
        <div class="row">
            <div class="col-6">
                <div id="valid_table_range"></div>
                <div id="tab_missing_table_range_valid"></div>
            </div>
            <div class="col-6">
                <div class="row">
                    <div class="col-12">
                        <label class="col-form-label">컬럼 선택</label>
                    </div>
                    <div class="col-12">
                        <div id="preProcValidTargetCol"></div>
                    </div>
                </div>

                <div class="row" id="validate_option">
                    <div class="col-12 pt-3">
                        <label class="col-form-label">변환 유형</label>
                    </div>
                    <div class="col-12">
                        <div class="select-with-text">
                            <div class="dropdown-wrapper">
                                <div class="dropdown-box">
                                    <button type="button" class="form-control sm dropdown-toggle valid-select-box"
                                            id="select_valid_mater_tp" data-value="0">검증 안함
                                    </button>
                                    <div class="dropdown-layer" id="select_valid_mater_tp_selection"
                                         aria-expanded="false">
                                        <ul class="option-list">
                                            <li>
                                                <input type="radio"
                                                       id="input_select_valid_mater_tp_0"
                                                       name="select_valid_mater_tp_input"
                                                       value="0">
                                                <label for="input_select_valid_mater_tp_0">검증 안함</label>
                                            </li>
                                            <li th:each="item : ${valid_mater_list}">
                                                <!--input_${dropdownButton.id}_${header}-->
                                                <input type="radio"
                                                       th:id="${'input_select_valid_mater_tp'+'_'+item.dtl_cd}"
                                                       name="select_valid_mater_tp_input"
                                                       th:value="${item.dtl_cd}">
                                                <label th:for="${'input_select_valid_mater_tp'+'_'+item.dtl_cd}"
                                                       th:text="${item.dtl_cd_nm}">선택</label>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                            <div class="form-message-wrap" id="select_valid_mater_tp_description">
                                <span class="form-message ico">1단계 : 검증 방법을 선택합니다.검증안함 선택시 바로 다음단계로 이동합니다.</span>
                            </div>
                        </div>
                        <div class="select-with-text pt-3">
                            <div class="dropdown-wrapper">
                                <div class="dropdown-box">
                                    <button type="button" class="form-control sm dropdown-toggle valid-select-box"
                                            id="select_valid_detail_tp" data-value="0">선택 안함
                                    </button>
                                    <div class="dropdown-layer" id="select_valid_detail_tp_selection"
                                         aria-expanded="false">
                                        <ul class="option-list">
                                            <li>
                                                <input type="radio"
                                                       id="input_select_valid_detail_tp_0"
                                                       name="select_valid_detail_tp_input"
                                                       value="0">
                                                <label for="input_select_valid_detail_tp_0">선택 안함</label>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                            <div class="form-message-wrap" id="select_valid_detail_tp_description">
                                <span class="form-message ico">2단계 : 검증에 사용할 형식을 지정합니다.</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 pt-3" id="select_valid_range_type" style="display: none;">
                        <div class="row">
                            <div class="col range-element-container">
                                <div class="row">
                                    <div class="col-auto">
                                        <label for="valid-range-min"
                                               class="col-form-label text-nowrap" style="font-size: 13px;">최소값</label>
                                    </div>
                                    <div class="col">
                                        <input type="text" id="valid-range-min"
                                               class="form-control sm range-input number_only"
                                               placeholder="최소값을 입력해주세요."
                                               name="min" value="0">
                                    </div>
                                </div>
                            </div>
                            <div class="col range-element-container">
                                <div class="row">
                                    <div class="col-auto">
                                        <label for="valid-range-max"
                                               class="col-form-label text-nowrap" style="font-size: 13px;">최대값</label>
                                    </div>
                                    <div class="col">
                                        <input type="text" id="valid-range-max"
                                               class="form-control sm range-input number_only"
                                               placeholder="최대값을 입력해주세요."
                                               name="max" value="10">
                                    </div>
                                </div>
                            </div>
                            <div class="col range-element-container">
                                <div class="row">
                                    <div class="col-auto">
                                        <label for="float-valid-range-min"
                                               class="col-form-label text-nowrap" style="font-size: 13px;">최소값</label>
                                    </div>
                                    <div class="col">
                                        <input type="text" id="float-valid-range-min"
                                               class="form-control sm range-input double_only"
                                               placeholder="최소값을 입력해주세요."
                                               name="min" value="0">
                                    </div>
                                </div>
                            </div>
                            <div class="col range-element-container">
                                <div class="row">
                                    <div class="col-auto">
                                        <label for="float-valid-range-max"
                                               class="col-form-label text-nowrap" style="font-size: 13px;">최대값</label>
                                    </div>
                                    <div class="col">
                                        <input type="text" id="float-valid-range-max"
                                               class="form-control sm range-input double_only"
                                               placeholder="최대값을 입력해주세요."
                                               name="max" value="10">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-12">
                                <div class="form-message-wrap">
                                    <span class="form-message ico">2-1단계 : 최소값 및 최대값을 입력합니다.</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 pt-3" id="select_valid_clear_tp" style="display: none;">
                        <div class="dropdown-wrapper">
                            <div class="dropdown-box">
                                <button type="button" class="form-control sm dropdown-toggle valid-select-box"
                                        id="select_valid_clear_tp_dropdown" data-value="0">선택 안함
                                </button>
                                <div class="dropdown-layer" id="select_valid_clear_tp_dropdown_selection"
                                     aria-expanded="false">
                                    <ul class="option-list">
                                        <li>
                                            <input type="radio"
                                                   id="input_select_valid_clear_tp_dropdown_0"
                                                   name="select_valid_clear_tp_dropdown_input"
                                                   value="0">
                                            <label for="input_select_valid_clear_tp_dropdown_0">선택</label>
                                        </li>
                                        <li>
                                            <input type="radio"
                                                   id="input_select_valid_clear_tp_dropdown_I"
                                                   name="select_valid_clear_tp_dropdown_input"
                                                   value="I">
                                            <label for="input_select_valid_clear_tp_dropdown_I">지정값</label>
                                        </li>
                                        <li>
                                            <input type="radio"
                                                   id="input_select_valid_clear_tp_dropdown_O"
                                                   name="select_valid_clear_tp_dropdown_input"
                                                   value="O">
                                            <label for="input_select_valid_clear_tp_dropdown_O">지정외값</label>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                        <div class="form-message-wrap" id="select_valid_clear_tp_description">
                            <span class="form-message ico">3단계 : [지정값] - 2단계 형식과 일치하는 값을 삭제(빈값) <br/> [지정외값] - 2단계 형식과 일치하지 않는 값을 삭제(빈값)</span>
                        </div>
                    </div>
                    <div class="col-12 pt-3">
                        <input class="ui-button primary sm btn-view-valid-info" type="button" value="상태확인">
                        <input class="ui-button primary sm btn-make-valid" id="btn_make_valid" type="button" value="변환"
                               style="display: none;">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 업로드 테이블-->
    <th:block th:if="${formType == 'I'}">
        <div class="col-12">
            <div id="preprocTableExcludeRangeValidate" class="pt-3" style="display: none;"></div>
            <div id="preprocTableRangeValidate" class="pt-3" style="display: none;"></div>
        </div>
    </th:block>
    <div id="next_button_valiate_range" class="col-12 pt-3" style="display: none; text-align: end;">
        <button type="button" class="ui-button primary sm prev-column-info-step">
            이전
        </button>
        <button type="button" class="ui-button primary sm next-preproc-outlier-step">
            다음(Outlier)
        </button>
    </div>
</th:block>
</html>
