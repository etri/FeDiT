<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/layout}">

<head>
    <title th:text="${breadcrumb.menu_nm}">게시판관리</title>
    <!--임시css-->
    <!-- <link rel="stylesheet" href="../../../assets/css/temp.css"> -->

    <style>
        .table-responsive-meta {
            max-height: 400px;
            /* overflow-y: auto; */
        }

        /* 테이블의 넓이를 100%로 설정 */
        #historyLogTable {
            width: 100% !important;
        }

        /* 각 컬럼의 넓이 설정 */
        #historyLogTable th, #historyLogTable td {
            text-align: left;
        }

        #historyLogTable colgroup col:nth-child(1) {
            width: 20% !important; /* 첫 번째 컬럼 */
        }

        #historyLogTable colgroup col:nth-child(2) {
            width: 5% !important; /* 두 번째 컬럼 */
        }

        #historyLogTable colgroup col:nth-child(3) {
            width: 10% !important; /* 세 번째 컬럼 */
        }

        #historyLogTable colgroup col:nth-child(4) {
            width: 25% !important; /* 네 번째 컬럼 */
        }

        #historyLogTable colgroup col:nth-child(5) {
            width: 25% !important; /* 다섯 번째 컬럼 */
        }

        #historyLogTable colgroup col:nth-child(6) {
            width: 10% !important; /* 여섯 번째 컬럼 */
        }

    </style>

    <script th:inline="javascript">
        var contextPath = /*[[${#httpServletRequest.getContextPath()}]]*/ '';
    </script>

</head>
<div layout:fragment="content">
    <div id="loading" style="margin-left: 0px;display: none;">
        <img th:src="@{/assets/images/ajax-loading.gif}">
    </div>
    <nav th:replace="fragments/page_breadcrumb"></nav>
    <form name="editForm" id="editForm" th:action="@{|/dt/simulation/form|}" th:object="${dTAugment}" method="post">
        <input type="hidden" name="menuCd" id="menuCd" th:value="${menuCd}">
        <input type="hidden" name="formType" id="formType" th:value="${formType}">
        <input type="hidden" name="augmentSeq" id="augmentSeq" th:value="${dTAugment.augmentSeq}">
        <input type="hidden" name="preprocProPerty" id="preprocProPerty">

        <div class="row">
            <div class="col-md-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">

                        <div class="row">
                            <div class="col-sm-12">
                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label">시뮬레이션 명</label>
                                    <div class="col-sm-9">
                                        <input type="text" class="form-control" th:field="*{title}" required="required">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-sm-12">
                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label">시뮬레이션 설명</label>
                                    <div class="col-sm-9">
                                        <textarea class="form-control model_derpn" th:field="*{derpn}"
                                                  rows="12"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-sm-12">
                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label">시뮬레이션 유형</label>
                                    <div class="col-sm-9">
                                        <select class="select" th:field="*{simTp}" required="required" disabled>
                                            <option th:each="item : ${sim_type_list}" th:value="${item.dtl_cd}"
                                                    th:text="${item.dtl_cd_nm}"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-12">
                                <div class="form-group row">
                                    <label class="col-sm-2 col-form-label">증강 유형</label>
                                    <div class="col-sm-9">
                                        <select class="select" th:field="*{augmentTp}" required="required" disabled>
                                            <option th:each="item : ${augment_type_list}" th:value="${item.dtl_cd}"
                                                    th:text="${item.dtl_cd_nm}"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <th:block th:if="${dTAugment.simTp == 'A' or dTAugment.augmentTp == 'R' }">
                            <div class="row">
                                <div class="col-sm-12">
                                    <div class="form-group row">
                                        <label class="col-sm-2 col-form-label">
                                            <th:block th:if="${dTAugment.simTp == 'A' and dTAugment.augmentTp == 'O' }">
                                                추론기간
                                            </th:block>
                                            <th:block
                                                    th:unless="${dTAugment.simTp == 'A' and dTAugment.augmentTp == 'O' }">
                                                진행기간
                                            </th:block>
                                        </label>
                                        <div class="col-sm-10">
                                            <div class="form-group row">
                                                <div class="col-sm-4 input-group" style="float: left;">
                                                    <input type="text" class="form-control"
                                                           th:field="*{cycleBgngDsgnYmd}" readonly="readonly">
                                                </div>
                                                <div class="m-2" style="float: left;">~</div>
                                                <div class="col-sm-4 input-group" style="float: left;">
                                                    <input type="text" class="form-control"
                                                           th:field="*{cycleEndDsgnYmd}" readonly="readonly">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </th:block>

                        <!--시뮬레이션 유형이 전처리 또는 증강-->
                        <!--증강 유형이 주기성-->
                        <th:block
                                th:if="${(dTAugment.simTp=='A' or dTAugment.simTp=='P') and (dTAugment.augmentTp == 'R')}">
                            <div class="row">
                                <div class="col-sm-12">
                                    <div class="form-group row">
                                        <label class="col-sm-2 col-form-label">
                                            데이터 시작 날짜
                                        </label>
                                        <div class="col-sm-10">
                                            <div class="form-group row">
                                                <div class="col-sm-4 input-group" style="float: left;">
                                                    <th:block
                                                            th:if="${dTAugment.dataCrtBgngHr != null and dTAugment.dataCrtBgngHr !='undefined'}">
                                                        <!--기존의 데이터에서 시작 날짜가 있으면-->
                                                        <input type="text" class="form-control"
                                                               th:field="*{dataCrtBgngHr}" readonly="readonly"
                                                               th:value="${dTAugment.dataCrtBgngHr}">
                                                    </th:block>
                                                    <th:block
                                                            th:unless="${dTAugment.dataCrtBgngHr != null and dTAugment.dataCrtBgngHr !='undefined'}">
                                                        <!--기존의 데이터에서 시작 날짜가 없으면-->
                                                        <input type="text" class="form-control"
                                                               id="dataCrtBgngHr" name="dataCrtBgngHr"
                                                               readonly="readonly"
                                                               th:value="${dTAugment.cycleBgngDsgnYmd}">
                                                    </th:block>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </th:block>
                        <th:block th:if="${dTAugment.augmentTp == 'R'}">
                            <div class="row">
                                <div class="col-sm-12">
                                    <div class="form-group row">
                                        <label class="col-sm-2 col-form-label">주기 유형</label>
                                        <div class="col-sm-9">
                                            <div class="form-check form-check-inline">
                                                <label class="form-check-label">
                                                    <input type="radio" disabled="disabled" class="form-check-input"
                                                           name="cycleTp"
                                                           value="H" data-label="미사용"
                                                           th:checked="*{cycleTp == 'H'  or cycleTp == null}">시간
                                                    <i class="input-frame"></i>
                                                </label>
                                            </div>
                                            <div class="form-check form-check-inline">
                                                <label class="form-check-label">
                                                    <input type="radio" disabled="disabled" class="form-check-input"
                                                           name="cycleTp"
                                                           value="D" data-label="사용" th:checked="*{cycleTp == 'D'}">일
                                                    <i class="input-frame"></i>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-12">
                                    <div class="form-group row">
                                        <label class="col-sm-2 col-form-label">모델 선택</label>
                                        <div class="col-sm-10">
                                            <div class="form-group row">
                                                <div class="col-sm-7">
                                                    <input type="text" th:field="*{modelNm}" class="form-control"
                                                           readonly="readonly">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <th:block th:if="${dTAugment.simTp == 'A'}">
                                <div class="row">
                                    <div class="col-sm-12">
                                        <div class="form-group row">
                                            <label class="col-sm-2 col-form-label" style="text-wrap: wrap;">증강에 필요한 데이터
                                                최소 개수 (Window Size)</label>
                                            <div class="col-sm-6">
                                                <input type="number" name="windowSize" id="windowSize"
                                                       readonly="readonly" class="form-control number_only"
                                                       placeholder="증강에 필요한 데이터 최소 개수"
                                                       th:value="${windowSize}">
                                                <span class="d-block"
                                                      style="margin-top: 10px; color: blue; font-size: 13px;">증강에 필요한 데이터 최소 개수입니다.</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </th:block>
                            <th:block th:if="${dTAugment.simTp == 'P'}">
                                <div class="row">
                                    <div class="col-sm-12">
                                        <div class="form-group row">
                                            <label class="col-sm-2 col-form-label">전처리에 필요한 데이터 개수</label>
                                            <div class="col-sm-6">
                                                <input type="number" name="dataMaxLimitCnt" id="dataMaxLimitCnt"
                                                       class="form-control number_only" readonly="readonly"
                                                       th:placeholder="${limit}"
                                                       th:value="${dTAugment.dataMaxLimitCnt}" th:data-max="${limit}">
                                                <span class="d-block"
                                                      style="margin-top: 10px; color: blue; font-size: 13px;">전처리에서 필요한 최소 데이터의 개수를 의미합니다. 데이터의 양이 너무 적을 시 이전 데이터를 활용합니다.</span>
                                                <span class="d-block" style="color: blue; font-size: 13px;">데이터가 부족할 시 증강을 사용할 수 없습니다.</span>
                                                <span class="d-block" style="color: red; font-size: 13px;"
                                                      th:text="'전처리에 필요한 데이터의 최대 개수는 ' + ${limit} + '개입니다.'">전처리에 필요한 데이터의 최대 개수는 0개입니다.</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </th:block>
                        </th:block>
                        <div class="row">
                            <div class="col-sm-12">
                                <div class="form-group row" id="file_upload_range" style="display: none;">
                                    <div class="col-sm-2">
                                        <label class="col-form-label">파일 업로드</label><br>
                                    </div>
                                    <div class="col-sm-9">
                                        <div class="attach-file-group">
                                            <div class="pt-2 attach-file">
                                                <input type="file" name="attachFiles" class="file-upload-default"
                                                       id="attach_files">
                                                <div class="input-group">
                                                    <input type="text" class="form-control file-upload-title"
                                                           disabled="disabled" placeholder="" id="attach_files_input">
                                                    <span class="input-group-append">
                                                        <button type="button"
                                                                class="file-upload-browse btn btn-primary">파일선택</button>
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-sm-12">
                                        <div class="form-group row">
                                            <label class="col-sm-2 col-form-label">사용여부</label>
                                            <div class="col-sm-9">
                                                <div class="form-check form-check-inline">
                                                    <label class="form-check-label">
                                                        <input type="radio" class="form-check-input" name="useYn"
                                                               value="N" data-label="미사용"
                                                               th:checked="*{useYn == 'N'  or useYn == null}">미사용
                                                        <i class="input-frame"></i>
                                                    </label>
                                                </div>
                                                <div class="form-check form-check-inline">
                                                    <label class="form-check-label">
                                                        <input type="radio" class="form-check-input" name="useYn"
                                                               value="Y" data-label="사용" th:checked="*{useYn == 'Y'}">사용
                                                        <i class="input-frame"></i>
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row" id="row_rls_yn">
                                    <div class="col-sm-12">
                                        <div class="form-group row">
                                            <label class="col-sm-2 col-form-label">공개 여부</label>
                                            <div class="col-sm-9">
                                                <div class="form-check form-check-inline">
                                                    <label class="form-check-label">
                                                        <input type="radio" class="form-check-input"
                                                               name="rlsYn" th:checked="*{rlsYn == 'Y'}" value="Y" data-label="공개">공개
                                                        <i class="input-frame"></i>
                                                    </label>
                                                </div>
                                                <div class="form-check form-check-inline">
                                                    <label class="form-check-label">
                                                        <input type="radio" class="form-check-input"
                                                               name="rlsYn" th:checked="*{rlsYn == 'N' or useYn==null}" value="N" data-label="비공개">비공개
                                                        <i class="input-frame"></i>
                                                    </label>
                                                </div>
                                                <span style="margin-top: 10px;color: red;font-size: 13px;">(공개로 설정한 경우 시뮬레이션이 완료된 데이터만 공개됩니다.)</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <th:block th:if="${dTAugment.augmentTp == 'R'}">
                                    <div class="row">
                                        <div class="col-sm-12">
                                            <div class="form-group row">
                                                <label class="col-sm-2 col-form-label">진행 여부</label>
                                                <div class="col-sm-9">
                                                    <div class="form-check form-check-inline">
                                                        <label class="form-check-label">
                                                            <input type="radio" class="form-check-input"
                                                                   name="augmentStatus" value="T" data-label="진행"
                                                                   th:checked="*{augmentStatus == 'T'  or useYn == null}">진행
                                                            <i class="input-frame"></i>
                                                        </label>
                                                    </div>
                                                    <div class="form-check form-check-inline">
                                                        <label class="form-check-label">
                                                            <input type="radio" class="form-check-input"
                                                                   name="augmentStatus" value="S" data-label="일시중지"
                                                                   th:checked="*{augmentStatus == 'S'}">일시중지
                                                            <i class="input-frame"></i>
                                                        </label>
                                                    </div>
                                                    <div class="form-check form-check-inline">
                                                        <label class="form-check-label">
                                                            <input type="radio" class="form-check-input"
                                                                   name="augmentStatus" value="C" data-label="완료"
                                                                   th:checked="*{augmentStatus == 'C'}">완료
                                                            <i class="input-frame"></i>
                                                        </label>
                                                    </div>
                                                    <span style="margin-top: 10px;color: red;font-size: 13px;">주기성에 적용되며 미사용시 더 이상 처리 하지 않습니다.</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </th:block>
                                <div class="row">
                                    <div class="col-sm-12">
                                        <div class="form-group row">
                                            <label class="col-sm-2 col-form-label">모델 설정 정보<br/>(전처리/증강)</label>
                                            <div class="col-sm-8" id="go_model_btn_range">
                                                <a th:href="@{|${modelUrl}}"
                                                   class="btn btn-primary btn-icon-text" target="_blank">모델 상세 정보
                                                    보러가기</a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-sm-12">
                                        <div class="form-group row">
                                            <div class="col-sm-2">
                                                <label class="col-form-label">파일</label><br>
                                            </div>
                                            <div class="col-sm-2">
                                                <th:block th:if="${not #lists.isEmpty(file_list)}"
                                                          th:each="item : ${file_list}">
                                                    <div class="pt-2 attach-file">
                                                        <div class="input-group">
                                                            <a th:href="@{|/file/download/dt/meta/augment/${item.file_seq}|}"
                                                               class="file-download mt-1 mr-2"
                                                               th:text="${item.file_nm}">파일명</a>
                                                        </div>
                                                    </div>
                                                </th:block>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-12 col-xl-12 grid-margin stretch-card">
                                        <div class="card">
                                            <div class="card-body">
                                                <p class="card-description">히스토리</p>
                                                <div class="table-responsive">
                                                    <table class="table table-hover" id="historyLogTable">
                                                        <colgroup>
                                                            <col style="width: 20%;">
                                                            <col style="width: 20%;">
                                                            <col style="width: 20%;">
                                                            <col style="width: 20%;">
                                                            <col style="width: 20%;">
                                                        </colgroup>
                                                        <thead>
                                                        <tr>
                                                            <th>파일명</th>
                                                            <th>상태</th>
                                                            <th>에러코드</th>
                                                            <th>에러명</th>
                                                            <th>에러상세</th>
                                                            <th>등록일</th>
                                                        </tr>
                                                        </thead>
                                                        <tbody>
                                                        <tr th:each="item : ${log_list}"
                                                            th:unless="${#lists.isEmpty(log_list)}">
                                                            <th:block th:if="${item.file_nm != null}">
                                                                <th:block
                                                                        th:if="${#strings.length(#strings.trim(item.file_nm)) > 20}">
                                                                    <td th:text="|${#strings.substring(item.file_nm, 0, 20)}...|"
                                                                        th:title="${item.file_nm}"></td>
                                                                </th:block>
                                                                <th:block
                                                                        th:unless="${#strings.length(#strings.trim(item.file_nm)) > 20}">
                                                                    <td th:text="${item.file_nm}"></td>
                                                                </th:block>
                                                            </th:block>
                                                            <th:block th:unless="${item.file_nm != null}">
                                                                <td></td> <!-- file_nm이 null일 때 빈 셀로 표시 -->
                                                            </th:block>

                                                            <td th:text="${item.augment_status_nm}"></td>
                                                            <td th:text="${item.err_cd}"></td>

                                                            <th:block th:if="${item.err_nm != null}">
                                                                <th:block
                                                                        th:if="${#strings.length(#strings.trim(item.err_nm)) > 30}">
                                                                    <td th:text="|${#strings.substring(item.err_nm, 0, 30)}...|"
                                                                        th:title="${item.err_nm}"></td>
                                                                </th:block>
                                                                <th:block
                                                                        th:unless="${#strings.length(#strings.trim(item.err_nm)) > 30}">
                                                                    <td th:text="${item.err_nm}"></td>
                                                                </th:block>
                                                            </th:block>
                                                            <th:block th:unless="${item.err_nm != null}">
                                                                <td></td> <!-- err_nm이 null일 때 빈 셀로 표시 -->
                                                            </th:block>

                                                            <th:block th:if="${item.err_cn != null}">
                                                                <th:block
                                                                        th:if="${#strings.length(#strings.trim(item.err_cn)) > 30}">
                                                                    <td th:text="|${#strings.substring(item.err_cn, 0, 30)}...|"
                                                                        th:title="${item.err_cn}"></td>
                                                                </th:block>
                                                                <th:block
                                                                        th:unless="${#strings.length(#strings.trim(item.err_cn)) > 30}">
                                                                    <td th:text="${item.err_cn}"></td>
                                                                </th:block>
                                                            </th:block>
                                                            <th:block th:unless="${item.err_cn != null}">
                                                                <td></td> <!-- err_cn이 null일 때 빈 셀로 표시 -->
                                                            </th:block>

                                                            <td th:text="${item.reg_dt}"></td>
                                                        </tr>
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row" id="predictionResultTable" style="display: none;"></div>
                                <div class="row" id="predictionResultChart" style="display: none;">
                                    <div id="view2" style="width:100%; height:500px; border-style:solid;border-width:1px;border-color:#eee;"></div>
                                </div>
                                <!--
                                <div class="row">
                                    <div class="col-sm-12">
                                        <div class="form-group row">
                                            <div class="col-sm-2">
                                                <label class="col-form-label">히스토리</label><br>
                                            </div>
                                            <div class="col-sm-10">
                                                <textarea class="form-control preprocProPerty" rows="10" style="text-align: left;" th:text="${log_text}"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-12">
                <a class="btn btn-primary btn-icon-text" th:href="@{|${prevUrl}?${pageParams}|}">목록</a>
                <th:block
