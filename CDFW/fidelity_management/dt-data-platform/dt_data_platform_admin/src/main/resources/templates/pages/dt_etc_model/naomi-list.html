<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout2}">

<head>
    <title th:text="${breadcrumb.menu_nm}">사용자관리</title>

    <style>
        .icon-home {
            color: black;
            width: 16px;
            height: 16px;
        }

        .text-padding {
            padding-top: 4px;
            padding-right: 10px;
            padding-bottom: 5px;
            padding-left: 10px;
        }
    </style>

</head>
<div layout:fragment="content">
    <form name="searchForm" th:action="@{/dt/etc/model/naomi/list(menuCd=${params.menuCd})}" th:object="${params}"
          method="get">
        <nav th:replace="fragments/page_breadcrumb"></nav>
        <div class="row">
            <div class="col-12 col-xl-12 grid-margin stretch-card" style="margin-bottom: 0.3rem;">
                <div class="card">
                    <div class="card-body">
                        <input type="hidden" th:field="*{menuCd}">
                        <input type="hidden" id="pagingPage" name="page" th:value="${paging.page}">
                        <input type="hidden" id="pagingSize" name="size" th:value="${paging.size}">
                        <input type="hidden" id="subPagingPage" name="subPage" th:value="${subPaging.page}">
                        <input type="hidden" id="subPagingSize" name="subSize" th:value="${subPaging.size}">
                        <input type="hidden" th:field="*{sortName}">
                        <input type="hidden" th:field="*{sortType}">
                        <input type="hidden" th:field="*{subSortName}">
                        <input type="hidden" th:field="*{subSortType}">
                        <div class="row">
                            <div class="col-sm-12">
                                <div class="form-group row">
                                    <div class="col-sm-auto">
                                        <select th:field="*{field}" class="form-control">
                                            <option value="etc_model_nm">모델명</option>
                                        </select>
                                    </div>
                                    <div class="col-sm">
                                        <input type="text" th:field="*{keyword}" class="form-control"
                                               placeholder="검색어를 입력하세요">
                                    </div>
                                    <div class="col-sm-auto">
                                        <button type="submit" class="btn btn-primary mr-2 btn-icon-text btn-search">
                                            <i class="btn-icon-prepend" data-feather="search"></i>조회
                                        </button>
                                        <a th:href="@{|/dt/etc/model/naomi/form?${pageParams}|}"
                                           class="btn btn-secondary btn-icon-text">
                                            <i class="btn-icon-prepend" data-feather="edit"></i>등록
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12 col-xl-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <p class="card-description" id="main_range">
                            <th:block th:include="fragments/paging_result:: paging_result('')"></th:block>
                        </p>
                        <p class="card-description"></p>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <colgroup>
                                    <col style="width: auto;">
                                    <col style="width: 30%;">
                                    <col style="width: 30%;">
                                    <col style="width: auto;">
                                    <col style="width: auto;">
                                    <col style="width: auto;">
                                    <col style="width: auto;">
                                    <col style="width: auto;">
                                    <col style="width: auto;">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th>순번</th>
                                    <th>제목</th>
                                    <th>설명</th>
                                    <th>대상컬럼</th>
                                    <th>모델종류</th>
                                    <th>상태</th>
                                    <th>작성자</th>
                                    <th>등록일</th>
                                    <th>기능</th>
                                </tr>
                                </thead>
                                <tbody class="table-text-nowrap">
                                <th:block th:include="fragments/table_empty:: table_empty(9)"
                                          th:if="${#lists.isEmpty(list)}"></th:block>
                                <tr th:each="item : ${list}" th:unless="${#lists.isEmpty(list)}">
                                    <td th:text="${paging.total - item.rnum + 1}"></td>
                                    <td class="wrap">
                                        <a th:href="@{|/dt/etc/model/naomi/${item.etc_model_seq}?${pageParams}|}"
                                           th:text="${item.etc_model_nm}">제목</a>
                                    </td>
                                    <td class="wrap" th:text="${item.etc_model_derpn}"></td>
                                    <td th:text="${item.trgt_col}"></td>
                                    <td th:text="${item.model_algorithm}"></td>
                                    <td th:data="${item.model_status}">
                                        <th:block th:if="${item.model_status=='PREPARE'}">
                                            <span class="badge badge-secondary text-padding"><th:block
                                                    th:text="${item.status_nm}"></th:block></span>
                                        </th:block>
                                        <th:block th:if="${item.model_status=='WAIT'}">
                                            <span class="badge badge-info text-padding"><th:block
                                                    th:text="${item.status_nm}"></th:block></span>
                                        </th:block>
                                        <th:block th:if="${item.model_status=='DOING'}">
                                            <span class="badge badge-warning text-padding"><th:block
                                                    th:text="${item.status_nm}"></th:block></span>
                                        </th:block>
                                        <th:block th:if="${item.model_status=='DONE'}">
                                            <span class="badge badge-success text-padding"><th:block
                                                    th:text="${item.status_nm}"></th:block></span>
                                        </th:block>
                                        <th:block th:if="${item.model_status=='FAIL'}">
                                            <span class="badge badge-danger text-padding cursor-pointer"
                                                  data-type="errorModal"><th:block
                                                    th:text="${item.status_nm}"></th:block></span>
                                            <th:block th:if="${item.model_status == 'FAIL'}">
                                                <div id="error_frame">
                                                    <th:block th:if="${item.err_tp != null}">
                                                        <div id="err_type" th:attr="data-value=${item.err_tp}"></div>
                                                    </th:block>
                                                    <th:block th:if="${item.err_cd != null}">
                                                        <div id="errCd" th:attr="data-value=${item.err_cd}"></div>
                                                    </th:block>
                                                    <th:block th:if="${item.err_nm != null}">
                                                        <div id="errNm" th:attr="data-value=${item.err_nm}"></div>
                                                    </th:block>
                                                    <th:block th:if="${item.err_lct != null}">
                                                        <div id="errLct" th:attr="data-value=${item.err_lct}"></div>
                                                    </th:block>
                                                    <th:block th:if="${item.err_cn != null}">
                                                        <div id="errCn" th:attr="data-value=${item.err_cn}"></div>
                                                    </th:block>
                                                    <th:block th:if="${item.errregdt != null}">
                                                        <div id="errRegDt" th:attr="data-value=${item.errregdt}"></div>
                                                    </th:block>
                                                </div>
                                            </th:block>
                                        </th:block>
                                    </td>
                                    <td th:text="${item.user_id}"></td>
                                    <td th:text="${item.reg_dt}"></td>
                                    <td>
                                        <button type="button" class="btn btn-primary mr-2 btn-icon-text text-nowrap"
                                                action-type="delete" th:data-number="${item.etc_model_seq}">
                                            삭제
                                        </button>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <th:block th:include="fragments/paging_multi"></th:block>
                    </div>
                </div>
            </div>
        </div>
        <br/>
        <nav th:fragment="page_breadcrumb" class="page-breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item" th:if="${not #strings.isEmpty(breadcrumb.parent_menu_nm)}"><a href="#"
                                                                                                          th:text="${breadcrumb.parent_menu_nm}">시스템관리</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">Shared Model</li>
            </ol>
        </nav>
        <div class="row">
            <div class="col-12 col-xl-12 grid-margin stretch-card" style="margin-bottom: 0.3rem;">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-sm-12">
                                <div class="form-group row">
                                    <div class="col-sm-auto">
                                        <select th:field="*{subField}" class="form-control">
                                            <option value="etc_model_nm">모델명</option>
                                        </select>
                                    </div>
                                    <div class="col-sm">
                                        <input type="text" th:field="*{subKeyword}" class="form-control"
                                               placeholder="검색어를 입력하세요">
                                    </div>
                                    <div class="col-sm-auto">
                                        <button type="submit" class="btn btn-primary mr-2 btn-icon-text btn-search">
                                            <i class="btn-icon-prepend" data-feather="search"></i>조회
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12 col-xl-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <p class="card-description" id="sub_range">
                            <!-- <th:block th:include="fragments/paging_result:: paging_result(title='',sort='reg_dt|등록일@id|아이디@user_nm|이름')"></th:block> -->
                            <th:block th:include="fragments/paging_result_sub:: paging_result_sub('')"></th:block>
                        </p>
                        <p class="card-description"></p>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <colgroup>
                                    <col style="width: auto;">
                                    <col style="width: 30%;">
                                    <col style="width: 30%;">
                                    <col style="width: auto;">
                                    <col style="width: auto;">
                                    <col style="width: auto;">
                                    <col style="width: auto;">
                                    <col style="width: auto;">
                                </colgroup>
                                <thead>
                                <tr>
                                    <th>순번</th>
                                    <th>제목</th>
                                    <th>설명</th>
                                    <th>대상컬럼</th>
                                    <th>모델종류</th>
                                    <th>상태</th>
                                    <th>작성자</th>
                                    <th>등록일</th>
                                </tr>
                                </thead>
                                <tbody class="table-text-nowrap">
                                <th:block th:include="fragments/table_empty:: table_empty(8)"
                                          th:if="${#lists.isEmpty(share_list)}"></th:block>
                                <tr th:each="shere_item : ${share_list}" th:unless="${#lists.isEmpty(share_list)}">
                                    <td th:text="${subPaging.total - shere_item.rnum + 1}"></td>
                                    <td class="wrap">
                                        <a th:href="@{|/dt/etc/model/naomi/${shere_item.etc_model_seq}?${pageParams}|}"
                                           th:text="${shere_item.etc_model_nm}">제목</a>
                                    </td>
                                    <td class="wrap" th:text="${shere_item.etc_model_derpn}"></td>
                                    <td th:text="${shere_item.trgt_col}"></td>
                                    <td th:text="${shere_item.model_algorithm}"></td>
                                    <td>
                                        <th:block th:if="${shere_item.model_status=='PREPARE'}">
                                            <span class="badge badge-secondary text-padding"><th:block
                                                    th:text="${shere_item.status_nm}"></th:block></span>
                                        </th:block>
                                        <th:block th:if="${shere_item.model_status=='WAIT'}">
                                            <span class="badge badge-info text-padding"><th:block
                                                    th:text="${shere_item.status_nm}"></th:block></span>
                                        </th:block>
                                        <th:block th:if="${shere_item.model_status=='DOING'}">
                                            <span class="badge badge-warning text-padding"><th:block
                                                    th:text="${shere_item.status_nm}"></th:block></span>
                                        </th:block>
                                        <th:block th:if="${shere_item.model_status=='DONE'}">
                                            <span class="badge badge-success text-padding"><th:block
                                                    th:text="${shere_item.status_nm}"></th:block></span>
                                        </th:block>
                                        <th:block th:if="${shere_item.model_status=='FAIL'}">
                                            <span class="badge badge-danger text-padding"><th:block
                                                    th:text="${shere_item.status_nm}"></th:block></span>
                                        </th:block>
                                    </td>
                                    <td th:text="${shere_item.user_id}"></td>
                                    <td th:text="${shere_item.reg_dt}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <th:block th:include="fragments/paging_multi_sub"></th:block>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <!--Error 모달-->
    <th:block th:include="fragments/modal/modal_error_info"></th:block>
</div>
<th:block layout:fragment="custom_css">
</th:block>
<th:block layout:fragment="custom_js">
    <script th:src="@{/assets/js/pages/dt_etc_model/list.js}"></script>
</th:block>
</html>
