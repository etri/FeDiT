<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/platform_dt_etc_layout}">

<head>
    <title th:text="${breadcrumb.menu_nm}">게시판관리</title>
</head>
<div layout:fragment="content">
    <div class="page-title">
        <div class="contain">
            <h1 th:text="${breadcrumb.menu_nm}">Auto Encoder Model</h1>
        </div>
    </div>

    <section class="data-section">
        <div class="contain">
            <div id="loading" style="margin-left: 0px;display: none;">
                <img th:src="@{/assets/images/ajax-loading.gif}">
            </div>
            <form name="editForm" id="editForm" th:action="@{|/dt/etc/model/form|}" th:object="${dtModelEtc}"
                  method="post">
                <input type="hidden" name="menuCd" id="menuCd" th:value="${menuCd}">
                <input type="hidden" name="formType" id="formType" th:value="${formType}">
                <input type="hidden" name="grant" id="grant" th:value="${GRANT}">
                <input type="hidden" name="etcModelType" id="etcModelType" th:value="${dtModelEtc.etcModelTp}">
                <input type="hidden" id="dataList">
                <input type="hidden" id="headerList">
                <!-- <textarea class="form-control preprocProPerty" rows="20"></textarea> -->
                <input type="hidden" id="base_file_nm_set_range_row_check">
                <input type="hidden" id="input_info_check">
                <input type="hidden" id="resampel_first_check" value="N">
                <input type="hidden" id="preprocCurrent">
                <input type="hidden" name="algorithm_meta_set" id="algorithm_meta_set">
                <input type="hidden" name="algorithm_param_template_set" id="algorithm_param_template_set">
                <input type="hidden" id="model_status" th:value="${dtModelEtc.modelStatus}">
                <!--실패시 실패 내용에 관련된 input-->
                <th:block th:if="${dtModelEtc.modelStatus == 'FAIL' and errorLog != null}">
                    <div id="error_frame">
                        <div id="err_type" th:attr="data-value=${errorLog.errTp}"></div>
                        <div id="errCd" th:attr="data-value=${errorLog.errCd}"></div>
                        <div id="errNm" th:attr="data-value=${errorLog.errNm}"></div>
                        <div id="errLct" th:attr="data-value=${errorLog.errLct}"></div>
                        <div id="errCn" th:attr="data-value=${errorLog.errCn}"></div>
                        <div id="errRegDt" th:attr="data-value=${errorLog.regDt}"></div>
                    </div>
                </th:block>
                <th:block th:if="${formType == 'I'}">
                    <input type="hidden" name="preprocProPerty" id="preprocProPerty">
                    <input type="hidden" name="lastFilePath" id="lastFilePath">
                    <input type="hidden" id="etcModelSeq">
                </th:block>
                <th:block th:unless="${formType == 'I'}">
                    <input type="hidden" name="preprocProPerty" id="preprocProPerty"
                           th:value="${dtModelEtcMetaUserItem.userPprcsFullStngValue}">
                    <input type="hidden" name="lastFilePath" id="lastFilePath" th:value="${lastFilePath}">
                    <input type="hidden" id="etcModelSeq" th:value="${dtModelEtc.etcModelSeq}">

                    <th:block th:if="${dtModelEtc.modelStatus == 'DONE'}">
                        <input type="hidden" name="predictionFileListCount" id="predictionFileListCount"
                               th:value="${predictionFileListCount}">
                    </th:block>
                </th:block>
                <!-- <div class="row"> -->
                <!-- <div class="col-md-8 border-right"> -->

                <th:block th:if="${formType == 'I'}">
                    <ul class="nav nav-tabs mt-3">
                        <li class="nav-item cursor-pointer"><span class="nav-link active" id="tab_getdata">데이터선택</span>
                        </li>
                        <li class="nav-item cursor-pointer"><span class="nav-link " id="tab_info">정보입력</span></li>
                        <li class="nav-item cursor-pointer"><span class="nav-link " id="tab_column_info">데이터현황</span>
                        </li>
                        <li class="nav-item cursor-pointer"><span class="nav-link" id="tab_getalgo">모델 설정</span></li>
                        <li class="nav-item cursor-pointer"><span class="nav-link" id="tab_savemodel">결과</span></li>
                    </ul>
                </th:block>
                <th:block th:unless="${formType == 'I'}">
                    <ul class="nav nav-tabs mt-3">
                        <li class="nav-item cursor-pointer"><a class="nav-link " id="tab_info">정보입력</a></li>
                        <li class="nav-item cursor-pointer"><a class="nav-link " id="tab_column_info">데이터현황</a></li>
                        <li class="nav-item cursor-pointer"><a class="nav-link" id="tab_getalgo">모델 설정</a></li>
                        <li class="nav-item cursor-pointer"><a class="nav-link" id="tab_savemodel">결과</a></li>
                        <li class="nav-item cursor-pointer"><span class="nav-link" id="tab_history">이력</span></li>
                    </ul>
                </th:block>

                <!--데이터 미리보기 -->
                <!--데이터선택  -->
                <!---->
                <div id="tab_getdata_range">
                    <th:block th:include="pages/dt_etc_model/fragments/platform/1_select_data:: select_data"></th:block>
                </div>

                <!--정보입력  -->
                <div id="tab_info_range" style="display: none;">
                    <th:block th:include="pages/dt_etc_model/fragments/platform/2_input_info:: input_info"></th:block>
                </div>

                <!--데이터현황  -->
                <div id="tab_column_info_range" style="display: none;">
                    <th:block
                            th:include="pages/dt_etc_model/fragments/platform/2_1_column_info:: column_info"></th:block>
                </div>

                <!--알고리즘 선택  -->
                <div id="tab_getalgo_range" style="display: none;">
                    <th:block
                            th:include="pages/dt_etc_model/fragments/platform/4_select_algorithm:: select_algorithm"></th:block>
                </div>

                <!--모델 저장  -->
                <div id="tab_savemodel_range" style="display: none;">
                    <th:block th:include="pages/dt_etc_model/fragments/platform/5_save_model:: save_model"></th:block>
                </div>

                <div id="tab_preview_range" style="display: none;">
                    <th:block
                            th:include="pages/dt_etc_model/fragments/platform/0_preview_data:: preview_data"></th:block>
                </div>

                <!-- 이력 -->
                <div id="tab_history_range" style="display: none;">
                    <th:block th:include="pages/dt_etc_model/fragments/platform/6_history :: history_list"></th:block>
                </div>
            </form>
        </div>
    </section>

    <!-- api view 모달 -->
    <th:block th:include="pages/dt_etc_model/modal/modal_api_view_pop"></th:block>
    <!--Error 모달-->
    <th:block th:include="fragments/modal/modal_error_info"></th:block>
</div>
<th:block layout:fragment="custom_css">
    <link rel="stylesheet" th:href="@{/assets/css/codemirror.css}"/>
    <link rel="stylesheet" th:href="@{/assets/vendors/datatables.net-bs4/dataTables.bootstrap4.css}">
    <link rel="stylesheet" th:href="@{/assets/css/custom.css}">
</th:block>
<th:block layout:fragment="custom_js">
    <script th:src="@{/echarts532/dist/echarts.min.js}"></script>
    <script th:src="@{/assets/js/echart/echarts.js}"></script>
    <script th:src="@{/assets/js/echart/echarts_view.js}"></script>
    <script th:src="@{/assets/vendors/datatables.net/jquery.dataTables.js}"></script>
    <script th:src="@{/assets/vendors/datatables.net-bs4/dataTables.bootstrap4.js}"></script>

    <script th:src="@{/assets/js/file-upload.js}"></script>

    <script th:src="@{/assets/js/pages/dt_etc_model/platform/1_select_data.js}"></script>
    <script th:src="@{/assets/js/pages/dt_etc_model/platform/2_input_info.js}"></script>
    <script th:src="@{/assets/js/pages/dt_etc_model/platform/3_preprocess.js}"></script>
    <script th:src="@{/assets/js/pages/dt_etc_model/platform/4_select_algorithm.js}"></script>
    <script th:src="@{/assets/js/pages/dt_etc_model/platform/5_save_model.js}"></script>
    <script th:src="@{/assets/js/pages/dt_etc_model/platform/6_history.js}"></script>
    <th:block th:unless="${formType == 'I'}">
        <script th:src="@{/assets/js/pages/dt_etc_model/common/platform/common-dt-tab-control-view.js}"></script>
    </th:block>

    <!--DataTable 가시성 개선-->
    <!--<script th:src="@{/assets/js/scroller/dataTables.scroller.js}"></script>-->
</th:block>
</html>
