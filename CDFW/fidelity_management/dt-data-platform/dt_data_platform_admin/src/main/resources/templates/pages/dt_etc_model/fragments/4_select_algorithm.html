<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<th:block th:fragment="select_algorithm">

    <div id="next_button_getalgo_range">
        <!--
        <div class="col-sm-12">
               <button type="button" class="btn btn-primary mr-2 btn-icon-text next-savemodel-step float-right">
                다음<i data-feather="arrow-right"></i>
            </button>
               <button type="button" class="btn btn-primary mr-2 btn-icon-text prev-preproc-step float-right">
                <i data-feather="arrow-left"></i>이전
            </button>
          </div>
          -->

        <!-- 알고리즘 선택  상단 -->
        <div class="row" id="tab_getalgo_range">
            <div class="col-md-12 grid-margin  stretch-card" id="tab_getalgo_range_top">
                <div class="card">
                    <div class="card-body">
                        <div class="form-group row">
                            <div class="col-md-4" data-id="output_range" data-type="Auto Encoder, Random Forest, Brits">
                                <div class="row">
                                    <div class="col-md-12">
                                        <span data-id="column_description" data-type="Auto Encoder, Random Forest, Brits"
                                              style="font-size: 11px; color: red;">단일 컬럼만 지정 가능합니다.</span>
                                    </div>
                                    <div class="col-md-12">
                                        <h6 class="card-title">컬럼 선택</h6>
                                        <div id="algorithmOutputRange"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4" data-id="feature_range" data-type="Random Forest">
                                <div class="row">
                                    <div class="col-md-12">
                                        <span data-id="column_description" data-type="Random Forest"
                                              style="font-size: 11px; color: red;">복수 컬럼 선택 가능합니다.</span>
                                    </div>
                                    <div class="col-md-12">
                                        <h6 class="card-title">독립변수</h6>
                                        <div id="algorithmFeatureRange"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-4" data-id="correlation_range">
                                <h6 class="card-title">Correlation analysis(상관분석)</h6>
                                <div id="view4"
                                     style="width:100%; height:400px; border-style:solid;border-width:1px;border-color:#eee;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 알고리즘 선택  하단 -->
            <div class="col-md-12 grid-margin  stretch-card" id="tab_getalgo_range_bottom">
                <div class="card">
                    <div class="card-body">
                        <div class="form-group row">
                            <div class="col-md-6">
                                <h6 class="card-title">알고리즘 선택</h6>

                                <div class="form-group">
                                    <!-- <label>컬럼선택</label> -->
                                    <select class="w-60" id="select_algorithm" name="modelAlgrmSeq">
                                        <option value="0">선택</option>
                                        <option th:each="item : ${algorithm_list}" th:value="${item.model_algrm_seq}"
                                                th:text="${item.model_algrm}"></option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <div style="width:60%; height: auto; border-style:solid;border-width:1px;border-color:#eee;">
                                        <div id="algolithm_img_box" class="background-image"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div id="algorithm_meta_item_list"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <th:block th:if="${formType == 'I'}">
            <div class="row">
                <div class="col-sm-12">
                    <button type="button" class="btn btn-success mr-2 btn-icon-text make-model">
                        <i class="btn-icon-prepend" data-feather="edit"></i>등록
                    </button>
                </div>
            </div>
        </th:block>
    </div>
</th:block>
</html>
