<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<th:block th:fragment="select_algorithm">

    <div id="next_button_getalgo_range">
        <!--
        <div class="col-sm-12">
               <button type="button" class="btn btn-primary mr-2 btn-icon-text next-savemodel-step float-right">
                다음<i data-feather="arrow-right"></i>
            </button>
               <button type="button" class="btn btn-primary mr-2 btn-icon-text prev-preproc-step float-right">
                <i data-feather="arrow-left"></i>이전
            </button>
          </div>
          -->

        <!-- 알고리즘 선택  상단 -->
        <div class="row" id="tab_getalgo_range">
            <div class="col-md-12 grid-margin  stretch-card" id="tab_getalgo_range_top">
                <div class="card">
                    <div class="card-body">
                        <span style="font-size: 11px; color: red;">종속 변수와 독립 변수는 동일한 컬럼을 선택 할 수 없습니다.</span>
                        <div class="form-group row">
                            <div class="col-md-4">
                                <h6 class="card-title">종속변수</h6>
                                <th:block th:if="${(dtModel.jobLevel == 'M' and formType == 'U') and GRANT == true}">
                                    <div id="algorithmOutputRange" th:data-form-type="${formType}" th:data-job-level="${dtModel.jobLevel}"></div>
                                </th:block>
                                <th:block th:unless="${(dtModel.jobLevel == 'M' and formType == 'U') and GRANT == true}">
                                    <div id="algorithmOutputRange"></div>
                                </th:block>
                            </div>

                            <div class="col-md-4">
                                <h6 class="card-title">독립변수</h6>
                                <th:block th:if="${(dtModel.jobLevel == 'M' and formType == 'U') and GRANT == true}">
                                    <div id="algorithmFeatureRange" th:data-form-type="${formType}" th:data-job-level="${dtModel.jobLevel}"></div>
                                </th:block>
                                <th:block th:unless="${(dtModel.jobLevel == 'M' and formType == 'U') and GRANT == true}">
                                    <div id="algorithmFeatureRange"></div>
                                </th:block>
                            </div>

                            <div class="col-md-4">
                                <h6 class="card-title">Correlation analysis(상관분석)</h6>
                                <div id="view4"
                                     style="width:100%; height:400px; border-style:solid;border-width:1px;border-color:#eee;"></div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>


            <!-- 알고리즘 선택  하단 -->
            <div class="col-md-12 grid-margin  stretch-card" id="tab_getalgo_range_bottom">
                <div class="card">
                    <div class="card-body">
                        <div class="form-group row">
                            <div class="col-md-6">
                                <h6 class="card-title">알고리즘 선택</h6>

                                <div class="form-group">
                                    <!-- <label>컬럼선택</label> -->
                                    <select class="w-60" id="select_algorithm" name="modelAlgrmSeq">
                                        <option value="0">선택</option>
                                        <option th:each="item : ${algorithm_list}" th:value="${item.model_algrm_seq}"
                                                th:text="${item.model_algrm}"></option>
                                    </select>
                                </div>


                                <div class="form-group">
                                    <div style="width:60%; height: auto; border-style:solid;border-width:1px;border-color:#eee;">
                                        <div id="algolithm_img_box" class="background-image"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div id="algorithm_meta_item_list"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <th:block th:if="${(dtModel.jobLevel == 'P' or formType == 'I') and GRANT == true}">
            <div class="row">
                <div class="col-sm-12">
                    <button type="button" class="btn btn-success mr-2 btn-icon-text make-model">
                        <i class="btn-icon-prepend" data-feather="edit"></i>등록
                    </button>
                </div>
            </div>
        </th:block>
        <th:block th:if="${(dtModel.jobLevel == 'M' and formType == 'U') and GRANT == true and (dtModel.modelStatus == 'DONE' or dtModel.modelStatus == 'FAIL')}">
            <div class="row">
                <div class="col-sm-12">
                    <button type="button" class="btn btn-success mr-2 btn-icon-text remake-model">
                        <i class="btn-icon-prepend" data-feather="edit"></i>모델 재학습
                    </button>
                </div>
            </div>
        </th:block>
    </div>
</th:block>

</html>
