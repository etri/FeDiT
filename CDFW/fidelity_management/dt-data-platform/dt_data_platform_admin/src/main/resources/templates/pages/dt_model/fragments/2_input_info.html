<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<th:block th:fragment="input_info">

    <div class="row">
        <div class="col-lg-12 grid-margin stretch-card">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">데이터 정보 등록</h4>
                    <!-- <p class="card-description">파일 선택 후 다음을 클릭 시 데이터가 저장 되며 이후 전처리를 진행 할 수 있습니다.</p> -->
                    <div class="form-group row">
                        <div class="col-lg-3">
                            <label class="col-form-label">모델명</label>
                        </div>
                        <div class="col-lg-8">
                            <!-- <input class="form-control" th:field="*{modelNm}" type="text"> -->
                            <input class="form-control" name="modelNm" id="modelNm" th:value="${dtModel.modelNm}"
                                   type="text">
                        </div>
                    </div>
                    <div class="form-group mb-0 row">
                        <div class="col-lg-3">
                            <label class="col-form-label">모델설명</label>
                        </div>
                        <div class="col-lg-8">
                            <textarea id="maxlength-textarea" class="form-control model_derpn" name="modelDerpn"
                                      th:text="${dtModel.modelDerpn}" rows="12"></textarea>
                        </div>
                    </div>

                    <div class="form-group mb-0 row">
                        <div class="col-lg-3">
                            <label class="col-form-label">공개여부</label><br/>
                        </div>
                        <div class="col-lg-8">
                            <div class="form-check form-check-inline">
                                <label class="form-check-label">
                                    <input type="radio" class="form-check-input" name="rlsYn" value="N" data-label="비공개"
                                           th:checked="*{rlsYn == 'N' or rlsYn == null}">비공개
                                    <i class="input-frame"></i>
                                </label>
                            </div>
                            <div class="form-check form-check-inline">
                                <label class="form-check-label">
                                    <input type="radio" class="form-check-input" name="rlsYn" value="Y" data-label="공개"
                                           th:checked="*{rlsYn == 'Y'}">공개
                                    <i class="input-frame"></i>
                                </label>
                            </div>
                            <div class="form-check form-check-inline">
                                <span style="color: red;">(공개로 설정한 경우 최종 모델 생성이 완료된 데이터만 공개됩니다.)</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 업로드 테이블-->
    <div class="row">
        <div id="csvUpRange" style="width: 100%;"></div>
    </div>

    <div id="next_button_info_range" style="display: none;">
        <div class="col-sm-12">
            <button type="button" id="info_next"
                    class="btn btn-primary mr-2 btn-icon-text next-dataset-info-step float-right"
                    style="display: none;">
                다음(데이터확인후)<i data-feather="arrow-right"></i>
            </button>
            <button type="button" id="info_prev"
                    class="btn btn-primary mr-2 btn-icon-text prev-select-data-step float-right">
                <i data-feather="arrow-left"></i>이전
            </button>
        </div>
    </div>
    <br/>
</th:block>
</html>
