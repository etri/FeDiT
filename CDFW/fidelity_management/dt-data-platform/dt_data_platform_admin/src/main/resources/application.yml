spring:
  profiles:
    active: local

  main:
    allow-bean-definition-overriding: true
    
  jackson:
    serialization:
      fail-on-empty-beans: false
    
  http:
    encoding:
      force: true
      force-request: true
      force-response: true
      
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB
      
  thymeleaf:
    cache: false

server:
  servlet:
    session:
      timeout: 120m
      persistent: true
      cookie:
        name: [JSESSIONID]
        http-only: true
  tomcat:
    uri-encoding: UTF-8
  error:
    whitelabel:
      enabled: false
    include-stacktrace: on-trace-param
    
---
    
spring:
  profiles: local
  output:
    ansi:
      enabled: detect
  http:
    log-request-details: true
  servlet:
    multipart:
      location: ~PATH\DT_FILE_TMP\DT_FILE\temp

  primary:
    datasource:
      driver-class-name: org.mariadb.jdbc.Driver
      jdbc-url: [MARIADB_URL]
      username: [MARIADB_USER]
      password: [MARIADB_PASSWORD]
  second:
    datasource:
      driver-class-name: org.mariadb.jdbc.Driver
      jdbc-url: [MARIADB_URL]
      username: [MARIADB_USER]
      password: [MARIADB_PASSWORD]
      
      
server:
  port: [PORT]

system:
  username: [AUTO LOGIN ADMIN USERNAME]
  password: [AUTO LOGIN ADMIN PASSWORD]
  upload-file-path: ~PATH\DT_FILE_TMP\DT_FILE\files
  upload-file-url: /resource
  limit-csv-row-count: 10000
  dt-file-path: ~PATH\DT_FILE_TMP\DT_FILE\files\storage
  dt-meta-file-path: ~PATH:\DT_FILE_TMP\DT_META_FILE\files\storage
  dt-etc-meta-file-path: ~PATH:\DT_FILE_TMP\DT_ETC_META_FILE\files\storage
  dt-api-url: [DT_DATA_API_URL]
  tmp-sample-data: ~PATH:\DT_FILE_TMP\DT_META_FILE\files\TESTFILE.ext
  #메타 서버
  dt-meta-api-url: [DT_META_API_URL:PORT]
  #동기화 엔진 서버
  dt-keti-api-url: [DT_KETI_API_URL:PORT]
  dt-api-key: [DT_DATA_API_KEY]
  #메타 서버 키
  dt-n2m-key: [N2M_KEY]
  limit-make-model-cnt: 4

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
    file: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
#    file: "%d %-5level [%thread] %logger : %msg%n" 
  level:
    root: info
    jdbc: off
    jdbc.sqlonly: debug
    jdbc.sqltiming: off
    jdbc.resultset: off
    jdbc.resultsettable: off
    jdbc.connection: off
    log4jdbc: off
    log4jdbc.sql: off
 
