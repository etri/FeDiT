spring.application.name=searchRule
spring.profiles.active=dev

server.port=8888

spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username={neo4jId}
spring.neo4j.authentication.password={neo4jPw}

stellio.broker.base-url=http://localhost:8085/ngsi-ld/v1

setInit.dataSource=http

cors.allowed-origins=http://{serverIp}:33000,http://localhost:5173,http://{devPcIp}:5173

fedit.api.base-url=http://{fedtApiIp}:{fedtApiPort}

graph.ttl.source-path=output/all-entities.ttl
graph.ttl.import-host-dir=neo4j-import
graph.ttl.import-file-name=ontology.ttl
graph.ttl.import-neo4j-uri=file:///ontology.ttl
graph.websocket.topic=/topic/graph-update

spring.kafka.bootstrap-servers=localhost:29092

spring.kafka.consumer.group-id=ontology-consumer
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.max-poll-records=50
app.kafka.topic.searchRule=twin-meta-changelog

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:6543/ontology_converter
spring.datasource.username={ocDbId}
spring.datasource.password={ocDbPw}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.batch.jdbc.initialize-schema=always

ngsild.pagination.limit=100

searchRule.tokens.preload-on-startup=true

spring.kafka.listener.ack-mode=manual

retry.scheduler.enabled=true
retry.scheduler.interval-ms=60000
retry.scheduler.max-retries=5
retry.scheduler.batch-size=20
retry.scheduler.cooldown-seconds=90
retry.scheduler.retrying-timeout-minutes=10
