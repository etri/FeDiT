spring.application.name=TrackingDataSubscriber

#RabbitMQ Config
spring.rabbitmq.host:{server ip}
spring.rabbitmq.port:5672
spring.rabbitmq.username:guest
spring.rabbitmq.password:guest

rabbitmq.exchange.name:federate.tracking
rabbitmq.queue.name:tracking.subscriber.sub
rabbitmq.routing.key:tracking.Subscriber.sub.#


spring.kafka.bootstrap-servers:{server ip}:9092
spring.kafka.cloud.bus.enabled: true

server.port=22439

## Linux Centos7 parameter
script.engine.name:nashorn

## Window OS parameter
#script.engine.name:graal.js



spring.datasource.hikari.jdbc-url=jdbc:mysql://{server ip}:{server port}/federatedTwins?autoCommit=false&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&autoReconnect=true

spring.datasource.hikari.username={userId}
spring.datasource.hikari.password={userPw}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1


logging.config=classpath:logback/logback.xml


mybatis.mapper-locations=classpath:subscriber/mybatis/mapper/**/*.xml
