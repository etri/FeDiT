spring.application.name=TrackingCommandReceiver

spring.security.user.name={eurekaId}
spring.security.user.password={eurekaPw}

eureka.instance.hostname={server ip}
eureka.instance.preferIpAddress=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://${spring.security.user.name}:${spring.security.user.password}@{server ip}:8761/eureka/

eureka.client.registry-fetch-interval-seconds=3
eureka.client.disable-delta=true

eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=20

eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${spring.application.instance_id:${server.port}}
#application.properties
management.endpoints.web.exposure.include=refresh,health,beans,busenv,busrefresh,info,metrics,prometheus,customEndpoint 
management.endpoint.health.show-details=always

#management.info.env.enabled=true
#management.endpoints.web.base-path=/custom

#RabbitMQ Config
spring.rabbitmq.host:{server ip}
spring.rabbitmq.port:5672
spring.rabbitmq.username:guest
spring.rabbitmq.password:guest

rabbitmq.exchange.name:federate.tracking
rabbitmq.queue.name:tracking.receiver.rec
rabbitmq.routing.key:tracking.receiver.rec.#

app.version: 2.0


CTRL_CMD_REQ_RECORDING_TYPE=TRUE

server.port=22419

spring.datasource.hikari.jdbc-url=jdbc:mysql://{server ip}:{server port}/federatedTwins?autoCommit=false&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&autoReconnect=true

spring.datasource.hikari.username={userId}
spring.datasource.hikari.password={userPw}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimumidle=10
spring.datasource.hikari.connection-test-query=SELECT 1


logging.config=classpath:logback/logback.xml


mybatis.mapper-locations=
