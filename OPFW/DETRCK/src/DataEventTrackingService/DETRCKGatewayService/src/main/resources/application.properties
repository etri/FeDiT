spring.application.name=eureka-gateway-service

spring.security.user.name=dtEtTrck
spring.security.user.password=fdt$Twns21!

eureka.instance.hostname=localhost
eureka.instance.preferIpAddress=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://${spring.security.user.name}:${spring.security.user.password}@localhost:8761/eureka/

eureka.client.registry-fetch-interval-seconds=3
eureka.client.disable-delta=true

eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=20

eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${spring.application.instance_id:${server.port}}

management.endpoints.web.exposure.include=health,info 
management.endpoint.health.show-details=always

management.info.env.enabled=true


server.port=8000

spring.cloud.loadbalancer.ribbon.enabled=true

spring.cloud.gateway.routes[0].id=TrackingCommandReceiver
spring.cloud.gateway.routes[0].uri=lb://TrackingCommandReceiver
spring.cloud.gateway.routes[0].predicates[0].name=Path
spring.cloud.gateway.routes[0].predicates[0].args.pattern=/fdt/detrck/rcv/**

spring.cloud.gateway.routes[1].id=TrackingCommandPublisher
spring.cloud.gateway.routes[1].uri=lb://TrackingCommandPublisher
spring.cloud.gateway.routes[1].predicates[0].name=Path
spring.cloud.gateway.routes[1].predicates[0].args.pattern=/fdt/detrck/pub/**

spring.cloud.gateway.routes[2].id=TrackingDataSubscriber
spring.cloud.gateway.routes[2].uri=lb://TrackingDataSubscriber
spring.cloud.gateway.routes[2].predicates[0].name=Path
spring.cloud.gateway.routes[2].predicates[0].args.pattern=/fdt/detrck/sub/**

spring.cloud.gateway.routes[3].id=TrackingEventTrigger
spring.cloud.gateway.routes[3].uri=lb://TrackingEventTrigger
spring.cloud.gateway.routes[3].predicates[0].name=Path
spring.cloud.gateway.routes[3].predicates[0].args.pattern=/fdt/detrck/trg/**

spring.cloud.gateway.routes[4].id=TrackingCommandDetector
spring.cloud.gateway.routes[4].uri=lb://TrackingCommandDetector
spring.cloud.gateway.routes[4].predicates[0].name=Path
spring.cloud.gateway.routes[4].predicates[0].args.pattern=/fdt/detrck/det/**

spring.cloud.gateway.routes[5].id=TrackingCommandStatusChecker
spring.cloud.gateway.routes[5].uri=lb://TrackingCommandStatusChecker
spring.cloud.gateway.routes[5].predicates[0].name=Path
spring.cloud.gateway.routes[5].predicates[0].args.pattern=/fdt/detrck/sch/**


logging.level.gateway.filters.JwtAuthFilter=info
logging.file.name=/var/log/${spring.application.name}.log
logging.file.max-size=100MB
logging.file.max-history=5


spring.cloud.gateway.loadbalancer.use404=true


