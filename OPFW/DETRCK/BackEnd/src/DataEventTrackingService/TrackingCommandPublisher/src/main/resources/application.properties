spring.application.name=TrackingCommandPublisher

management.endpoints.web.exposure.include=health,info, prometheus 
management.endpoint.health.show-details=always

management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

spring.rabbitmq.host:{serverIp}
spring.rabbitmq.port:5674
spring.rabbitmq.username:guest
spring.rabbitmq.password:guest

rabbitmq.exchange.name:federate.tracking
rabbitmq.queue.name:tracking.publish.pub
rabbitmq.routing.key:tracking.publish.pub.#

spring.kafka.bootstrap-servers:{kafkaIp}:9092
spring.kafka.cloud.bus.enabled: true 

server.port=22429

spring.datasource.hikari.jdbc-url=jdbc:mariadb://{serverIp}:{dbPort}/dataEventTrackings?autoCommit=false&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&autoReconnect=true

spring.datasource.hikari.username={userId}
spring.datasource.hikari.password={userPw}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1

logging.config=classpath:logback/logback.xml

mybatis.mapper-locations=classpath:publisher/mybatis/mapper/**/*.xml
