paths:
  dataset_root: /Users/user/Desktop/ir_autolabeling/data/MOT20
  artifact_root: /Users/user/Desktop/ir_autolabeling/artifacts/full
  docs_experiments_dir: /Users/user/Desktop/ir_autolabeling/docs/experiments

dataset:
  split: train
  sequences:
    - MOT20-01
  frame_stride: 1
  max_frames_per_sequence: null

detector:
  cache_tag: full_grounded_sam2_base_person_sahi_v2
  prompt: "person."
  prompt_variants:
    - "pedestrian."
    - "human."
    - "child."
  canonical_label: person
  prompt_strategy: combined
  grounding_model_id: IDEA-Research/grounding-dino-base
  sam2_model_id: facebook/sam2-hiera-large
  grounding_device: mps
  sam2_device: mps
  grounding_box_threshold: 0.01
  grounding_text_threshold: 0.01
  use_slice_inference: true
  slice_backend: sahi
  slice_width: 640
  slice_height: 640
  slice_overlap: 0.25
  detector_max_detections: 3000
  pre_nms_iou: 0.97
  prompt_fusion_iou: 0.90
  sam2_max_refinement_boxes: 0
  sahi_perform_standard_pred: false
  sahi_postprocess_type: NMM
  sahi_postprocess_match_metric: IOU
  sahi_postprocess_match_threshold: 0.80
  sahi_auto_slice_resolution: false
