apiVersion: v1
kind: Secret
metadata:
  name: label-studio-postgres
  namespace: kubeflow
type: Opaque
stringData:
  DJANGO_DB: "postgresql"
  POSTGRE_USER: "label_studio"
  POSTGRE_PASSWORD: "<strong-password>"
  POSTGRE_NAME: "label_studio"
  POSTGRE_HOST: "<postgres-host>"
  POSTGRE_PORT: "5432"
