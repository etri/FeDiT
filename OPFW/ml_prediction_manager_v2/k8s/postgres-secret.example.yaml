apiVersion: v1
kind: Secret
metadata:
  name: prediction-manager-postgres
  namespace: kubeflow
type: Opaque
stringData:
  PREDICTION_MANAGER_DATABASE_URL: "postgresql://<user>:<password>@<host>:5432/prediction_manager"
  PM_MLFLOW_BACKEND_STORE_URI_TEMPLATE: "postgresql+psycopg2://<user>:<password>@<host>:5432/mlflow_{namespace_db}"
  PM_NIFI_INGEST_SECRET: "<openssl-rand-hex-32>"
