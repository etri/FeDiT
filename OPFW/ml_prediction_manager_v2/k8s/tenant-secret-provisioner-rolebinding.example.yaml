# Tenant namespace별 Secret provisioner 권한 예시입니다.
# prediction-manager는 사용자/Profile 생성 시 동일한 RoleBinding을 대상 tenant namespace에 자동 생성합니다.
# <tenant-namespace>는 kubeflow-user-example-com 같은 실제 사용자 namespace로 바꿔 수동 점검할 수 있습니다.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prediction-manager-provisioner
  namespace: <tenant-namespace>
subjects:
  - kind: ServiceAccount
    name: prediction-manager-provisioner
    namespace: kubeflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prediction-manager-tenant-secret-provisioner
