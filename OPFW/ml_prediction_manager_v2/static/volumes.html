<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>사용자 볼륨</title>
  <style>
    body{margin:0;background:#f7f9fc;color:#172338;font:14px system-ui,sans-serif}main{max-width:1050px;margin:28px auto;padding:24px;background:white;border:1px solid #e2e8f0;border-radius:12px}h1{margin:0 0 10px;font-size:24px}p{color:#526077;line-height:1.7}form{display:flex;align-items:end;gap:14px;flex-wrap:wrap;margin:24px 0}label{display:grid;gap:6px}input{padding:9px;border:1px solid #cbd5e1;border-radius:6px}button{padding:9px 14px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;cursor:pointer}button.primary{background:#2563eb;color:white;border-color:#2563eb}button.danger{color:#b91c1c}button:disabled{opacity:.5;cursor:default}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:12px;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}th{background:#f8fafc}#message{min-height:24px;white-space:pre-wrap}#message.error{color:#b91c1c}.scope{font-weight:600;color:#1d4ed8}.hint{font-size:12px}@media(max-width:650px){main{margin:0;padding:16px}table{font-size:12px}th,td{padding:7px}}
  </style>
</head>
<body>
<main>
  <h1>사용자 볼륨</h1>
  <p>이 영역에서 만든 작업용 볼륨만 관리합니다. 플랫폼·MLflow·NiFi 저장소와 기존 미분류 볼륨은 표시하지 않습니다.</p>
  <div id="scope" class="scope">사용자 영역 확인 중…</div>
  <form id="create">
    <label>이름<input id="name" required maxlength="47" pattern="[a-z0-9]([a-z0-9-]*[a-z0-9])?" placeholder="training-data"></label>
    <label>크기 (GiB)<input id="size" type="number" min="1" max="1024" value="10" required></label>
    <button id="submit" class="primary" disabled>볼륨 만들기</button>
    <button id="refresh" type="button">새로고침</button>
  </form>
  <p class="hint">볼륨 이름에는 pm-user- 접두사가 붙습니다. 노트북 생성 시 기존 볼륨에서 선택할 수 있습니다. 노트북을 삭제해도 데이터는 유지되며, 연결된 작업이 있는 볼륨은 삭제할 수 없습니다.</p>
  <div id="message" role="status" aria-live="polite"></div>
  <table><thead><tr><th>볼륨</th><th>크기</th><th>상태</th><th>저장소</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table>
</main>
<script src="./sandbox.js"></script>
</body>
</html>
