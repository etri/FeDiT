apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-lifecycle-fixture
  namespace: kubeflow-user-example-com
data:
  data.json: '{"temperature":23.5,"humidity":46,"target":3}'
  data.csv: |
    x1,x2,target
    1,2,3
    2,3,5
    3,4,7
    4,5,9
    5,6,11
    6,7,13
    7,8,15
    8,9,17
    9,10,19
    10,11,21
    11,12,23
    12,13,25
    13,14,27
    14,15,29
    15,16,31
    16,17,33
    17,18,35
    18,19,37
    19,20,39
    20,21,41
    21,22,43
    22,23,45
    23,24,47
    24,25,49
    25,26,51
    26,27,53
    27,28,55
    28,29,57
    29,30,59
    30,31,61
    31,32,63
    32,33,65
    33,34,67
    34,35,69
    35,36,71
    36,37,73
    37,38,75
    38,39,77
    39,40,79
    40,41,81
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-lifecycle-fixture
  namespace: kubeflow-user-example-com
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-lifecycle-fixture
  template:
    metadata:
      labels:
        app: ui-lifecycle-fixture
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: ui-lifecycle-fixture
          image: 127.0.0.1:5000/prediction-manager-app:verification
          command: ["python", "-m", "http.server", "8080", "--bind", "0.0.0.0", "--directory", "/data"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          configMap:
            name: ui-lifecycle-fixture
---
apiVersion: v1
kind: Service
metadata:
  name: ui-lifecycle-fixture
  namespace: kubeflow-user-example-com
spec:
  selector:
    app: ui-lifecycle-fixture
  ports:
    - port: 8080
      targetPort: 8080
