receivers:
  otlp:
    protocols:
      grpc:
      http:
exporters:
  debug:
    verbosity: detailed
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: http://tw-load-balancer:9009/api/v1/push
    headers:
      "X-Scope-OrgID": "digital-twin"

service:
  pipelines:
    # traces:
    #   receivers: [otlp]
    #   exporters: [debug, otlp/jaeger]
    metrics:
      receivers: [otlp]
      exporters: [debug, prometheusremotewrite]