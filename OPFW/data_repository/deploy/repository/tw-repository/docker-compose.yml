version: "3.7"
services:
  tw-repository-db-mariadb:
    build:
      context: ./
      dockerfile: ./docker-excluded/db/Dockerfile
    volumes:
      # - ./docker-bind/init-data/db/config/conf.d:/etc/mysql/conf.d:ro
      - ./docker-bind/generated-data/db/mysql:/var/lib/mysql
      - ./docker-bind/init-data/db/dump_repository_init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${MARIADB_PORT}:3306"
    # restart: always
    environment:
      ALLOW_EMPTY_PASSWORD: no
      TZ: "Asia/Seoul"
      MARIADB_DATABASE: repository
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_EVENT_SCHEDULER: ON 
    hostname: tw-repository-db-mariadb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MARIADB_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  tw-repository:
    container_name: tw-repository
    build:
      context: .
      dockerfile: ./docker-excluded/tw-repository/Dockerfile
    ports:
      - "${TW_REPOSITORY__HOST_SERVICE_PORT}:8080"
    environment:
      - TZ=Asia/Seoul
      - JAVA_OPTS=
        -Djdbc-username=${TW_REPOSITORY__JDBC_USERNAME}
        -Djdbc-password=${TW_REPOSITORY__JDBC_PASSWORD}
        -Dspring.profiles.active=prod
        # -Duser.timezone="Asia/Seoul"
    volumes:
      - type: bind
        source: ./docker-bind/init-data/${TW_REPOSITORY__APP_NAME}/svc/webapps
        target: /usr/local/tomcat/webapps
      - type: bind
        source: ./docker-bind/generated-data/logs/${TW_REPOSITORY__APP_NAME}
        target: /usr/local/tomcat/prod_logs
      - type: bind
        source: ./docker-bind/init-data/${TW_REPOSITORY__APP_NAME}/svc/secrets
        target: /jw/secrets
      - type: bind
        source: ./docker-bind/generated-data/files
        target: /jw/files
    #restart: "always"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        ./entrypoint.sh
    #privileged: true
    tty: true
    depends_on:
      tw-repository-db-mariadb:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    name: network-tw-base
    external: true