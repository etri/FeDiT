get:
  tags: 
    - measure-position
  summary: 임의의 GPS 좌표의 점을 중심으로 반경(radius:meter단위)내의 nodelink 조회
  parameters:
    - $ref: '../parameters/query/longitude.yaml'
    - $ref: '../parameters/query/latitude.yaml'
    - name: radius
      in: query     
      required: true
      description: 검색반경(meter)
      schema:
        type: integer

  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              code:
                type: integer
              msg:
                type: string
              pageNumber:
                type: integer
              numberOfRows:
                type: integer
              totalCount:
                type: integer
              list:
                type: array
                items: 
                  type: integer
    500:
      description: ERROR
