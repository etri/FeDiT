post:
  tags: 
    - visitjeju
  summary: visitjeju gps 정보 조회
  requestBody:
    required: true
    content:
      application/json:
          schema:
            type: object
            properties:
              measure_position_id_list:
                type: array
                items: 
                  type: integer
            example: 
              measure_position_id_list: [112018, 112021]
  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: array
            items: 
              type: object
              properties:
                measure_position_id:
                  type: integer
                latitude:
                  type: number
                longitude:
                  type: number
    500:
      description: ERROR
