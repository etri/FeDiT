spring:
  application:
    name: tw-gateway
  profiles:
    active: dev

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: net.jw.twin.repository.**.model
  mapper-locations: config/mybatis/repository/**/*.xml, mybatis/repository/**/*.xml

jcms:
  repository:
    node-list-path: /v1/data-item
    key-check-path: /v1/rest-key/usage-request
    # login-form-path: /login/loginForm.mng
    # login-path: /login/login.mng
    # node-detail-path: /user/service/detail.json

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mariadb://tw-repository-db-mariadb:3306/repository
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: jin1234

server:
  port: 8080

jcms:
  repository:
    repository-url: 'http://tw-service-manager:8080/'

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mariadb://tw-repository-db-mariadb:3306/repository
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: jin1234
    
server:
  port: 8080

jcms:
  repository:
    repository-url: 'http://tw-service-manager:8080/'

