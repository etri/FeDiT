plugins {
    id 'java-library'
    id 'maven-publish'
}

project.ext.version = new Properties()
project.ext.version.sourceCompatibility = '1.8';
//project.ext.version.sourceCompatibility = '17';
// project sdk version도 변경해야함

group = 'net.jw'
version = '1.0-SNAPSHOT'
sourceCompatibility = project.ext.version.sourceCompatibility

if(project.ext.version.sourceCompatibility == '1.8'){
    project.ext.version.spring_version = '5.3.29'
    project.ext.version.java_version = 'java8'
}else{
    project.ext.version.spring_version = '6.1.8'
    project.ext.version.java_version = 'java17'
}
project.ext.archiveName = "twin-repository-db-${project.ext.version.java_version}"

repositories {
    mavenCentral()

    flatDir {
        dirs "${projectDir}/../libs"
    }
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

dependencies {
    compileOnly "org.springframework:spring-context:${project.ext.version.spring_version}"
    compileOnly "org.springframework:spring-web:${project.ext.version.spring_version}"
    compileOnly "org.springframework:spring-tx:${project.ext.version.spring_version}"

    compileOnly 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    compileOnly 'org.mybatis:mybatis:3.5.13'

    compileOnly "net.jw:jcms-base-${project.ext.version.java_version}:1.0-SNAPSHOT"

    // json
    compileOnly 'com.google.code.gson:gson:2.10.1'

    compileOnly 'io.swagger.core.v3:swagger-annotations:2.2.18'



    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'


    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}


compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
//    dependsOn 'test'
    finalizedBy assemble
    archiveBaseName = "${project.ext.archiveName}"
    destinationDirectory = file("${projectDir}/../libs")
}
