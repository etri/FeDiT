spring.application.name=FeDitApiGWCtrlCmdProcessor

#application.properties
management.endpoints.web.exposure.include=health,info 
management.endpoint.health.show-details=always

management.info.env.enabled=true

#RabbitMQ Config
spring.rabbitmq.host:{server ip}
spring.rabbitmq.port:5672
spring.rabbitmq.username:guest
spring.rabbitmq.password:guest

rabbitmq.exchange.name:fedit.apiGateway
rabbitmq.queue.name:iitp.fedit.apiGateway.processor
rabbitmq.routing.key:iitp.fedit.apiGateway.processor.request.command

server.port=23429

#spring.datasource.hikari.initialization=true
#spring.datasource.hikari.initialization-mode=always
spring.datasource.hikari.jdbc-url=jdbc:mysql://{server ip}:{server port}/ctrlApiGateway?autoCommit=false&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&autoReconnect=true

spring.datasource.hikari.username={userId}
spring.datasource.hikari.password={userPw}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-test-query=SELECT 1


#logback 설정 default
logging.config=classpath:logback/logback.xml


#mybatis.mapper-config=classpath:mybatis-common/mybatis-config.xml

mybatis.mapper-locations=
