server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /fedit/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /fedit/index.html;
    }

    location /fedit {
        return 301 /fedit/;
    }

    # Keep the embedded Prediction Manager and Kubeflow web apps on the same
    # origin as the predictor tool.
    location /prediction-manager/ {
        # 18100 is bound only to loopback and the Docker bridge by the access
        # runner. Browser traffic uses the allowed public TCP 18000 endpoint.
        proxy_pass http://host.docker.internal:18100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /prediction-manager;
        # Verification-only local proxy identity; production ingress should
        # provide these headers from the authenticated Kubeflow session.
        proxy_set_header kubeflow-userid user@example.com;
        proxy_set_header X-Auth-Request-Email user@example.com;
        proxy_set_header X-Auth-Request-User user@example.com;
        proxy_read_timeout 300s;
    }

    location /volumes/ {
        # User volumes go through the PM ownership policy, never the shared
        # Kubeflow volume application. Preserve /volumes/ for the sandbox page.
        proxy_pass http://host.docker.internal:18100/volumes/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /volumes;
        proxy_set_header kubeflow-userid user@example.com;
        proxy_set_header X-Auth-Request-Email user@example.com;
        proxy_set_header X-Auth-Request-User user@example.com;
        proxy_read_timeout 300s;
    }

    # Kubeflow Angular web apps reference this shared integration library at
    # the origin root.  Without this route the FeDiT SPA returns index.html
    # for JavaScript and the embedded Volume/TensorBoard/KServe pages stay
    # blank even though their upstream service is healthy.
    location = /dashboard_lib.bundle.js {
        proxy_pass http://host.docker.internal:13104/dashboard_lib.bundle.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header kubeflow-userid user@example.com;
        proxy_set_header X-Auth-Request-Email user@example.com;
        proxy_set_header X-Auth-Request-User user@example.com;
        proxy_read_timeout 300s;
    }

    location /tensorboards/ {
        proxy_pass http://host.docker.internal:13101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /tensorboards;
        proxy_set_header kubeflow-userid user@example.com;
        proxy_set_header X-Auth-Request-Email user@example.com;
        proxy_set_header X-Auth-Request-User user@example.com;
        proxy_read_timeout 300s;
    }

    location /kserve-endpoints/ {
        proxy_pass http://host.docker.internal:13102/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /kserve-endpoints;
        proxy_set_header kubeflow-userid user@example.com;
        proxy_set_header X-Auth-Request-Email user@example.com;
        proxy_set_header X-Auth-Request-User user@example.com;
        proxy_read_timeout 300s;
    }

    location /pipeline/ {
        proxy_pass http://host.docker.internal:13103/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /pipeline;
        proxy_set_header kubeflow-userid user@example.com;
        proxy_set_header X-Auth-Request-Email user@example.com;
        proxy_set_header X-Auth-Request-User user@example.com;
        proxy_read_timeout 300s;
    }

    location = /pipeline {
        proxy_pass http://host.docker.internal:13103/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /pipeline;
        proxy_set_header kubeflow-userid user@example.com;
        proxy_set_header X-Auth-Request-Email user@example.com;
        proxy_set_header X-Auth-Request-User user@example.com;
        proxy_read_timeout 300s;
    }

    location /label-studio/ {
        proxy_pass http://host.docker.internal:15003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Label Studio embeds its public URL in HTML and JavaScript. Rebind it
        # to the browser address so SSH forwarding and host-name access work.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript;
        sub_filter "__LABEL_STUDIO_PUBLIC_URL__" "$scheme://$http_host/label-studio";
        proxy_set_header kubeflow-userid user@example.com;
        proxy_set_header X-Auth-Request-Email user@example.com;
        proxy_set_header X-Auth-Request-User user@example.com;
        proxy_redirect ~^http://[^/]+/label-studio/ /label-studio/;
        proxy_read_timeout 300s;
    }

    # Label Studio emits absolute /user, /static, /api and /data URLs after
    # login. Route those browser requests back to the same container.
    location /user/ {
        proxy_pass http://host.docker.internal:15003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header kubeflow-userid user@example.com;
        proxy_set_header X-Auth-Request-Email user@example.com;
        proxy_set_header X-Auth-Request-User user@example.com;
        proxy_read_timeout 300s;
    }

    location /static/ {
        proxy_pass http://host.docker.internal:15003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header kubeflow-userid user@example.com;
        proxy_set_header X-Auth-Request-Email user@example.com;
        proxy_set_header X-Auth-Request-User user@example.com;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:15003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header kubeflow-userid user@example.com;
        proxy_set_header X-Auth-Request-Email user@example.com;
        proxy_set_header X-Auth-Request-User user@example.com;
        proxy_read_timeout 300s;
    }

    location /data/ {
        proxy_pass http://host.docker.internal:15003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header kubeflow-userid user@example.com;
        proxy_set_header X-Auth-Request-Email user@example.com;
        proxy_set_header X-Auth-Request-User user@example.com;
        proxy_read_timeout 300s;
    }
}
