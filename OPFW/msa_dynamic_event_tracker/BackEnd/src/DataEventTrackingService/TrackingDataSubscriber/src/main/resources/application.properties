spring.application.name=TrackingDataSubscriber

management.endpoints.web.exposure.include=health,info, prometheus 
management.endpoint.health.show-details=always

management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

spring.rabbitmq.host:{serverIp}
spring.rabbitmq.port:5674
spring.rabbitmq.username:guest
spring.rabbitmq.password:guest

rabbitmq.exchange.name:federate.tracking
rabbitmq.queue.name:tracking.subscriber.sub
rabbitmq.routing.key:tracking.Subscriber.sub.#

spring.kafka.bootstrap-servers:{kafkaIp}:9092
spring.kafka.cloud.bus.enabled: true

server.port=22439

spring.datasource.hikari.jdbc-url=jdbc:mariadb://{serverIp}:{dbPort}/dataEventTrackings?autoCommit=false&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&autoReconnect=true

spring.datasource.hikari.username={userId}
spring.datasource.hikari.password={userPw}
spring.datasource.hikari.maximum-pool-size=60
spring.datasource.hikari.minimumidle=10
spring.datasource.hikari.connection-test-query=SELECT 1

logging.config=classpath:logback/logback.xml

mybatis.mapper-locations=classpath:subscriber/mybatis/mapper/**/*.xml

ndxpro.base-url=http://{ndxproIp}:{ndxproPort}
ndxpro.access-token={ndxproToken}
ndxpro.connect-timeout-ms=3000
ndxpro.read-timeout-ms=10000

tracking.pool.data-schedule-size=5
tracking.pool.kafka-oc-size=5
tracking.pool.event-schedule-size=50
tracking.pool.ngsi-collect-size=60

ngsi.detail-fetch-parallelism=8
ngsi.max-refs-per-collect=200
ngsi.min-collect-gap-ms=10000
