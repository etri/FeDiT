spring.application.name=TrackingEventTrigger

management.endpoints.web.exposure.include=health,info, prometheus 
management.endpoint.health.show-details=always

management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

management.metrics.enable.jvm.memory.used =true

spring.rabbitmq.host:{serverIp}
spring.rabbitmq.port:5674
spring.rabbitmq.username:guest
spring.rabbitmq.password:guest

rabbitmq.exchange.name:federate.tracking
rabbitmq.queue.name:tracking.trigger.trn
rabbitmq.routing.key:tracking.trigger.trn.#

server.port=22449

spring.datasource.hikari.jdbc-url=jdbc:mariadb://{serverIp}:{dbPort}/dataEventTrackings?autoCommit=false&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&autoReconnect=true

spring.datasource.hikari.username={userId}
spring.datasource.hikari.password={userPw}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimumidle=10
spring.datasource.hikari.connection-test-query=SELECT 1

logging.config=classpath:logback/logback.xml

mybatis.mapper-locations=classpath:trigger/mybatis/mapper/**/*.xml
