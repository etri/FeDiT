# 해석엔진 컨테이너 실행 예시. FeDiT 쪽 compose와 합칠 때 값만 맞추면 된다.
#   JOBS_HOST_DIR     공유 폴더(작업 루트). FeDiT 컨테이너도 같은 폴더를 붙여 결과를 직접 읽는다(README 3·5절)
#   NVCACHE_HOST_DIR  JIT 캐시 폴더. 지우지 말 것
#   FEDIT_RESULT_URL  FeDiT 결과 수신 API 주소
#   FEDIT_RESULT_TOKEN 결과 수신 API가 인증을 요구하면 Bearer 토큰
# 실행:  docker compose -f integration/docker-compose.yml up -d
services:
  engine:
    image: fedit-engine
    restart: unless-stopped
    # 지정하지 않으면 root로 돌아 공유 폴더의 결과 파일 주인이 root가 된다.
    # FeDiT나 서버 사용자가 결과를 지워야 하면 그 사용자의 uid:gid로 맞춘다. /jobs, /nvcache 폴더에 쓰기 권한이 있어야 한다.
    # user: "1000:1000"
    environment:
      FEDIT_RESULT_URL: ${FEDIT_RESULT_URL:-}
      FEDIT_RESULT_TOKEN: ${FEDIT_RESULT_TOKEN:-}
    volumes:
      - ${JOBS_HOST_DIR:-./jobs}:/jobs
      - ${NVCACHE_HOST_DIR:-./nvcache}:/nvcache
    # Engine API는 서버 밖으로 열지 않는다. 같은 서버의 FeDiT만 부른다(README 5절).
    ports:
      - "127.0.0.1:${ENGINE_PORT:-18080}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
