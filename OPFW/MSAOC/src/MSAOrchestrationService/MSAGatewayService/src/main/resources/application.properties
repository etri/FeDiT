# suppress inspection "UnusedProperty" for whole file
spring.application.name=eureka-gateway-service

spring.security.user.name=msaOrchstr
spring.security.user.password=fdt$Twns21!

eureka.instance.hostname=localhost
eureka.instance.preferIpAddress=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://${spring.security.user.name}:${spring.security.user.password}@localhost:8761/eureka/

eureka.client.registry-fetch-interval-seconds=3
eureka.client.disable-delta=true

# Heart beat 보내는 인터벌, default 30
eureka.instance.lease-renewal-interval-in-seconds=10
# heartbeat 전송되지 않을시 인스턴스 제거 대기시간, lease-renewal-interval-in-seconds 보단 길어야함, default 90
eureka.instance.lease-expiration-duration-in-seconds=20


eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${spring.application.instance_id:${server.port}}

#application.properties
management.endpoints.web.exposure.include=health,info 
management.endpoint.health.show-details=always

management.info.env.enabled=true

#서버 포트 동적 생성 시 0 설정
#server.port=0

server.port=8000

#msa routes 
spring.cloud.loadbalancer.ribbon.enabled=true

spring.cloud.gateway.routes[0].id=ControlCommandReceiver
spring.cloud.gateway.routes[0].uri=lb://ControlCommandReceiver
spring.cloud.gateway.routes[0].predicates[0].name=Path
spring.cloud.gateway.routes[0].predicates[0].args.pattern=/fdt/msaoc/rcv/**

spring.cloud.gateway.routes[1].id=ControlCommandProducer
spring.cloud.gateway.routes[1].uri=lb://ControlCommandProducer
spring.cloud.gateway.routes[1].predicates[0].name=Path
spring.cloud.gateway.routes[1].predicates[0].args.pattern=/fdt/msaoc/prd/**

spring.cloud.gateway.routes[2].id=ResultDataConsumer
spring.cloud.gateway.routes[2].uri=lb://ResultDataConsumer
spring.cloud.gateway.routes[2].predicates[0].name=Path
spring.cloud.gateway.routes[2].predicates[0].args.pattern=/fdt/msaoc/csm/**

spring.cloud.gateway.routes[3].id=ResultDataTransmitter
spring.cloud.gateway.routes[3].uri=lb://ResultDataTransmitter
spring.cloud.gateway.routes[3].predicates[0].name=Path
spring.cloud.gateway.routes[3].predicates[0].args.pattern=/fdt/msaoc/tsm/**

