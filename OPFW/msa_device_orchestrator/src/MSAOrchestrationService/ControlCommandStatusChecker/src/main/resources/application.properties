spring.application.name=ControlCommandStatusChecker

#application.properties
management.endpoints.web.exposure.include=health,info 
management.endpoint.health.show-details=always

management.info.env.enabled=true

#RabbitMQ Config
spring.rabbitmq.host:{server ip}
spring.rabbitmq.port:5672
spring.rabbitmq.username:guest
spring.rabbitmq.password:guest

rabbitmq.exchange.name:federate.msaOrchstr
rabbitmq.queue.name:topic.publish.sts
rabbitmq.routing.key:topic.publish.sts.#



server.port=21459

#spring.datasource.hikari.initialization=true
#spring.datasource.hikari.initialization-mode=always
spring.datasource.hikari.jdbc-url=jdbc:mariadb://{server ip}:{server port}/federatedTwins?autoCommit=false&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&autoReconnect=true

spring.datasource.hikari.username={userId}
spring.datasource.hikari.password={userPw}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-test-query=SELECT 1


#logback  default
logging.config=classpath:logback/logback.xml


mybatis.mapper-config=classpath:mybatis-common/mybatis-config.xml

mybatis.mapper-locations=classpath:ctrlCmdStsChecker/mybatis/mapper/**/*.xml
