spring.application.name=eureka-gateway-service

spring.security.user.name={eurekaId}
spring.security.user.password={eurekaPw}

eureka.instance.hostname={server ip}
eureka.instance.preferIpAddress=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://${spring.security.user.name}:${spring.security.user.password}@{server ip}:8761/eureka/

eureka.client.registry-fetch-interval-seconds=3
eureka.client.disable-delta=true

eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=20


eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${spring.application.instance_id:${server.port}}

#application.properties
management.endpoints.web.exposure.include=health,info 
management.endpoint.health.show-details=always

management.info.env.enabled=true

server.port=8000

#msa routes 
spring.cloud.loadbalancer.ribbon.enabled=true

spring.cloud.gateway.routes[0].id=ControlCommandReceiver
spring.cloud.gateway.routes[0].uri=lb://ControlCommandReceiver
spring.cloud.gateway.routes[0].predicates[0].name=Path
spring.cloud.gateway.routes[0].predicates[0].args.pattern=/fdt/msaoc/rcv/**

#spring.cloud.gateway.routes[1].id=ControlCommandProducer
#spring.cloud.gateway.routes[1].uri=lb://ControlCommandProducer
#spring.cloud.gateway.routes[1].predicates[0].name=Path
#spring.cloud.gateway.routes[1].predicates[0].args.pattern=/fdt/msaoc/prd/**

spring.cloud.gateway.routes[1].id=ResultDataConsumer
spring.cloud.gateway.routes[1].uri=lb://ResultDataConsumer
spring.cloud.gateway.routes[1].predicates[0].name=Path
spring.cloud.gateway.routes[1].predicates[0].args.pattern=/fdt/msaoc/csm/**

spring.cloud.gateway.routes[2].id=ResultDataTransmitter
spring.cloud.gateway.routes[2].uri=lb://ResultDataTransmitter
spring.cloud.gateway.routes[2].predicates[0].name=Path
spring.cloud.gateway.routes[2].predicates[0].args.pattern=/fdt/msaoc/tsm/**

spring.cloud.gateway.routes[3].id=FeDitApiGWReceiver
spring.cloud.gateway.routes[3].uri=lb://FeDitApiGWReceiver
spring.cloud.gateway.routes[3].predicates[0].name=Path
spring.cloud.gateway.routes[3].predicates[0].args.pattern=/fedit/api-gateway/rcv/**

spring.cloud.gateway.routes[4].id=FeDitApiGWReceiver
spring.cloud.gateway.routes[4].uri=lb://FeDitApiGWReceiver
spring.cloud.gateway.routes[4].predicates[0].name=Path
spring.cloud.gateway.routes[4].predicates[0].args.pattern=/fedit/**


# Logging
logging.level.gateway.filters.JwtAuthFilter=info
logging.file.name=/var/log/${spring.application.name}.log
logging.file.max-size=100MB
logging.file.max-history=5


# Routing
spring.cloud.gateway.loadbalancer.use404=true


