spring.application.name=ControlCommandProducer


#application.properties
management.endpoints.web.exposure.include=health,info 
management.endpoint.health.show-details=always

management.info.env.enabled=true

iitp.fedit.orchstr.osfw-server.url=http://{server ip}
iitp.fedit.orchstr.osfw-server.port=1221

#Orchestration Eureka Gateway URL
iitp.fedit.orchstr.cloud-gateway.url=http://{server ip}
iitp.fedit.orchstr.cloud-gateway.port=8000


#RabbitMQ Config
spring.rabbitmq.host:{server ip}
spring.rabbitmq.port:5673
spring.rabbitmq.username:guest
spring.rabbitmq.password:guest

rabbitmq.exchange.name:federate.msaOrchstr
rabbitmq.queue.name:topic.publish.pub
rabbitmq.routing.key:topic.publish.pub.#


server.port=21429

#spring.datasource.hikari.initialization=true
#spring.datasource.hikari.initialization-mode=always
spring.datasource.hikari.jdbc-url=jdbc:mysql://{server ip}:{server port}/federatedTwins?autoCommit=false&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&autoReconnect=true

spring.datasource.hikari.username={userId}
spring.datasource.hikari.password={userPw}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-test-query=SELECT 1


logging.config=classpath:logback/logback.xml


#mybatis.mapper-config=classpath:mybatis-common/mybatis-config.xml
mybatis.mapper-locations=classpath:producer/mybatis/mapper/**/*.xml
