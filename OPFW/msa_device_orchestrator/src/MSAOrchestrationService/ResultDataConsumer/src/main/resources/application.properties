spring.application.name=ResultDataConsumer

spring.security.user.name={eurekaId}
spring.security.user.password={eurekaPw}

eureka.instance.hostname={server ip}
eureka.instance.preferIpAddress=true

eureka.client.service-url.defaultZone=http://${spring.security.user.name}:${spring.security.user.password}@{server ip}:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.registry-fetch-interval-seconds=3
eureka.client.disable-delta=true

eureka.instance.lease-renewal-interval-in-seconds=3
eureka.instance.lease-expiration-duration-in-seconds=10

eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${spring.application.instance_id:${server.port}}

#application.properties
management.endpoints.web.exposure.include=health,info 
management.endpoint.health.show-details=always

management.info.env.enabled=true


#RabbitMQ Config
spring.rabbitmq.host:{server ip}
spring.rabbitmq.port:5673
spring.rabbitmq.username:guest
spring.rabbitmq.password:guest

rabbitmq.exchange.name:federate.msaOrchstr
rabbitmq.queue.name:topic.subscribe.sub
rabbitmq.routing.key:topic.subscribe.sub.#


server.port=21439

## Linux Centos7 parameter
script.engine.name:nashorn

## Window OS parameter
#script.engine.name:graal.js


#spring.datasource.hikari.initialization=true
#spring.datasource.hikari.initialization-mode=always
spring.datasource.hikari.jdbc-url=jdbc:mariadb://{server ip}:{server port}/federatedTwins?autoCommit=false&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&autoReconnect=true

spring.datasource.hikari.username={userId}
spring.datasource.hikari.password={userPw}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1


logging.config=classpath:logback/logback.xml

#mybatis.mapper-config=classpath:mybatis-common/mybatis-config.xml

mybatis.mapper-locations=classpath:consumer/mybatis/mapper/**/*.xml