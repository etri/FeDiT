version: '3'
services:
  msaorchestrationservice:
    container_name: msaorchestrationservice
    image: msa-orc
    ports:
      - 8000:8000
      - 8761:8761
      - 21419:21419
      - 21429:21429
      - 21439:21439
      - 21449:21449
    volumes:
      - type: bind
        source: /data/federatedTwins/ctrlCmdReceiver
        target: /hdd/federatedTwins/ctrlCmdReceiver
      - type: bind
        source: /data/federatedTwins/ctrlCmdProducer
        target: /hdd/federatedTwins/ctrlCmdProducer
      - type: bind
        source: /data/federatedTwins/rsDtConsumer
        target: /hdd/federatedTwins/rsDtConsumer
      - type: bind
        source: /data/federatedTwins/rsDtTransmitter
        target: /hdd/federatedTwins/rsDtTransmitter
      - type: bind
        source: /data/federatedTwins/ctrlCmdStsChecker
        target: /hdd/federatedTwins/ctrlCmdStsChecker
    env_file: .env.prod
    networks:
      - msa-network
    restart: unless-stopped
  rabbitmq:
    container_name: rabbitmq_msa
    image: rabbitmq:3.7.14-management-alpine 
    volumes:
      - /hdd/rabbitmq/data/msa/:/var/lib/rabbitmq/mnesia
      - /hdd/rabbitmq/logs/msa/:/var/log/rabbitmq/
    environment: 
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672" 
      - "15672:15672"
      - "4369:4369"
      - "5671:5671"
      - "15671:15671"
      - "25672:25672"
      - "1883:1883"
      - "8883:8883"
      - "61613:61613"
      - "61614:61614"
    networks:
      - msa-network
    restart: unless-stopped 
  mariadb:
    image: mariadb:10
    ports:
      - 21217:3306
    volumes:
      - ./db/conf.d:/etc/mysql/conf.d
      - /hdd/dataTest/mariadb:/hdd/data/mariadb
      - ./db/initdb.d:/docker-entrypoint-initdb.d
    env_file: .env
    environment:
        TZ: Asia/Seoul
    networks:
      - msa-network
    restart: unless-stopped
networks:
 msa-network:
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1







