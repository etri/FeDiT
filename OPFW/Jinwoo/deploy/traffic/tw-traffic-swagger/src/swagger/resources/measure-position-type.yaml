get:
  tags: 
    - measure-position
  summary: measure-position-type 정보 가져오기
  parameters:
    - $ref: '../parameters/query/dataName.yaml'
    - $ref: '../parameters/query/page_number.yaml'
    - $ref: '../parameters/query/number_of_rows.yaml'

  responses:
    200:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              code:
                type: integer
              msg:
                type: string
              pageNumber:
                type: integer
              numberOfRows:
                type: integer
              totalCount:
                type: integer
              list:
                type: array
                items: 
                  $ref: '../schemas/measure-position-type.yaml'
    500:
      description: ERROR
