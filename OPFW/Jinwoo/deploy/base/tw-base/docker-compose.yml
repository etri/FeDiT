version: "3.7"
services:
  tw-minio:
    image: minio/minio
    entrypoint: [""]
    command: ["sh", "-c", "mkdir -p /data/mimir && minio server --quiet /data"]
    environment:
      - MINIO_ROOT_USER=mimir
      - MINIO_ROOT_PASSWORD=supersecret
    volumes:
      - ./docker-bind/generated-data/mimir-grafana/minio-data:/data
    hostname: minio

  tw-grafana:
    image: grafana/grafana:latest
    pull_policy: always
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_DEFAULT_THEME=light
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=critical
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - ./docker-bind/init-data/mimir-grafana/config/grafana.ini:/etc/grafana/grafana.ini
      - ./docker-bind/generated-data/mimir-grafana/grafana-data:/var/lib/grafana
      - ./docker-bind/init-data/mimir-grafana/config/grafana-provisioning-dashboards.yaml:/etc/grafana/provisioning/dashboards/provisioning-dashboards.yaml:ro
      - ./docker-bind/init-data/mimir-grafana/config/grafana-provisioning-datasources.yaml:/etc/grafana/provisioning/datasources/provisioning-datasources.yaml:ro
      - ./docker-bind/init-data/mimir-grafana/operations/mimir-mixin-compiled/dashboards/twin-environment-memory.json:/var/lib/grafana/dashboards/twin-environment-memory.json:ro
      - ./docker-bind/init-data/mimir-grafana/operations/mimir-mixin-compiled/dashboards/twin-tourism-memory.json:/var/lib/grafana/dashboards/twin-tourism-memory.json:ro
      - ./docker-bind/init-data/mimir-grafana/operations/mimir-mixin-compiled/dashboards/twin-traffic-memory.json:/var/lib/grafana/dashboards/twin-traffic-memory.json:ro
    ports:
      - ${GRAFANA__SERVICE_PORT}:3000

  tw-load-balancer:
    image: nginx:latest
    hostname: tw-mimir
    volumes:
      - ./docker-bind/init-data/mimir-grafana/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker-bind/generated-data/logs/nginx:/var/log/nginx
    depends_on:
      - "tw-mimir-1"
      - "tw-mimir-2"
      - "tw-mimir-3"
    ports:
      - ${MIMIR__SERVICE_PORT}:9009

  tw-mimir-1:
    image: grafana/mimir:latest
    command: ["-config.file=/etc/mimir.yaml"]
    hostname: mimir-1
    depends_on:
      - tw-minio
    volumes:
      - ./docker-bind/init-data/mimir-grafana/config/mimir.yaml:/etc/mimir.yaml
      - ./docker-bind/init-data/mimir-grafana/config/alertmanager-fallback-config.yaml:/etc/alertmanager-fallback-config.yaml
      - ./docker-bind/generated-data/mimir-grafana/mimir-1-data:/data

  tw-mimir-2:
    image: grafana/mimir:latest
    command: ["-config.file=/etc/mimir.yaml"]
    hostname: mimir-2
    depends_on:
      - tw-minio
    volumes:
      - ./docker-bind/init-data/mimir-grafana/config/mimir.yaml:/etc/mimir.yaml
      - ./docker-bind/init-data/mimir-grafana/config/alertmanager-fallback-config.yaml:/etc/alertmanager-fallback-config.yaml
      - ./docker-bind/generated-data/mimir-grafana/mimir-2-data:/data

  tw-mimir-3:
    image: grafana/mimir:latest
    command: ["-config.file=/etc/mimir.yaml"]
    hostname: mimir-3
    depends_on:
      - tw-minio
    volumes:
      - ./docker-bind/init-data/mimir-grafana/config/mimir.yaml:/etc/mimir.yaml
      - ./docker-bind/init-data/mimir-grafana/config/alertmanager-fallback-config.yaml:/etc/alertmanager-fallback-config.yaml
      - ./docker-bind/generated-data/mimir-grafana/mimir-3-data:/data

  tw-opentelemetry-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    volumes:
      - ./docker-bind/init-data/otel-collector/config/config.yml/:/etc/opentelemetry-collector.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - "--config=/etc/opentelemetry-collector.yml"
    hostname: tw-opentelemetry-collector
    ports:
      - 4317:4317
      - 13133:13133
      - 8889:8889
      
networks:
  default:
    name: network-tw-base
    external: true