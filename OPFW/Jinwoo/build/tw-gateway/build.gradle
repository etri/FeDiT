plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'kr.co.jinwoosi'
version = '0.0.1-SNAPSHOT'
project.ext.archiveName = 'tw-gateway'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()

    maven {
        url "http://dev.jinwoosi.co.kr:8081/repository/jw-repo-snapshot/"
        credentials {
            username "jw-repo-snapshot-user"
            password "jin1234"
        }
        allowInsecureProtocol true
    }
}

ext {
    set('springCloudVersion', "2023.0.1")
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'

    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
//    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.4.1'

    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'net.jw:jcms-base-java17:1.0-SNAPSHOT'
    implementation 'net.jw:twin-repository-db-java17:1.0-SNAPSHOT'

    implementation 'dev.akkinoc.util:yaml-resource-bundle:2.9.1'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar'){
    archiveFileName = "${project.ext.archiveName}.${archiveExtension.get()}"
}