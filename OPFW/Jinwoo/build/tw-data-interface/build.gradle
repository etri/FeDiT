import java.text.SimpleDateFormat

buildscript{
    repositories{
        mavenCentral()
    }
    dependencies{
        classpath 'org.yaml:snakeyaml:2.0'
    }
}

plugins {
    id 'org.springframework.boot' version '3.0.2'
    id 'io.spring.dependency-management' version "1.1.0"
    id 'org.hidetake.ssh' version '2.11.2'
    id 'java'
}

project.ext.version = new Properties()
project.ext.version.sourceCompatibility = '17';
project.ext.archiveName = "tw-data-interface"

group 'net.jw'
version '1.0-SNAPSHOT'
project.ext.assetSrcPath = "src/assets/config"
project.ext.assetDstPath = "src/main/resources/config"


configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}


repositories {
    mavenCentral()
    flatDir {
        dirs "${projectDir}/../libs"
    }
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
//    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    implementation 'org.hibernate:hibernate-validator:8.0.0.Final'

    implementation 'org.springframework.boot:spring-boot-starter-freemarker'

    // resource yml load
    implementation 'dev.akkinoc.util:yaml-resource-bundle:2.9.1'

    // db
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.1'


//    runtimeOnly 'mysql:mysql-connector-java'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.4'

    // data bind
//    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.2'
//    implementation 'com.google.code.gson:gson:2.10.1'

    // inhouse lib
    implementation 'net.jw:twin-utils-java17:1.0-SNAPSHOT'
//    implementation 'net.jw:jcms-base-java17:1.0-SNAPSHOT'
//    implementation('net.jw:twin-db-java17:1.0-SNAPSHOT'){
//        exclude group: 'log4j', module: 'log4j'
//    }
    implementation 'net.jw:twin-common-java17:1.0-SNAPSHOT'
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.19'

    // json
    implementation 'com.google.code.gson:gson:2.9.1'

    // https://mvnrepository.com/artifact/org.apache.avro/avro
    implementation 'org.apache.avro:avro:1.11.1'

    // https://mvnrepository.com/artifact/org.xerial.snappy/snappy-java
    implementation 'org.xerial.snappy:snappy-java:1.1.9.1'


    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testImplementation 'org.hamcrest:hamcrest:2.2'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'

    // https://mvnrepository.com/artifact/com.fasterxml.jackson.dataformat/jackson-dataformat-avro
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-avro:2.15.2'

    testImplementation 'net.jw:jcms-base-java17:1.0-SNAPSHOT'
    testImplementation 'net.jw:twin-db-java17:1.0-SNAPSHOT'
}

test {
    useJUnitPlatform()
}

def buildTime() {
    final dateFormat = new SimpleDateFormat("yyyy-MM-dd HH:mm:ssZ")
    dateFormat.timeZone = TimeZone.getTimeZone("Asia/Seoul")
    dateFormat.format(new Date())
}

springBoot {
    buildInfo {
        properties {
            additional = [
                    'java.version': JavaVersion.current(),
                    'time' : buildTime()
            ]
        }
    }
}

def taskCopy = tasks.register('copyConfigSettings', Copy){
    group 'copy resources'
    from(project.ext.assetSrcPath){
        java.nio.file.Path projectPath = projectDir.toPath()
        java.nio.file.Path srcPath = java.nio.file.Paths.get(project.ext.assetSrcPath)
        java.nio.file.Path filePath = java.nio.file.Paths.get(projectPath.toString(), srcPath.toString(), "application.yml")
        File ymlFile = new File(filePath.toString())
        def yml = new org.yaml.snakeyaml.Yaml().load( ymlFile.newInputStream() )

        include "i18n/*"
        include "**/logback-dev.yml"
        include "**/logback-prod.yml"
        include "application.yml"
        include "logback-spring.xml"

        def array = yml.spring.profiles.group['dev']
        for(String profile in array){
            include "application-${profile}.yml"
            println "profile : ${profile}"
        }

        array = yml.spring.profiles.group['prod']
        for(String profile in array){
            include "application-${profile}.yml"
            println "profile : ${profile}"
        }
    }
    into project.ext.assetDstPath
}

def taskDelete = tasks.register('deleteConfigSettings', Delete){
    group 'copy resources'
    delete project.ext.assetDstPath
}

def deleteSpecificResources = tasks.register('deleteSpecificResources', Delete) {
    // processResources 태스크가 시작되기 전에 실행되도록 설정
    mustRunAfter clean

    // 삭제할 파일들을 지정
//    delete fileTree(dir: "${layout.buildDirectory.get().asFile.absolutePath}/resources/main") {
//        include "**/application-common.yml"  // 예: 특정 파일 삭제
//    }
    delete {
        fileTree(layout.buildDirectory.dir("resources/main")) {
            include "**/application-common.yml"
        }
    }
}

processResources  {
    filesMatching('**/application-common.yml'){
        def date = new Date().format('yyyyMMddHHmmss')
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens:[
                BUILD_DATE: date
        ])
    }
}

taskCopy.configure{
    dependsOn taskDelete
}

tasks.named('clean'){
    finalizedBy taskCopy
}

tasks.named('processResources'){
    dependsOn taskCopy
}

tasks.named('bootJar'){
    archiveFileName = "${project.ext.archiveName}.${archiveExtension.get()}"
}