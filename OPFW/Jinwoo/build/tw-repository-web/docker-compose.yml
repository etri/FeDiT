version: "3.8"
services:
  tw-repository:
    container_name: tw-repository
    image: tomcat:8.5.78-jre8-openjdk
    ports:
      - "8088:8080"
    environment:
      - "JAVA_OPTS=-Dspring.profiles.active=prod"
    #      spring.profiles.active: prod
    #      TZ: "Asia/Seoul"
    volumes:
      - type: bind
        source: /jw/docker/projs/twin.tw/volume/tw-repository/svc/webapps
        target: /usr/local/tomcat/webapps
      - type: bind
        source: /jw/docker/projs/twin.tw/volume/tw-repository/logs
        target: /usr/local/tomcat/prod_logs
      - type: bind
        source: /jw/docker/projs/twin.tw/volume/tw-repository/svc/secrets
        target: /jw/secrets
      - type: bind
        source: /jw/docker/projs/twin.tw/volume/tw-repository/svc/static
        target: /jw/static
    #      - /build/libs/tw-repository-web-1.0-SNAPSHOT.war:/usr/local/tomcat/webapps/ROOT.war
    restart: "always"
    #    command: tail -f /dev/null
    extra_hosts:
      - "host.docker.internal:host-gateway"