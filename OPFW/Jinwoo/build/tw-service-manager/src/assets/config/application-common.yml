spring:
  config:
    activate:
      on-profile: common
  messages:
    basename: config/i18n/exception, config/i18n/exception_common, config/i18n/data
    encoding: UTF-8
  mvc:
    converters:
      preferred-json-mapper: gson

server:
  port: ${server-port}

logging:
  config: classpath:config/logback-spring.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    display-request-duration: true
    defaultModelsExpandDepth: -1
    tags-sorter: alpha
  api-docs:
    path: /api-docs
  #  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match:
    - /v1/**


build:
  version: 1.0
  date: @BUILD_DATE@