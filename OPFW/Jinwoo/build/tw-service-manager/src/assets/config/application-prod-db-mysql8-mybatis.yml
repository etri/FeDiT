spring:
  config:
    activate:
      on-profile: prod-db-mysql8-mybatis
  datasource:
    url: jdbc:mariadb://${prod-jdbc-socket-address}/repository
    driver-class-name: org.mariadb.jdbc.Driver
    username:
    password:

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: net.jw.twin.repository.**.model
  mapper-locations: config/mybatis/repository/**/*.xml, mybatis/repository/**/*.xml

custom:
