buildscript{
    repositories{
        mavenCentral()
    }
    dependencies{
        classpath 'org.yaml:snakeyaml:2.0'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.0.2'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'org.hidetake.ssh' version '2.11.2'
}

project.ext.version = new Properties()
project.ext.version.sourceCompatibility = '17'
project.ext.archiveName = 'tw-service-manager'

group = 'net.jw'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = project.ext.version.sourceCompatibility
project.ext.version.java_version = 'java17'
project.ext.assetSrcPath = "src/assets/config"
project.ext.assetDstPath = "src/main/resources/config"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
//    local 컴퓨터에 배포된 net.jw ... artifact 사용시 아래 주석 해제
//    mavenLocal{
//        content {
////            includeGroup "net.jw"
//            includeModule("net.jw", "twin-datacollector-common-redis-java17")
//        }
//    }
    maven {
        url project.repoUrl
        credentials {
            username project.repoUser
            password project.repoPassword
        }
        allowInsecureProtocol true
    }
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'dev.akkinoc.util:yaml-resource-bundle:2.9.1'

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.apache.commons:commons-lang3:3.12.0'

    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.1'
//    runtimeOnly 'mysql:mysql-connector-java'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.19'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'

    // inhouse lib
    implementation 'net.jw:jcms-base-java17:1.0-SNAPSHOT'
    implementation 'net.jw:twin-repository-db-java17:1.0-SNAPSHOT'
    implementation 'net.jw:twin-common-java17:1.0-SNAPSHOT'

    implementation 'org.aspectj:aspectjweaver:1.9.5'


    
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def outputFolder__tw_gradle_generated = "${rootDir}\\.gradle-generated"
def outputFolder__output = "${outputFolder__tw_gradle_generated}\\output"

def taskCopy = tasks.register('copyConfigSettings', Copy){
    group 'copy resources'
    from(project.ext.assetSrcPath){
        java.nio.file.Path projectPath = projectDir.toPath()
        java.nio.file.Path srcPath = java.nio.file.Paths.get(project.ext.assetSrcPath)
        java.nio.file.Path filePath = java.nio.file.Paths.get(projectPath.toString(), srcPath.toString(), "application.yml")
        File ymlFile = new File(filePath.toString())
        def yml = new org.yaml.snakeyaml.Yaml().load( ymlFile.newInputStream() )

        include "i18n/*"
        include "**/logback-dev.yml"
        include "**/logback-prod.yml"
        include "application.yml"
        include "logback-spring.xml"

        def array = yml.spring.profiles.group['dev']
        for(String profile in array){
            include "application-${profile}.yml"
            println "profile : ${profile}"
        }

        array = yml.spring.profiles.group['prod']
        for(String profile in array){
            include "application-${profile}.yml"
            println "profile : ${profile}"
        }
    }
    into project.ext.assetDstPath
}

def taskDelete = tasks.register('deleteConfigSettings', Delete){
    group 'copy resources'
    delete project.ext.assetDstPath
}

def deleteSpecificResources = tasks.register('deleteSpecificResources', Delete) {
    // processResources 태스크가 시작되기 전에 실행되도록 설정
    mustRunAfter clean

    // 삭제할 파일들을 지정
//    delete fileTree(dir: "${layout.buildDirectory.get().asFile.absolutePath}/resources/main") {
//        include "**/application-common.yml"  // 예: 특정 파일 삭제
//    }
    delete {
        fileTree(layout.buildDirectory.dir("resources/main")) {
            include "**/application-common.yml"
        }
    }
}

processResources  {
    filesMatching('**/application-common.yml'){
        def date = new Date().format('yyyyMMddHHmmss')
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens:[
                BUILD_DATE: date
        ])
    }
}

deleteSpecificResources.configure {
    dependsOn taskDelete
}

taskCopy.configure{
    dependsOn deleteSpecificResources
}

tasks.named('clean'){
    finalizedBy taskCopy
}

tasks.named('processResources'){
    dependsOn taskCopy
}

tasks.named('bootJar'){
    archiveFileName = "${project.ext.archiveName}.${archiveExtension.get()}"
}

tasks.named('bootRun'){

    println("project.dev_jdbcSocketAddress : " + project.dev_jdbcSocketAddress)

    systemProperty 'spring.profiles.active', project.intellij_activeProfile

    systemProperty 'server-port', project.properties["server-port"]

    systemProperty 'prod-jdbc-socket-address', project.prod_jdbcSocketAddress
    systemProperty 'dev-jdbc-socket-address', project.dev_jdbcSocketAddress
}

def deleteDockerCompose = tasks.register('deleteOutput', Delete){
    group 'custom'

    doFirst {
        def dstFileName = "${outputFolder__output}"
        delete dstFileName
    }
}

def generateDistributeOutput = tasks.register('generateDistributeOutput') {
    group 'custom'

    dependsOn "deleteOutput"

    doFirst {
        def projectName = "twin.tw"
        def artifactName = '' + project.ext.archiveName
        def servicePort = '' + project.properties["server-port"]
        def serviceFolder__volume = "/jw/docker/projs/${projectName}/poc1/base"

        // dockerfile
        copy {
            from "${rootDir}\\dist-resource\\dockerfile\\openjdk17-oracle"
            into "${outputFolder__output}\\${projectName}\\poc1\\base\\${artifactName}"
            include "Dockerfile"
        }

        // docker-compose
        copy {
            from "${rootDir}\\dist-resource\\template"
            into "${outputFolder__output}\\${projectName}\\poc1\\base\\${artifactName}"
            include "docker-compose.yml"
//    rename { String fileName ->
//        // a simple way is to remove the "-$version" from the jar filename
//        // but you can customize the filename replacement rule as you wish.
//        fileName.replace("tw-datacollector-template", "${project.ext.archiveName}")
//    }
            filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [
                    "SERVICE_VOLUME"          : '' + serviceFolder__volume,
                    "ARTIFACT_NAME"           : artifactName,
                    "SERVER_PORT"             : servicePort,
                    "PROD_JDBC_SOCKET_ADDRESS": project.prod_jdbcSocketAddress,
                    "DEV_JDBC_SOCKET_ADDRESS" : project.dev_jdbcSocketAddress,
            ])
        }

        // service file
//        copy {
//            from "${rootDir}\\dist-resource\\template"
//            into "${outputFolder__output}\\${projectName}\\poc1\\base\\${artifactName}\\docker-bind\\init-data\\svc"
//            include "${artifactName}.service"
//            filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [
//                    "SERVER_PORT"             : servicePort,
//                    "ARTIFACT_NAME"           : artifactName,
//                    "PROD_JDBC_SOCKET_ADDRESS": project.prod_jdbcSocketAddress,
//                    "DEV_JDBC_SOCKET_ADDRESS" : project.dev_jdbcSocketAddress,
//            ])
//        }

        // entrypoint
        copy {
            from "${rootDir}\\dist-resource\\entrypoint-script"
            into "${outputFolder__output}\\${projectName}\\poc1\\base\\${artifactName}"
            include "entrypoint.sh"
        }
    }
}

def copyJarToOutput = tasks.register('copyJarToOutput') {
    group 'custom'

    def projectName = "twin.tw"
    def artifactName = '' + project.ext.archiveName
    def buildDirPath = layout.buildDirectory.get().asFile.absolutePath

    copy {
        from "${buildDirPath}\\${project.libsDirName}"
        into "${outputFolder__output}\\${projectName}\\poc1\\base\\${artifactName}\\docker-bind\\init-data\\svc"
        include "${project.ext.archiveName}.jar"
    }
}