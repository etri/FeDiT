spring.application.name=FeDitApiGWTransmitter

server.port=23449

#RabbitMQ Config
spring.rabbitmq.host:{server ip}
spring.rabbitmq.port:5672
spring.rabbitmq.username:guest
spring.rabbitmq.password:guest

rabbitmq.exchange.name:fedit.apiGateway
rabbitmq.queue.name:iitp.fedit.apiGateway.transmitter
rabbitmq.routing.key:iitp.fedit.apiGateway.transmitter.transData


iitp.fedit.orchstr.osfw-server.url=http://{server ip}
iitp.fedit.orchstr.osfw-server.port=1221

#spring.datasource.hikari.initialization=true
#spring.datasource.hikari.initialization-mode=always
spring.datasource.hikari.jdbc-url=jdbc:mysql://{server ip}:{server port}/ctrlApiGateway?autoCommit=false&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&autoReconnect=true

spring.datasource.hikari.username={userId}
spring.datasource.hikari.password={userPw}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-test-query=SELECT 1



logging.config=classpath:logback/logback.xml

