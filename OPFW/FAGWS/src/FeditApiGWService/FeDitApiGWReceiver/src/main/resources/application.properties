spring.application.name=FeDitApiGWReceiver

spring.security.user.name={eurekaId}
spring.security.user.password={eurekaPw}

eureka.instance.hostname={server ip}
eureka.instance.port=8761
eureka.instance.preferIpAddress=true
#eureka.instance.hostname={sever ip}

eureka.client.service-url.defaultZone=http://${spring.security.user.name}:${spring.security.user.password}@{server ip}:8761/eureka/



eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.registry-fetch-interval-seconds=3
eureka.client.disable-delta=true

eureka.instance.lease-renewal-interval-in-seconds=3

logging.level.com.netflix.eureka=ERROR
logging.level.com.netflix.discovery=ERROR


eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${spring.application.instance_id:${server.port}}

#application.properties
management.endpoints.web.exposure.include=health,info 
management.endpoint.health.show-details=always

management.info.env.enabled=true


spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
      
# swaggerdoc
springdoc.version=v1.0.0
springdoc.packages-to-scan=iitp.fedit.apiGateway.receiver.controller
springdoc.swagger-ui.path=/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/api-docs/json
springdoc.api-docs.groups.enabled=false
springdoc.cache.disabled=true
disable-swagger-default-url: true
springdoc.default-consumes-media-type=application/json;charset=UTF-8
springdoc.default-produces-media-type=application/json;charset=UTF-8
springdoc.swagger-ui.disable-swagger-default-url=true

#RabbitMQ Config
spring.rabbitmq.host:{server ip}
spring.rabbitmq.port:5672
spring.rabbitmq.username:guest
spring.rabbitmq.password:guest

rabbitmq.exchange.name:fedit.apiGateway
rabbitmq.queue.name:topic.publish.rec
rabbitmq.routing.key:topic.publish.rec.#

server.port=23419

spring.datasource.hikari.jdbc-url=jdbc:mariadb://{server ip}:{server port}/ctrlApiGateway?autoCommit=false&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&autoReconnect=true&allowMultiQueries=true

spring.datasource.hikari.username={userId}
spring.datasource.hikari.password={userPw}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimumidle=10
spring.datasource.hikari.connection-test-query=SELECT 1


#logback 설정 default
logging.config=classpath:logback/logback.xml


#mybatis.mapper-config=classpath:mybatis-common/mybatis-config.xml

#mybatis.mapper-locations=classpath:receiver/mybatis/mapper/**/*.xml

mybatis.mapper-locations=