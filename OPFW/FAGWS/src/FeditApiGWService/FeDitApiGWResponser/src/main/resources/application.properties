spring.application.name=FeDitApiGWResponser


#RabbitMQ Config
spring.rabbitmq.host:{server ip}
spring.rabbitmq.port:5672
spring.rabbitmq.username:guest
spring.rabbitmq.password:guest

rabbitmq.exchange.name:fedit.apiGateway
rabbitmq.queue.name:iitp.fedit.apiGateway.responser
rabbitmq.routing.key:iitp.fedit.apiGateway.responser.resultMsg

server.port=23439

spring.datasource.hikari.jdbc-url=jdbc:mariadb://{server ip}:{server port}/ctrlApiGateway?autoCommit=false&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&autoReconnect=true

spring.datasource.hikari.username={userId}
spring.datasource.hikari.password={userPw}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-test-query=SELECT 1


logging.config=classpath:logback/logback.xml

#mybatis.mapper-config=classpath:mybatis-common/mybatis-config.xml

#mybatis.mapper-locations=classpath:rsReceiver/mybatis/mapper/**/*.xml
mybatis.mapper-locations=